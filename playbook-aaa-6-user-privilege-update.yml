---
- name: Remove unauthorized privileged user
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Validate rogue_user is safe to act on
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | default('') | length > 0
          - rogue_user | default('') not in ['admin', 'ansible', 'ec2-user', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account"
        success_msg: "rogue_user validated"

    - name: Remove unauthorized privileged user
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        state: absent

    - name: Verify the user no longer exists
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^username {{ rogue_user }}"
      failed_when: false
      changed_when: false
