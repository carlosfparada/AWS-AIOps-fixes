---
- name: Remediate %AAA-6-USER_PRIVILEGE_UPDATE (unauthorized privilege escalation to 15)
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate required input variables
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | string | length > 0
          - rogue_user not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account"
        quiet: true

    - name: Remove elevated privilege 15 from the reported user (downgrade to privilege 1)
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        privilege: 1
        state: present
      register: privilege_fix

    - name: Read the local user configuration for verification
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ rogue_user }}"
      register: user_config
      failed_when: false
      changed_when: false

    - name: Confirm the user no longer has privilege 15
      ansible.builtin.assert:
        that:
          - privilege_fix is not failed
          - user_config.stdout[0] is not search('username\\s+' ~ rogue_user ~ '\\s+.*privilege\\s+15')
        fail_msg: "User {{ rogue_user }} still holds privilege 15 after remediation"
        success_msg: "User {{ rogue_user }} downgraded to privilege 1 successfully"

    - name: Display verification output
      ansible.builtin.debug:
        var: user_config.stdout_lines
