---
- name: Remove unauthorized privileged user from Cisco IOS device
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Assert rogue_user is defined, non-empty, and not a protected account
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ec2-user', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not one of the protected accounts"

    - name: Remove the rogue privileged user
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        state: absent

    - name: Verify the rogue user no longer exists in the running config
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^username {{ rogue_user }}"
      register: verify_rogue_user
      failed_when: false
      changed_when: false
