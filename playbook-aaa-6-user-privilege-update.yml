---
- name: Remediate AAA-6-USER_PRIVILEGE_UPDATE - reset unexpected privilege escalation
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate required variables and protected accounts
      ansible.builtin.assert:
        that:
          - host_name is defined
          - host_name | string | length > 0
          - user_name is defined
          - user_name | string | length > 0
          - user_name not in ['admin', 'ansible', 'ansible_user']
          - privilege_level is defined
          - privilege_level | string | length > 0
          - privilege_level | int < 15
        fail_msg: >-
          Required variables missing or empty, protected account targeted,
          or privilege_level would not demote the user.

    - name: Set user back to the target (non-privileged) privilege level
      cisco.ios.ios_user:
        name: "{{ user_name }}"
        privilege: "{{ privilege_level }}"
        state: present
      register: user_update

    - name: Verify resulting user configuration
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ user_name }}"
      register: verify_output
      failed_when: false
      changed_when: false

    - name: Show verification result
      ansible.builtin.debug:
        msg:
          - "Updated: {{ user_update.changed | default(false) }}"
          - "Running-config entry: {{ verify_output.stdout | default(['no output'], true) | first }}"
