---
- name: Remove suspicious local user elevated to privilege 15
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Assert required variables are defined and safe
      ansible.builtin.assert:
        that:
          - host_name is defined
          - host_name | length > 0
          - user_name is defined
          - user_name | length > 0
          - user_name | lower not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "Required variable user_name is missing, empty, or refers to a protected user"
        quiet: true

    - name: Remove the suspicious local user account
      cisco.ios.ios_user:
        name: "{{ user_name }}"
        state: absent
      register: user_removal

    - name: Verify the user is gone from the running configuration (read-only)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ user_name }}"
      register: verify_user
      failed_when: false
      changed_when: false

    - name: Report remediation summary
      ansible.builtin.debug:
        msg:
          - "Removal of user {{ user_name }} applied: {{ user_removal.changed | default(false) }}"
          - "Remaining config lines for user: {{ verify_user.stdout | default('') }}"
