---
- name: Remediate unauthorized privilege escalation (AAA-6-USER_PRIVILEGE_UPDATE)
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate rogue_user is defined, non-empty and not a protected account
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account (admin, ansible, ansible_user)."
        quiet: true

    - name: Remove privilege 15 from the alerted local user
      cisco.ios.ios_config:
        lines:
          - "no username {{ rogue_user }} privilege 15"

    - name: Read current config lines for the alerted user (read-only)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ rogue_user }}"
      register: user_config
      failed_when: false
      changed_when: false
      when: not ansible_check_mode

    - name: Show resulting configuration lines for the alerted user
      ansible.builtin.debug:
        var: user_config.stdout_lines
      when: user_config.stdout_lines is defined

    - name: Verify privilege 15 is no longer present for the alerted user
      ansible.builtin.assert:
        that:
          - user_config.stdout_lines[0] is defined
          - "'privilege 15' not in (user_config.stdout_lines[0] | join(' '))"
        fail_msg: "User {{ rogue_user }} still has privilege 15 configured; manual review required."
        success_msg: "Privilege 15 removed for user {{ rogue_user }}; device matches expected state."
        quiet: true
      when: not ansible_check_mode
