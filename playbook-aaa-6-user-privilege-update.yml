---
- name: Remove unauthorized privileged user reported by Cisco IOS AAA alert
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ec2-user', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account"
        success_msg: "rogue_user validation passed"

    - name: Remove unauthorized privileged user
      cisco.ios.ios_config:
        lines:
          - "no username {{ rogue_user }}"

    - name: Verify user removal
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^username {{ rogue_user }}"
      register: verify_output
      failed_when: false
      changed_when: false
