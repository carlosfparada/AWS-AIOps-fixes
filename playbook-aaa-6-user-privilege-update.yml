---
- name: Mitigate unexpected privilege-15 assignment (AAA-6-USER_PRIVILEGE_UPDATE)
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Validate required input
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account"
        quiet: true

    - name: Downgrade the flagged user to least privilege (idempotent, check-mode safe)
      cisco.ios.ios_config:
        lines:
          - "username {{ rogue_user }} privilege 1"
      register: priv_downgrade

    - name: Read back the username configuration
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ rogue_user }}"
      register: username_check
      failed_when: false
      changed_when: false

    - name: Show resulting username configuration
      ansible.builtin.debug:
        var: username_check.stdout_lines[0]
