---
- name: Remove unauthorized privileged user on Cisco IOS device
  hosts: "{{ host_name }}"
  gather_facts: false
  connection: ansible.netcommon.network_cli

  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Assert rogue_user is defined, non-empty, and not a protected account
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ec2-user', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account"
        success_msg: "rogue_user validation passed"

    - name: Remove unauthorized privileged user
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        state: absent

    - name: Verify user was removed
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^username {{ rogue_user }}"
      register: verify_result
      failed_when: false
      changed_when: false

    - name: Show verification output
      ansible.builtin.debug:
        var: verify_result.stdout_lines
