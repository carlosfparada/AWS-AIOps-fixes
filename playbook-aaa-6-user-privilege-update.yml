---
- name: Remediate unauthorized privilege escalation (%AAA-6-USER_PRIVILEGE_UPDATE)
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Assert required variables are defined and protected accounts are untouched
      ansible.builtin.assert:
        that:
          - host_name is defined and host_name | length > 0
          - alert_username is defined and alert_username | length > 0
          - alert_username | lower not in ['admin', 'ansible', 'ansible_user', 'root']
        fail_msg: "Required variables missing, empty, or a protected username was supplied; no changes made."

    - name: Remove the unauthorized privileged user account
      cisco.ios.ios_user:
        name: "{{ alert_username }}"
        state: absent
      register: user_removed

    - name: Verify the user no longer exists in the running configuration
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ alert_username }}"
      register: verify_output
      failed_when: false
      changed_when: false

    - name: Report remediation result
      ansible.builtin.debug:
        msg:
          - "User '{{ alert_username }}' removal attempted: {{ user_removed.changed | default(false) }}"
          - "Running-config check after removal: {{ verify_output.stdout | default([]) }}"
