---
- name: Revert unauthorized privilege escalation detected by AAA-6-USER_PRIVILEGE_UPDATE
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Assert required variables are defined, non-empty and not protected
      ansible.builtin.assert:
        that:
          - host_name is defined
          - host_name | length > 0
          - target_user is defined
          - target_user | length > 0
          - target_user | lower not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "Required variables are missing, empty, or the target user is protected. Aborting."

    - name: Downgrade affected user to least privilege (idempotent)
      cisco.ios.ios_user:
        name: "{{ target_user }}"
        privilege: 1
        state: present
      register: privilege_fix

    - name: Verify resulting user configuration (read-only)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ target_user }}"
      register: verify_user
      when: not ansible_check_mode
      failed_when: false
      changed_when: false

    - name: Report remediation result
      ansible.builtin.debug:
        msg:
          - "Privilege remediation applied for user {{ target_user }} (changed: {{ privilege_fix.changed | default(false) }})"
          - "Current config lines: {{ verify_user.stdout | default(['skipped'], true) | join(' ') }}"
