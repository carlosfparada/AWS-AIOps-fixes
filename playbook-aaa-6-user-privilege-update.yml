---
- name: Remove unauthorized privileged user from Cisco IOS device
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate rogue_user parameter
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ec2-user', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account name"

    - name: Remove the unauthorized user from the device
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        state: absent

    - name: Verify the user is no longer configured
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^username {{ rogue_user }}"
      register: verify_result
      failed_when: false
      changed_when: false

    - name: Display verification output
      ansible.builtin.debug:
        var: verify_result.stdout_lines
