---
- name: Remediate %AAA-6-USER_PRIVILEGE_UPDATE - remove rogue privilege-15 user
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Validate rogue_user input
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account"
        success_msg: "rogue_user validated"

    - name: Delete the rogue privilege-15 user account
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        state: absent

    - name: Verify the rogue user is gone (read-only)
      cisco.ios.ios_command:
        commands:
          - show running-config | include username {{ rogue_user }}
      register: verify_output
      failed_when: false
      changed_when: false

    - name: Report remediation result
      ansible.builtin.debug:
        msg:
          - "Rogue user '{{ rogue_user }}' removal attempted on {{ host_name }}."
          - "Verification output: {{ verify_output.stdout | default(['no output']) }}"
