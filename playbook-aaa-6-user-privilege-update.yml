---
- name: Remediate %AAA-6-USER_PRIVILEGE_UPDATE (unexpected privilege 15 grant)
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Assert rogue_user is defined, non-empty, safe and not a protected account
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | string | length > 0
          - rogue_user | string is match('^[A-Za-z0-9._@-]+$')
          - rogue_user | string | lower not in ['admin', 'ansible', 'ansible_user']
        fail_msg: >-
          rogue_user must be defined, non-empty, alphanumeric-safe and not one of
          admin, ansible, ansible_user
        quiet: true

    - name: Revoke privilege 15 by resetting flagged local user to privilege 1
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        privilege: 1
        update_password: on_create
        state: present
      register: privilege_fix

    - name: Read running configuration for the flagged user
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ rogue_user }}"
      register: verify_output
      when: not ansible_check_mode
      failed_when: false
      changed_when: false

    - name: Verify the flagged user no longer holds privilege 15
      ansible.builtin.assert:
        that:
          - verify_output.stdout is defined
          - verify_output.stdout | length > 0
          - "'privilege 15' not in (verify_output.stdout[0] | default(''))"
        fail_msg: "{{ rogue_user }} still holds privilege 15 - manual review required"
        success_msg: "{{ rogue_user }} no longer holds privilege 15 (changed: {{ privilege_fix.changed | default(false) }})"
      when: not ansible_check_mode
