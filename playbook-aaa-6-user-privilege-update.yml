---
- name: Remediate AAA-6-USER_PRIVILEGE_UPDATE on Cisco IOS device
  hosts: "{{ host_name }}"
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Validate rogue_user is defined, non-empty and not a protected account
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | string | length > 0
          - rogue_user | string | lower not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account (admin, ansible, ansible_user)"
        success_msg: "rogue_user validation passed"

    - name: Remove privilege 15 from the rogue local user (demote to privilege 1)
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        privilege: 1
        state: present
      register: user_change
      check_mode: true
      changed_when: not ansible_check_mode and user_change.changed

    - name: Verify the rogue user configuration (read-only)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ rogue_user }} "
      register: verify_user
      failed_when: false
      changed_when: false

    - name: Show verification result
      ansible.builtin.debug:
        var: verify_user.stdout_lines
