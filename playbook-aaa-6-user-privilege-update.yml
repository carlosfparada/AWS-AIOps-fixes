---
- name: Remediate privilege escalation reported by %AAA-6-USER_PRIVILEGE_UPDATE
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate required variables before making any change
      ansible.builtin.assert:
        that:
          - target_username is defined
          - target_username | length > 0
          - target_username | lower not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "target_username is missing, empty, or a protected account; aborting"
        quiet: true

    - name: Remove the unauthorized local user account elevated to priv-15
      cisco.ios.ios_user:
        name: "{{ target_username }}"
        state: absent
      register: removal_result

    - name: Confirm the user is no longer configured on the device (read-only)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ target_username }}"
      register: verify_result
      failed_when: false
      changed_when: false

    - name: Report remediation result
      ansible.builtin.debug:
        msg:
          - "Removal changed device: {{ removal_result.changed | default(false) }}"
          - "Verification output: {{ verify_result.stdout | default(['no output']) }}"
