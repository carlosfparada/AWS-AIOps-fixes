---
- name: Remediate %AAA-6-USER_PRIVILEGE_UPDATE - remove unauthorized privilege escalation
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate required variables and protected accounts
      ansible.builtin.assert:
        that:
          - alert_username is defined
          - alert_username | length > 0
          - alert_username not in ['admin', 'ansible', 'ansible_user']
          - alert_privilege_level is defined
          - alert_privilege_level | int == 15
        fail_msg: "Required variables missing or protected account targeted; aborting."

    - name: Demote the flagged account from privilege 15 to privilege 0 (check mode supported)
      cisco.ios.ios_config:
        lines:
          - "username {{ alert_username }} privilege 0"
      register: demote_result

    - name: Verify running configuration for the flagged account (read-only)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ alert_username }}"
      register: verify_privilege
      failed_when: false
      changed_when: false

    - name: Report verification output
      ansible.builtin.debug:
        msg: "{{ verify_privilege.stdout[0] | default('No matching username line found') }}"
