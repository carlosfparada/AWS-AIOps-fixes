---
- name: Remediate unexpected privilege escalation reported by %AAA-6-USER_PRIVILEGE_UPDATE
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Assert required variables are defined and no protected account is targeted
      ansible.builtin.assert:
        that:
          - host_name is defined
          - host_name | length > 0
          - target_user is defined
          - target_user | length > 0
          - target_user | lower not in ['admin', 'ansible', 'ansible_user']
          - granted_privilege is defined
          - granted_privilege | length > 0
          - granted_privilege | int in range(0, 16)
        fail_msg: "Missing or invalid extra_vars, or a protected account was targeted; refusing to proceed"
        success_msg: "All required variables present and target account is safe to modify"

    - name: Demote the flagged local user to privilege level 1 (removes priv-15)
      cisco.ios.ios_user:
        name: "{{ target_user }}"
        privilege: 1
      register: user_change

    - name: Read back the local user configuration (read-only)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ target_user }} "
      register: verify_user
      failed_when: false
      changed_when: false

    - name: Confirm the flagged privilege is no longer present
      ansible.builtin.debug:
        msg:
          - "Remediation attempted for user {{ target_user }}"
          - "Current config line: {{ verify_user.stdout[0] | default('no matching line found') }}"
          - "Privilege level 15 removed: {{ 'privilege 15' not in (verify_user.stdout[0] | default('')) }}"
