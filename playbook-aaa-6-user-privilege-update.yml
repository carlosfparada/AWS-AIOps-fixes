---
- name: Remove unauthorized privileged user from Cisco IOS device
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Assert rogue_user is defined and safe to remediate
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ec2-user', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and not a protected account"

    - name: Remove unauthorized privileged user
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        state: absent

    - name: Verify user removal
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^username {{ rogue_user }}"
      register: rogue_user_check
      failed_when: false
      changed_when: false
