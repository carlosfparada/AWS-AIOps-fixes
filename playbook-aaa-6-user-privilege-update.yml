---
- name: Remediate rogue privilege-15 user account flagged by AAA alert
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Validate required variables and reject protected usernames
      ansible.builtin.assert:
        that:
          - target_username is defined
          - target_username | length > 0
          - target_username | lower not in ['admin', 'ansible', 'ansible_user', 'root', 'cisco', 'administrator']
        fail_msg: "target_username must be defined, non-empty, and not a protected account"
        quiet: true

    - name: Ensure rogue privileged user account is removed from the local user database
      cisco.ios.ios_user:
        name: "{{ target_username }}"
        state: absent
      register: rogue_user_removal

    - name: Confirm the user is no longer present in the running configuration
      cisco.ios.ios_command:
        commands:
          - "show run | include username {{ target_username }}"
      register: user_check
      when: not ansible_check_mode
      failed_when: false
      changed_when: false

    - name: Report remediation outcome
      ansible.builtin.debug:
        msg:
          - "Device: {{ host_name }}"
          - "Rogue user '{{ target_username }}' removal applied: {{ rogue_user_removal.changed | default(false) }}"
