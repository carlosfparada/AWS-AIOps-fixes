---
- name: Remediate AAA rogue user privilege escalation to privilege 15
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Assert rogue_user is defined, non-empty and not a protected account
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | string | length > 0
          - rogue_user not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty and not one of the protected accounts"

    - name: Remove the rogue local user so it cannot hold privilege 15 or be recreated
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        state: absent
      register: rogue_removal

    - name: Read remaining local user configuration (read-only verification)
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ rogue_user }}"
      register: rogue_user_check
      failed_when: false
      changed_when: false

    - name: Report rogue user remediation result
      ansible.builtin.debug:
        msg:
          - "Rogue user removal applied change: {{ rogue_removal.changed }}"
          - "Config lines still mentioning rogue_user: {{ rogue_user_check.stdout | default([]) }}"
