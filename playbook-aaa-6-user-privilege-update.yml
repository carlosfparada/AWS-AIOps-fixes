---
- name: Remediate rogue privilege escalation detected by AAA-6-USER_PRIVILEGE_UPDATE
  hosts: "{{ host_name }}"
  connection: ansible.netcommon.network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios

  tasks:
    - name: Validate required variable and reject protected accounts
      ansible.builtin.assert:
        that:
          - rogue_user is defined
          - rogue_user | length > 0
          - rogue_user not in ['admin', 'ansible', 'ansible_user']
        fail_msg: "rogue_user must be defined, non-empty, and must not be a protected account"
        quiet: true

    - name: Downgrade rogue user privilege level to 1
      cisco.ios.ios_user:
        name: "{{ rogue_user }}"
        privilege: 1
      register: privilege_fix

    - name: Read back the running configuration for the affected user
      cisco.ios.ios_command:
        commands:
          - "show running-config | include username {{ rogue_user }}"
      register: verification
      failed_when: false
      changed_when: false

    - name: Report remediation outcome
      ansible.builtin.debug:
        msg:
          - "Remediation completed for user {{ rogue_user }}"
          - "Configuration changed: {{ privilege_fix.changed }}"
          - "Verification output: {{ verification.stdout | default(['no output']) | first }}"
