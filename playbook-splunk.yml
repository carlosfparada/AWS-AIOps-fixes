- name: Block offending IP from SSH login failures
  hosts: all
  gather_facts: false
  vars:
    offending_ip: "{{ lookup('env', 'OFFENDING_IP') | default('') }}"
  tasks:
    - name: Ensure offending_ip is provided
      assert:
        that: offending_ip != ''
        fail_msg: "offending_ip variable must be set"

    - name: Block offending IP in firewall/ACL
      # Example using ios_acl; adjust module and parameters for your device type
      ios_acl:
        config:
          - name: BLOCK_SSH_FAIL
            type: standard
            state: present
            rules:
              - action: deny
                source: "{{ offending_ip }}"
        purge: false
        # connection details should be provided via inventory or vars
      when: offending_ip != ''
