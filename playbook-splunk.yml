---
- name: Remediate Splunk SSH login failure
  hosts: all
  become: true
  vars:
    offending_ip: "176.79.197.147"
  tasks:
    - name: Ensure iptables package is installed
      ansible.builtin.package:
        name: iptables
        state: present

    - name: Block offending IP using iptables
      ansible.builtin.iptables:
        chain: INPUT
        source: "{{ offending_ip }}"
        destination_port: 22
        protocol: tcp
        jump: DROP
        state: present
        comment: "Blocked after repeated failed SSH login attempts"

    - name: Save iptables rules persistently
      ansible.builtin.command: service iptables save
      when: ansible_facts['os_family'] == "RedHat"

    - name: Verify rule is present
      ansible.builtin.command: iptables -L INPUT -v -n
      register: iptables_output

    - name: Debug iptables output
      ansible.builtin.debug:
        var: iptables_output.stdout_lines
