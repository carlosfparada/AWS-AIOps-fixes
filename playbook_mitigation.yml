# hosts, mitigating CVE by disabling nested virtualization via
# modprobe config file. Must not use block structure on
# handlers. So we can have a handler defined without block?
# Usually handlers are defined as tasks with notify and then
# in handlers we can have tasks. Avoid block. Provide playbook
# with tasks: check if kvm_intel or kvm_amd loaded, remove
# with modprobe -r; create file
# /etc/modprobe.d/cve-2026-53359-mitigation.conf with
# appropriate contents; ensure sysfs parameters set? Actually
# after modprobe removal and file addition need to reload?
# Possibly run modprobe -r then modprobe -a? Since disabling
# nested param requires module reload. So we can have tasks:
# gather facts, check modules loaded via shell command `lsmod
# | grep -E '^kvm_intel|kvm_amd'`. Use register. Then
# conditionally run modprobe -r. Then copy file using
# lineinfile or copy. Then reload modules: modprobe -r and
# modprobe again? Might be okay.
#
# Write playbook with hosts: list of hosts, become: true. Use
# tasks.
#
# Handlers: maybe need restart kvm modules? We'll define a
# handler to reload modules but not using block. Eg:
#
# handlers:
#  - name: reload kvm modules
#    command: modprobe -r kvm_intel kvm_amd && modprobe
# kvm_intel && modprobe kvm_amd
#
# But need to ensure only if module existed. Could be simpler:
# after copying file, run modprobe -r and modprobe module
