# Ansible playbook – CVE‑2026‑31431 mitigation (RHEL 9)
# ----------------------------------------------------
# This playbook applies a kernel‑parameter–based mitigation for the
# algif_aead in‑place vulnerability.  It does **not** install or update any
# packages or kernel binaries – only configuration changes are made.
#
# Target hosts (as required):
#   ec2-54-90-135-180.compute-1.amazonaws.com,
#   ec2-34-228-227-78.compute-1.amazonaws.com
#
# The mitigation consists of:
#   1. Adding a kernel command‑line option that disables the vulnerable
#      in‑place handling.
#   2. Regenerating the grub configuration.
#   3. Adding a sysctl entry as an additional safeguard (runtime only).

- name: Mitigate CVE‑2026‑31431 on RHEL 9
  hosts: "ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-228-227-78.compute-1.amazonaws.com"
  become: true
  vars:
    # Kernel boot parameter that disables the problematic in‑place mode.
    # Red Hat’s security advisory recommends adding
    #   crypto.algif_aead_inplace=0
    # to the kernel command line.
    algif_aead_boot_option: "crypto.algif_aead_inplace=0"

  tasks:

    - name: Ensure the boot parameter is present in GRUB_CMDLINE_LINUX
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX="([^"]*)"$'
        line: 'GRUB_CMDLINE_LINUX="\1 {{ algif_aead_boot_option }}"'
        backrefs: yes
        state: present

    - name: Regenerate GRUB configuration (BIOS systems)
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_facts['ansible_devices']['sda']['type'] is defined   # simple guard for BIOS; adjust as needed

    - name: Regenerate GRUB configuration (UEFI systems)
      command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      when: ansible_facts['ansible_devices']['nvme0n1']['type'] is defined   # simple guard for UEFI; adjust as needed

    - name: Apply runtime sysctl to disable in‑place processing
      sysctl:
        name: crypto.algif_aead_inplace
        value: "0"
        state: present
        reload: yes

    - name: Persist the sysctl setting across reboots
      lineinfile:
        path: /etc/sysctl.d/99-algif_aead.conf
        create: yes
        line: "crypto.algif_aead_inplace = 0"
        owner: root
        group: root
        mode: "0644"