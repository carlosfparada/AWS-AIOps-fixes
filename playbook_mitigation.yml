####### REASONING #######
# We need to produce an Ansible playbook to mitigate CVE: a WebKitGTK vulnerability. Mitigation could be updating the package to a patched version, applying security updates, maybe disabling certain features.
#
# We need to output only the playbook code, no extra text.
#
# So just a YAML playbook. Include tasks: ensure system is updated, install latest version of webkitgtk, maybe ensure certain configuration. Provide playbook with hosts: all, become: yes.
#
# Let's produce concise playbook.
#
# 
\n####### + "\n\n" +  ---
- name: Mitigate WebKitGTK out-of-bounds write vulnerability (CVE)
  hosts: all
  become: true
  vars:
    webkitgtk_pkg: "webkit2gtk"
    safe_repo: "updates"
  tasks:
    - name: Ensure system package cache is up to date
      ansible.builtin.package:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install latest security updates for WebKitGTK
      ansible.builtin.yum:
        name: "{{ webkitgtk_pkg }}*"
        state: latest
        security: yes
        enablerepo: "{{ safe_repo }}"
      when: ansible_facts['pkg_mgr'] == 'yum' or ansible_facts['pkg_mgr'] == 'dnf'

    - name: Install latest security updates for WebKitGTK (apt)
      ansible.builtin.apt:
        name: "{{ webkitgtk_pkg }}*"
        state: latest
        update_cache: yes
        cache_valid_time: 3600
        install_recommends: no
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Verify installed WebKitGTK version is patched
      ansible.builtin.command: rpm -q {{ webkitgtk_pkg }} || dpkg -s {{ webkitgtk_pkg }}
      register: webkit_version
      changed_when: false

    - name: Fail if WebKitGTK version is still vulnerable
      ansible.builtin.fail:
        msg: "WebKitGTK package version {{ webkit_version.stdout }} may still be vulnerable. Manual review required."
      when: >
        (webkit_version.stdout is search('{{ webkitgtk_pkg }}-') and
        webkit_version.stdout is not search('.*(CVE|patched|security).*', ignorecase=True))

    - name: Restart services that depend on WebKitGTK (e.g., GNOME Web, browsers)
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop:
        - gnome-web-browser
        - firefox
        - epiphany
      ignore_errors: true