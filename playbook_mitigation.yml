#
# We need to write an Ansible playbook that mitigates a CVE about WebKitGTK. Likely updating package to a patched version, applying OS security updates, possibly disabling webkit or using an alternative. The user asks for only playbook code, no extra text. Provide yaml code.
#
# We need a playbook that ensures package is updated, maybe blacklists vulnerable version, etc.
#
# We should include tasks: update cache, install latest webkitgtk, optionally reboot.
#
# We'll write a playbook named mitigate_webkitgtk_cve.yml. Provide hosts: all, become: true. Use apt/yum/dnf based on OS detection, but we can use package module which works across.
#
# We'll also maybe check the installed version and compare, but simple ensure latest.
#
# Return only playbook code.
#
# Proceed.
# + ---
- name: Mitigate WebKitGTK CVE (out‑of‑bounds write)
  hosts: all
  become: true
  vars:
    # Define package name per OS family if needed
    webkitgtk_pkg:
      Debian:   libwebkit2gtk-4.0-37
      RedHat:   webkit2gtk3
  tasks:

    - name: Gather OS family
      ansible.builtin.setup:
        filter: ansible_os_family
      register: os_info

    - name: Set WebKitGTK package name
      set_fact:
        webkit_pkg: "{{ webkitgtk_pkg[os_info.ansible_facts.ansible_os_family] }}"

    - name: Ensure package cache is up to date (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: os_info.ansible_facts.ansible_os_family == "Debian"

    - name: Ensure package cache is up to date (RHEL/CentOS/Fedora)
      ansible.builtin.dnf:
        update_cache: yes
      when: os_info.ansible_facts.ansible_os_family == "RedHat"

    - name: Upgrade WebKitGTK to the latest version
      ansible.builtin.package:
        name: "{{ webkit_pkg }}"
        state: latest

    - name: Verify that the installed version contains the security fix
      command: "{{ ansible_pkg_mgr }} info {{ webkit_pkg }}"
      register: pkg_info
      changed_when: false

    - name: Log installed version (debug)
      ansible.builtin.debug:
        msg: "{{ pkg_info.stdout_lines }}"

    - name: Reboot if kernel or critical libraries were updated
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: "'linux-image' in pkg_info.stdout or 'glibc' in pkg_info.stdout"