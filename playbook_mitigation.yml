####### DETAILS #######
# description:A flaw was found in the Linux kernel's
# algif_aead cryptographic algorithm interface. An incorrect
# in-place operation causes source and destination data
# mappings to differ during cryptographic processing. A low-
# privileged local attacker can exploit this flaw to corrupt
# the contents of sensitive system files and escalate to root
# privileges.
# summary:kernel: crypto: algif_aead - Revert to operating
# out-of-place
# other:This issue is classified as Important, rather than
# Critical severity, because exploitation requires local
# access to the system. A low-privileged local attacker can
# exploit this flaw in the Linux kernel's cryptographic
# interface to gain root privileges by overwriting sensitive
# system files. Exploitation does not require user
# interaction, potentially resulting in full compromise of
# confidentiality, integrity, and availability.
# general:The CVSS score(s) listed for this vulnerability do
# not reflect the associated product's status, and are
# included for informational purposes to better understand the
# severity of this vulnerability.
#######
####### REASONING #######
# We need to write a simple Ansible playbook to mitigate
# CVE-2026-31431 using kernel boot parameters
# (initcall_blacklist). Must only cover RHEL OS. No backups,
# checks, validations. Do not update packages. Must reboot
# after changes. Use hosts string exactly as given: 'ec2-98-
# 93-112-42.compute-1.amazonaws.com,ec2-98-92-4-79.compute-
# 1.amazonaws.com'.
#
# We need to apply kernel boot parameter modifications.
# Usually via /etc/default/grub (GRUB_CMDLINE_LINUX) and then
# generate new grub config with grub2-mkconfig. For RHEL
# 7/8/9. Also need to ensure reboot.
#
# Simplify: tasks: ensure initcall_blacklist=algif_aead_init
# is present (or whichever recommended). According to
# mitigation, options: initcall_blacklist=algif_aead_init,
# af_alg_init, crypto_authenc_esn_module_init. Choose one;
# perhaps set all three? Could add to GRUB_CMDLINE_LINUX. Use
# lineinfile to modify /etc/default/grub.
#
# Implementation steps:
#
# - name: Add kernel boot parameter to GRUB
#   lineinfile:
#     path: /etc/default/grub
#     regexp: '^GRUB_CMDLINE_LINUX='
#     line:
# 'GRUB_CMDLINE_LINUX="initcall_blacklist=algif_aead_init
# initcall_blacklist=af_alg_init
# initcall_blacklist=crypto_authenc_esn_module_init"'
#     backrefs: yes
# But we might want to append rather than replace. Simpler:
# use lineinfile with insertafter if not present.
#
# Better: use blockinfile to ensure presence.
#
# However need idempotent.
#
# Simplify: use replace to add parameter if not present.
#
# But ok.
#
# After editing, run command: grub2-mkconfig -o
# /boot/grub2/grub.cfg (RHEL 7) or
# /boot/efi/EFI/redhat/grub.cfg for UEFI. For generic we can
# run both.
#
# Then reboot: reboot.
#
# Add become: true.
#
# Make playbook with hosts: that string, become: true.
#
# Add when: ansible_facts['os_family'] == "RedHat". Also limit
