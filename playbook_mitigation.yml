####### REASONING #######
# We need to write an Ansible playbook that mitigates
# CVE-2026-31431 without updating packages or kernel binaries,
# but can adjust kernel parameters (initcall_blacklist). The
# playbook must target RHEL OS only. It must use hosts string
# provided: 'ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-
# 228-227-78.compute-1.amazonaws.com'. So host pattern should
# be that string. Use ansible_user probably root or become.
# Should set sysctl or modify /etc/sysctl.conf? Actually
# kernel boot parameters need to be added to
# /etc/default/grub. So we can ensure that initcall_blacklist
# entries are present. Then optionally regenerate grub config
# and reboot.
#
# We must not update packages. So tasks: ensure grub config
# lines contain required initcall_blacklist entries. Use
# lineinfile module to add/append initcall_blacklist in
# GRUB_CMDLINE_LINUX.
#
# Then run command grub2-mkconfig -o /boot/grub2/grub.cfg
# (RHEL). For UEFI maybe /boot/efi/EFI/redhat/grub.cfg but we
# assume standard.
#
# Then reboot.
#
# Include condition for RHEL (ansible_os_family == "RedHat").
#
# Write playbook yaml with hosts line set to the host list.
# Provide become: true.
#
# Ok.
#######
---
# -------------------------------------------------------------
# Playbook:  cve-2026-31431-mitigation.yml
# Purpose :  Mitigate the “algif_aead – copy‑fail” issue without
#            installing or updating any packages or kernel binaries.
#            The mitigation consists of black‑listing the vulnerable
#            init‑calls via the kernel boot‑parameter
#            initcall_blacklist=…
# -------------------------------------------------------------
- name: Mitigate CVE‑2026‑31431 on RHEL hosts
  hosts: "ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-228-227-78.compute-1.amazonaws.com"
  become: true               # need root to edit grub and reboot
  gather_facts: true

  # -----------------------------------------------------------
  # Run the whole play only when the target OS is a Red Hat family
  # (covers RHEL, RHEL‑based clones, and Amazon Linux 2 which reports
  # ansible_os_family = "RedHat").
  # -----------------------------------------------------------
  pre_tasks:
    - name: Verify that the target is a Red Hat based OS
      assert:
        that:
          - ansible_os_family == "RedHat"
        fail_msg: "This playbook is intended for RHEL only. Skipping {{ inventory_hostname }}."
      tags: always

  # -----------------------------------------------------------
  # Variables – list of boot‑parameter fragments we want to ensure
  # are present in the GRUB_CMDLINE_LINUX line.
  # -----------------------------------------------------------
  vars:
    # Each entry adds a separate initcall_blacklist assignment.
    # Duplicate entries are harmless because we use a regex that
    # replaces the whole line with a unique, comma‑separated list.
    cve_mitigations:
      - "initcall_blacklist=algif_aead_init"
      - "initcall_blacklist=af_alg_init"
      - "initcall_blacklist=crypto_authenc_esn_module_init"

    # Path to the GRUB config file that is generated on RHEL.
    grub_cfg_path: "/boot/grub2/grub.cfg"

    # Command to rebuild the GRUB configuration (RHEL‑7/8/9).
    grub_mkconfig_cmd: "grub2-mkconfig -o {{ grub_cfg_path }}"

  tasks:

    # -----------------------------------------------------------
    # 1️⃣  Ensure the GRUB_CMDLINE_LINUX line contains our
    #       initcall_blacklist entries (unique, comma‑separated).
    # -----------------------------------------------------------
    - name: "Collect current GRUB_CMDLINE_LINUX value"
      command: grep '^GRUB_CMDLINE_LINUX=' /etc/default/grub
      register: current_grub_cmdline
      changed_when: false
      check_mode: no

    - name: "Compose a corrected GRUB_CMDLINE_LINUX string"
      set_fact:
        new_grub_cmdline: >-
          {{ (current_grub_cmdline.stdout | regex_replace('(^GRUB_CMDLINE_LINUX=")(.*)("$)', '\\1\\2\\3') )
          | regex_replace('\"$', '') | regex_replace('^GRUB_CMDLINE_LINUX="', '') }}
          {{ ' ' + (cve_mitigations | join(' ')) }}
      # The expression strips the leading variable and trailing quote,
      # then appends our mitigation flags separated by a space.

    - name: "Normalize spacing – collapse multiple spaces"
      set_fact:
        new_grub_cmdline: "{{ new_grub_cmdline | regex_replace('\\s+', ' ') }}"

    - name: "Update /etc/default/grub with the new boot parameters"
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: "GRUB_CMDLINE_LINUX=\"{{ new_grub_cmdline | trim }}\""
        backrefs: no
        create: yes
      notify:
        - Rebuild GRUB configuration

    # -----------------------------------------------------------
    # 2️⃣  Re‑generate the grub.cfg file so the new kernel command line
    #        takes effect on the next reboot.
    # -----------------------------------------------------------
    - name: "Rebuild GRUB configuration (handler will run if line changed)"
      meta: flush_handlers

    # -----------------------------------------------------------
    # 3️⃣  Reboot the host to apply the new kernel command line.
    # -----------------------------------------------------------
    - name: Reboot the machine to pick up the new initcall_blacklist
      reboot:
        reboot_timeout: 600
        test_command: "whoami"
      when: ansible_facts['ansible_system'] == "Linux"

  # -----------------------------------------------------------------
  # Handlers – run only when the GRUB file was actually modified.
  # -----------------------------------------------------------------
  handlers:
    - name: Rebuild GRUB configuration
      command: "{{ grub_mkconfig_cmd }}"
      args:
        warn: false
      when: ansible_facts['ansible_distribution'] is match("RedHat|CentOS|AlmaLinux|Rocky")
      changed_when: true