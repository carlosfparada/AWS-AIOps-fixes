# Playbook: Mitigate CVE‑2026‑53359 (KVM x86 shadow‑paging use‑after‑free)
# --------------------------------------------------------------------
# A flaw was found in the Linux kernel's Kernel‑based Virtual Machine (KVM)
# x86 shadow paging mechanism. This vulnerability occurs when a host page
# directory entry (PDE) mapping is changed from within the guest, leading to
# an unexpected role mismatch in shadow paging. The mismatch can cause a
# use‑after‑free condition, allowing memory corruption, system instability,
# denial‑of‑service, possible arbitrary‑code execution or guest‑to‑host escape.
#
# Mitigation strategy (RHEL):
#   1. Install the kernel version that contains the back‑ported fix.
#   2. Reboot the host so the patched kernel becomes active.
#
# This playbook is intentionally minimal – it only updates the kernel on the
# hosts in the *rhel* inventory group and reboots them if a newer kernel was
# installed.

- name: Mitigate CVE‑2026‑53359 on RHEL hosts
  hosts: rhel
  become: true
  vars:
    # Desired kernel version (adjust to the exact version released for your RHEL release)
    # Example for RHEL 9: 9.4.0‑20240630.el9.x86_64 (replace with the actual version)
    target_kernel_version: "9.4.0-20240630.el9.x86_64"

  tasks:

    - name: Ensure the latest kernel from the enabled repo is installed
      ansible.builtin.yum:
        name: kernel
        state: latest
      register: yum_kernel

    - name: Verify that the installed kernel matches the target version
      ansible.builtin.shell: |
        rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel | sort -V | tail -n1
      register: current_kernel
      changed_when: false

    - name: Show current kernel version
      ansible.builtin.debug:
        msg: "Current kernel: {{ current_kernel.stdout }} (target: {{ target_kernel_version }})"

    - name: Reboot host if a newer kernel was installed
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: uname -r
      when: yum_kernel.changed

    - name: Confirm the running kernel is the patched version
      ansible.builtin.shell: uname -r
      register: running_kernel
      changed_when: false

    - name: Fail if the running kernel does not match the target version
      ansible.builtin.fail:
        msg: |
          The host is still running an older kernel ({{ running_kernel.stdout }}).
          A manual reboot or further investigation is required.
      when: running_kernel.stdout != target_kernel_version