# --------------------------------------------------------------
#  CVE‑2026‑53359 mitigation playbook
#
#  Description:
#  A flaw was found in the Linux kernel's Kernel‑based Virtual Machine
#  (KVM) x86 shadow paging mechanism. The vulnerability occurs when a
#  host page‑directory entry (PDE) mapping is changed from within the
#  guest, leading to an unexpected role mismatch in shadow paging.
#  This mismatch can cause a use‑after‑free condition, which may result
#  in system instability, denial of service, arbitrary‑code execution,
#  or a guest‑to‑host escape.
#
#  Mitigation is achieved by installing the kernel version that
#  contains the upstream fix and rebooting the host to run the new
#  kernel.
# --------------------------------------------------------------

- name: Mitigate CVE‑2026‑53359 on RHEL hosts
  hosts: rhel
  become: true               # required for package management & reboot
  gather_facts: true

  vars:
    # The package name that provides the kernel on RHEL 8/9.
    # Adjust if you run a different minor release (e.g., kernel-rt, kernel-uek).
    kernel_pkg: kernel

    # Minimum kernel version that includes the fix (example, adjust to real version)
    # 9.2.0-19.el9 (replace with the exact version released by Red Hat)
    fixed_kernel_version: "9.2.0-19.el9"

  tasks:

    - name: Ensure the latest kernel package is installed
      ansible.builtin.yum:
        name: "{{ kernel_pkg }}"
        state: latest               # pulls the newest kernel from enabled repos
      register: yum_result
      notify: Reboot host if kernel was updated

    - name: Verify that the running kernel is the fixed version
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false

    - name: Fail if the host is not running the fixed kernel after reboot
      ansible.builtin.fail:
        msg: |
          The host is still running an older kernel ({{ running_kernel.stdout }})
          which does not contain the CVE‑2026‑53359 fix.  Reboot the host and
          verify the kernel version.
      when: running_kernel.stdout is version(fixed_kernel_version, "<")

  handlers:

    - name: Reboot host if kernel was updated
      ansible.builtin.reboot:
        reboot_timeout: 600          # seconds to wait for the host to come back
        pre_reboot_delay: 10
        post_reboot_delay: 20
        msg: "Rebooting for CVE‑2026‑53359 kernel mitigation"
      when: yum_result.changed