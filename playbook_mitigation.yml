  hosts: all
  become: yes
  vars:
    webkit_packages:
      deb: 
        - libwebkit2gtk-4.0-37
        - libwebkit2gtk-4.0-dev
      rhel:
        - webkit2gtk3
        - webkit2gtk3-devel
  tasks:
    - name: Gather OS family
      ansible.builtin.setup:
        filter: ansible_os_family
      register: os_info

    - name: Update package cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: os_info.ansible_facts.ansible_os_family == "Debian"

    - name: Update package cache (RHEL/CentOS/Fedora)
      ansible.builtin.yum:
        update_cache: yes
      when: os_info.ansible_facts.ansible_os_family == "RedHat"

    - name: Install latest WebKitGTK packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ webkit_packages.deb }}"
        state: latest
      when: os_info.ansible_facts.ansible_os_family == "Debian"

    - name: Install latest WebKitGTK packages (RHEL/CentOS/Fedora)
      ansible.builtin.yum:
        name: "{{ webkit_packages.rhel }}"
        state: latest
      when: os_info.ansible_facts.ansible_os_family == "RedHat"

    - name: Verify installed package versions
      ansible.builtin.command: >
        {{ (os_info.ansible_facts.ansible_os_family == 'Debian') | ternary('dpkg -l', 'rpm -qa') }}
      register: pkg_list

    - name: Reboot if kernel or glibc was updated (optional safety)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: >
        ('linux-image' in pkg_list.stdout) or
        ('glibc' in pkg_list.stdout)

    - name: Ensure web content sandbox is enabled (GNOME example)
      ansible.builtin.dconf:
        key: /org/gnome/desktop/lockdown/disable-lock-screen
        value: false
      when: os_info.ansible_facts.ansible_os_family == "Debian"