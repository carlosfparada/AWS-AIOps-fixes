# Playbook: mitigate_cve_2026_31431.yml
# Description:
#   Mitigate CVE‑2026‑31431 (Linux kernel algif_aead in‑place operation flaw) on the
#   "rhel" inventory group. The fix is delivered via the Red Hat kernel security
#   update – the playbook installs the latest kernel package and reboots the host
#   if a newer kernel was installed.

- name: Mitigate CVE‑2026‑31431 on RHEL hosts
  hosts: rhel
  become: true
  vars:
    # Minimum kernel release that contains the CVE fix (example, adjust as needed)
    # Use `rpm -q --changelog kernel | grep -i 2026-31431` on a patched host to get the exact version.
    min_fixed_kernel: "5.14.0-284.el9_2"

  tasks:

    - name: Ensure the latest kernel package is installed
      ansible.builtin.dnf:
        name: kernel
        state: latest
        update_cache: yes
      register: kernel_update

    - name: Gather the running kernel version
      ansible.builtin.command: uname -r
      changed_when: false
      register: running_kernel

    - name: Determine if a reboot is required
      ansible.builtin.set_fact:
        reboot_needed: >-
          {{ (kernel_update.changed) or
             (running_kernel.stdout is version(min_fixed_kernel, '<')) }}

    - name: Reboot the host if a newer kernel was installed or running kernel is older than the fixed release
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami
      when: reboot_needed
      # Optional: you can add a `msg` to inform why the reboot is happening
      # msg: "Reboot required to apply kernel fix for CVE‑2026‑31431"

    - name: Verify that the running kernel is now at or above the fixed version
      ansible.builtin.command: uname -r
      changed_when: false
      register: post_reboot_kernel
      failed_when: post_reboot_kernel.stdout is version(min_fixed_kernel, '<')
      # If the check fails, the play will abort and you’ll know the host is still vulnerable.