---                                            # mitigate_cve_2026_53359.yml
- name: "Mitigate CVE‑2026‑53359 on Linux KVM hosts"
  hosts: cve_2026_53359_targets
  become: true                                 # we need root privileges
  vars:
    # Name of the modprobe drop‑in file
    modprobe_conf_file: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    # Content that disables nested virtualization for both Intel and AMD
    modprobe_conf_content: |
      # CVE‑2026‑53359 – Disable KVM nested virtualization
      # (mitigation: https://access.redhat.com/solutions/6979679)
      options kvm-intel nested=0
      options kvm-amd   nested=0

  tasks:
    - name: "Gather loaded kernel modules"
      ansible.builtin.command: lsmod
      register: lsmod_out
      changed_when: false

    - name: "Set fact – is kvm_intel loaded?"
      ansible.builtin.set_fact:
        kvm_intel_loaded: "{{ 'kvm_intel' in lsmod_out.stdout_lines | map('split') | map('first') }}"

    - name: "Set fact – is kvm_amd loaded?"
      ansible.builtin.set_fact:
        kvm_amd_loaded: "{{ 'kvm_amd' in lsmod_out.stdout_lines | map('split') | map('first') }}"

    - name: "Create/modprobe drop‑in file with mitigation options"
      ansible.builtin.copy:
        dest: "{{ modprobe_conf_file }}"
        content: "{{ modprobe_conf_content }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - "Reload kvm modules if they are loaded"
        - "Verify nested flag is disabled"

    - name: "Ensure the kvm_intel module is reloaded (if loaded)"
      ansible.builtin.command: modprobe -r kvm_intel
      when: kvm_intel_loaded
      ignore_errors: true          # ignore if removal fails (e.g., in use)
      notify: Reload kvm modules if they are loaded

    - name: "Ensure the kvm_amd module is reloaded (if loaded)"
      ansible.builtin.command: modprobe -r kvm_amd
      when: kvm_amd_loaded
      ignore_errors: true
      notify: Reload kvm modules if they are loaded

    - name: "Load the kvm_intel module (if it was present before)"
      ansible.builtin.command: modprobe kvm_intel
      when: kvm_intel_loaded
      ignore_errors: true

    - name: "Load the kvm_amd module (if it was present before)"
      ansible.builtin.command: modprobe kvm_amd
      when: kvm_amd_loaded
      ignore_errors: true

  handlers:
    - name: "Reload kvm modules if they are loaded"
      block:
        - name: "Force‑reload kvm_intel"
          ansible.builtin.command: modprobe -r kvm_intel
          ignore_errors: true
        - name: "Force‑reload kvm_amd"
          ansible.builtin.command: modprobe -r kvm_amd
          ignore_errors: true
        - name: "Reload kvm_intel after config change"
          ansible.builtin.command: modprobe kvm_intel
          when: kvm_intel_loaded
          ignore_errors: true
        - name: "Reload kvm_amd after config change"
          ansible.builtin.command: modprobe kvm_amd
          when: kvm_amd_loaded
          ignore_errors: true

    - name: "Verify nested flag is disabled"
      block:
        - name: "Check Intel nested flag (if module present)"
          ansible.builtin.command: cat /sys/module/kvm_intel/parameters/nested
          register: intel_nested
          changed_when: false
          failed_when: false
          when: kvm_intel_loaded
        - name: "Assert Intel nested flag is 'N'"
          ansible.builtin.assert:
            that:
              - intel_nested.stdout == "N"
            fail_msg: "Intel nested virtualization is still enabled!"
          when: kvm_intel_loaded

        - name: "Check AMD nested flag (if module present)"
          ansible.builtin.command: cat /sys/module/kvm_amd/parameters/nested
          register: amd_nested
          changed_when: false
          failed_when: false
          when: kvm_amd_loaded
        - name: "Assert AMD nested flag is 'N'"
          ansible.builtin.assert:
            that:
              - amd_nested.stdout == "N"
            fail_msg: "AMD nested virtualization is still enabled!"
          when: kvm_amd_loaded