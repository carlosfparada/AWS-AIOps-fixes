# ------------------------------------------------------------
# Playbook: update_webkitgtk.yml
# Purpose:  Mitigate CVE‑XXXX‑XXXX (WebKitGTK out‑of‑bounds write)
# Platform: RHEL 7, 8, 9 (and compatible derivatives)
# ------------------------------------------------------------

- name: Ensure WebKitGTK is patched on RHEL hosts
  hosts: webkitgtk_hosts        # <-- adjust to your inventory group / host pattern
  become: true                  # need root privileges for package management
  gather_facts: true

  vars:
    # --------------------------------------------------------
    # Packages that contain the vulnerable WebKitGTK library.
    # Adjust the list if you know of additional distro‑specific names.
    # --------------------------------------------------------
    webkitgtk_packages:
      - webkit2gtk3
      - webkit2gtk4
      - webkitgtk3
      - webkitgtk4
    # Whether you want to lock the version after updating.
    lock_version: true
    # If you set lock_version: true, specify the plugin config file.
    versionlock_file: /etc/yum/pluginconf.d/versionlock.conf

  pre_tasks:
    - name: Verify that the target OS is RHEL family
      assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: "This playbook is intended for RHEL / CentOS / Rocky / AlmaLinux."
        success_msg: "Target OS confirmed as RedHat family."

    - name: Ensure the yum-plugin-versionlock is installed (needed for optional lock)
      yum:
        name: yum-plugin-versionlock
        state: present
      when: lock_version
      tags: versionlock

  tasks:
    - name: Gather currently installed WebKitGTK packages (debug)
      package_facts:
        manager: auto

    - name: Show installed WebKitGTK packages before the update (optional)
      debug:
        msg: |
          Detected WebKitGTK related packages:
          {% for pkg in webkitgtk_packages %}
          - {{ pkg }}: {{ ansible_facts.packages[pkg][0].version if pkg in ansible_facts.packages else 'NOT INSTALLED' }}
          {% endfor %}

    - name: Update WebKitGTK packages to the latest security version
      yum:
        name: "{{ webkitgtk_packages }}"
        state: latest   # pulls the newest version from enabled repos
        # For RHEL 8+ you could use `dnf` module; `yum` works as an alias.
      register: yum_update
      notify: Restart dependent services

    - name: Optionally lock the newly installed version(s) to prevent downgrade
      command: "yum versionlock add {{ item }}-{{ ansible_facts.packages[item][0].version }}-{{ ansible_facts.packages[item][0].release }}"
      loop: "{{ webkitgtk_packages }}"
      when:
        - lock_version
        - item in ansible_facts.packages
      args:
        warn: false
      tags: versionlock

    - name: Summarize update results
      debug:
        msg: |
          Update summary:
          {% if yum_update.changed %}
          - Packages were updated: {{ yum_update.results | map(attribute='name') | list | join(', ') }}
          {% else %}
          - All WebKitGTK packages were already at the latest version.
          {% endif %}

  handlers:
    - name: Restart dependent services
      # Adjust the list to services that actually use WebKitGTK on your hosts.
      # Common examples: gnome-browser, gnome-shell, electron apps, etc.
      service:
        name: "{{ item }}"
        state: restarted
      loop:
        - gnome-shell
        - gdm
        - some-electron-app   # replace with real service names, or comment out if not needed
      when: item in ansible_facts.services
      ignore_errors: true   # some services may not be present; that's okay.

# ------------------------------------------------------------
# End of playbook
# ------------------------------------------------------------