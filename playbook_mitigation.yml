# Ansible Playbook – Mitigation for CVE‑2026‑31431 (algif_aead kernel flaw)
# Target hosts (as required by the request)
# --------------------------------------------------------------------
#   ec2-52-207-223-135.compute-1.amazonaws.com,ec2-54-152-125-62.compute-1.amazonaws.com
# --------------------------------------------------------------------
# This playbook updates the Linux kernel to the most recent release that
# contains the fix for CVE‑2026‑31431 and reboots the machine when a kernel
# upgrade occurs.  The exact version is **not** pinned – we simply ask the
# package manager for the latest available kernel package.
# --------------------------------------------------------------------
# References:
#   • https://www.cve.org/CVERecord?id=CVE-2026-31431
#   • https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#   • https://access.redhat.com/articles/7141989
#   • https://access.redhat.com/solutions/7141931
#   • https://access.redhat.com/solutions/7141979
#   • https://access.redhat.com/solutions/7141990
#   • https://access.redhat.com/solutions/7141996
#   • https://access.redhat.com/solutions/7142032
#   • https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#   • https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#   • https://www.cisa.gov/known-exploited-vulnerabilities-catalog
# --------------------------------------------------------------------

- name: Apply kernel mitigation for CVE‑2026‑31431
  hosts: "ec2-52-207-223-135.compute-1.amazonaws.com,ec2-54-152-125-62.compute-1.amazonaws.com"
  become: true
  gather_facts: true

  vars:
    # Package names differ per distro; these are the usual defaults.
    kernel_pkg_redhat: kernel
    kernel_pkg_debian: linux-image-amd64

  tasks:

    - name: Ensure the kernel package is the latest version (RHEL / Rocky / AlmaLinux / etc.)
      ansible.builtin.package:
        name: "{{ kernel_pkg_redhat }}"
        state: latest
      when: ansible_os_family == "RedHat"
      register: kernel_update
      notify: Reboot host

    - name: Ensure the kernel package is the latest version (Debian / Ubuntu)
      ansible.builtin.package:
        name: "{{ kernel_pkg_debian }}"
        state: latest
      when: ansible_os_family == "Debian"
      register: kernel_update
      notify: Reboot host

    - name: Record whether a kernel was updated
      ansible.builtin.set_fact:
        reboot_required: "{{ kernel_update.changed }}"
      when: kernel_update is defined

    - name: Wait for the host to become reachable after reboot (if needed)
      ansible.builtin.wait_for_connection:
        timeout: 600
      when: reboot_required | default(false)

  handlers:

    - name: Reboot host
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami