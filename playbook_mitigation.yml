# -------------------------------------------------
# Minimal Ansible playbook to mitigate CVE‑2026‑31431
# -------------------------------------------------
# Target hosts (as you requested)
- hosts: "ec2-34-228-227-78.compute-1.amazonaws.com,ec2-54-90-135-180.compute-1.amazonaws.com"
  become: true                # we need root to edit GRUB files
  gather_facts: false         # not required for this simple mitigation

  vars:
    # Kernel boot parameter that disables the vulnerable in‑place path.
    # This is the documented mitigation for CVE‑2026‑31431.
    algif_aead_boot_param: "algif_aead.disable=1"

    # Path to the GRUB configuration file that contains the kernel cmdline.
    # Adjust if your distro uses a different location (e.g. /boot/grub2/grub.cfg).
    grub_cfg_file: "/etc/default/grub"

    # File used only as an audit flag – shows that the remediation was applied.
    mitigation_flag_file: "/etc/.cve-2026-31431-mitigated"

  tasks:

    - name: "Ensure the GRUB cmdline contains the mitigation boot parameter"
      lineinfile:
        path: "{{ grub_cfg_file }}"
        regexp: '^GRUB_CMDLINE_LINUX="([^"]*)"$'
        line: >-
          GRUB_CMDLINE_LINUX="{{ '\\1' if '\\1' is defined else '' }}
          {{ algif_aead_boot_param }}".strip()
        backrefs: yes
        state: present
        insertafter: EOF
      notify: Rebuild GRUB configuration

    - name: "Create /etc/.cve-2026-31431-mitigated flag file"
      file:
        path: "{{ mitigation_flag_file }}"
        state: touch
        owner: root
        group: root
        mode: '0644'

  handlers:

    - name: Rebuild GRUB configuration
      # Regenerate the GRUB config – safe on both RHEL‑derived and Debian‑derived systems.
      # The command automatically detects the correct bootloader layout.
      command: >
        {% if ansible_facts['os_family'] == 'RedHat' %}
          grub2-mkconfig -o /boot/grub2/grub.cfg
        {% elif ansible_facts['os_family'] == 'Debian' %}
          update-grub
        {% else %}
          echo "Unsupported OS family – manual GRUB rebuild may be required"
        {% endif %}
      changed_when: true