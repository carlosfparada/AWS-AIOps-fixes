# --------------------------------------------------------------
# Playbook:  cve-2026-53359-mitigation.yml
# Purpose:   Mitigate CVE‑2026‑53359 (KVM x86 shadow‑paging use‑after‑free)
#            by disabling nested virtualization on the host.
# Hosts:     ec2-54-196-127-140.compute-1.amazonaws.com,
#            ec2-13-217-54-130.compute-1.amazonaws.com
#
# CVE Details (excerpt):
#   • Kernel KVM x86 shadow‑paging mismatch can lead to a use‑after‑free.
#   • Exploitable via guest‑initiated PDE changes → possible DoS /
#     arbitrary‑code execution or host escape.
#   • Mitigation: disable nested virtualization (kvm_intel/kvm_amd).
# --------------------------------------------------------------

- name: Mitigate CVE‑2026‑53359 on selected EC2 instances
  hosts: cve_2026_53359_targets
  become: true               # need root to touch /etc/modprobe.d and reload modules
  gather_facts: true

  vars:
    # Name of the drop‑in file that will hold the mitigation options
    mitigation_conf: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    # Content that disables nested virtualization for both Intel & AMD KVM
    mitigation_content: |
      # --------------------------------------------------------------
      # CVE‑2026‑53359 mitigation – disable nested virtualization
      # --------------------------------------------------------------
      options kvm-intel nested=0
      options kvm-amd   nested=0
      # --------------------------------------------------------------

  tasks:

    - name: "DEBUG – Show gathered OS info"
      debug:
        var: ansible_distribution
      tags: debug

    ######################################################################
    # 1.  Ensure the drop‑in file exists with the correct content
    ######################################################################
    - name: "Create/overwrite {{ mitigation_conf }} with mitigation options"
      copy:
        dest: "{{ mitigation_conf }}"
        content: "{{ mitigation_content }}"
        owner: root
        group: root
        mode: '0644'
      notify: reload kvm modules
      tags: mitigation

    ######################################################################
    # 2.  Detect whether kvm_intel or kvm_amd modules are currently loaded
    ######################################################################
    - name: "Check if kvm_intel is loaded"
      command: lsmod
      register: lsmod_output
      changed_when: false

    - name: "Set fact – kvm_intel loaded?"
      set_fact:
        kvm_intel_loaded: "{{ 'kvm_intel' in lsmod_output.stdout }}"
      tags: debug

    - name: "Check if kvm_amd is loaded"
      command: lsmod
      register: lsmod_output_amd
      changed_when: false

    - name: "Set fact – kvm_amd loaded?"
      set_fact:
        kvm_amd_loaded: "{{ 'kvm_amd' in lsmod_output_amd.stdout }}"
      tags: debug

    ######################################################################
    # 3.  Unload the modules (if they are loaded) so the new options take effect
    ######################################################################
    - name: "Attempt to unload kvm_intel (if loaded)"
      when: kvm_intel_loaded
      become: true
      ansible.builtin.command: modprobe -r kvm_intel
      register: rmod_intel
      changed_when: rmod_intel.rc == 0
      ignore_errors: true   # In case other modules depend on it, we will reload later

    - name: "Attempt to unload kvm_amd (if loaded)"
      when: kvm_amd_loaded
      become: true
      ansible.builtin.command: modprobe -r kvm_amd
      register: rmod_amd
      changed_when: rmod_amd.rc == 0
      ignore_errors: true

    ######################################################################
    # 4.  (Re)load the modules so they pick up the new option file
    ######################################################################
    - name: "Load kvm_intel module (if present in the kernel)"
      become: true
      ansible.builtin.modprobe:
        name: kvm_intel
        state: present
      when: "'kvm_intel' in ansible_facts.modules' or kvm_intel_loaded"
      notify: validate nested disabled
      tags: reload

    - name: "Load kvm_amd module (if present in the kernel)"
      become: true
      ansible.builtin.modprobe:
        name: kvm_amd
        state: present
      when: "'kvm_amd' in ansible_facts.modules' or kvm_amd_loaded"
      notify: validate nested disabled
      tags: reload

    ######################################################################
    # 5.  Verify that nested virtualization is really disabled
    ######################################################################
    - name: "Validate nested flag for kvm_intel (if module loaded)"
      when: kvm_intel_loaded or (ansible_facts.modules is defined and 'kvm_intel' in ansible_facts.modules)
      become: true
      command: cat /sys/module/kvm_intel/parameters/nested
      register: nested_intel
      changed_when: false
      failed_when: nested_intel.stdout.strip() != "N"
      tags: validation

    - name: "Validate nested flag for kvm_amd (if module loaded)"
      when: kvm_amd_loaded or (ansible_facts.modules is defined and 'kvm_amd' in ansible_facts.modules)
      become: true
      command: cat /sys/module/kvm_amd/parameters/nested
      register: nested_amd
      changed_when: false
      failed_when: nested_amd.stdout.strip() != "N"
      tags: validation

    - name: "Summarise validation result"
      debug:
        msg: |
          Nested virtualization status:
            kvm_intel → {{ nested_intel.stdout | default('not loaded') }}
            kvm_amd   → {{ nested_amd.stdout   | default('not loaded') }}
      when: nested_intel is defined or nested_amd is defined

  # ----------------------------------------------------------------------
  # Handlers – executed only when notified
  # ----------------------------------------------------------------------
  handlers:

    - name: reload kvm modules
      become: true
      # By forcing a reload we guarantee the new options are read.
      # The actual unload/reload steps are in the main task list; this
      # handler just forces a run of the validation after the file change.
      meta: clear_host_errors
      listen: reload kvm modules

    - name: validate nested disabled
      become: true
      block:
        - name: "Re‑check nested flag for kvm_intel"
          command: cat /sys/module/kvm_intel/parameters/nested
          register: nested_intel
          changed_when: false
          ignore_errors: true

        - name: "Re‑check nested flag for kvm_amd"
          command: cat /sys/module/kvm_amd/parameters/nested
          register: nested_amd
          changed_when: false
          ignore_errors: true

        - name: "Fail if any nested flag is still enabled"
          fail:
            msg: |
              Nested virtualization is still enabled!
              kvm_intel → {{ nested_intel.stdout | default('N/A') }}
              kvm_amd   → {{ nested_amd.stdout   | default('N/A') }}
          when: >
            (nested_intel.stdout is defined and nested_intel.stdout.strip() != "N") or
            (nested_amd.stdout   is defined and nested_amd.stdout.strip()   != "N")
      listen: validate nested disabled