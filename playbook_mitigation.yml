# Playbook: mitigate‑cve‑2026‑31431.yml
# Purpose: Apply kernel‑level mitigations for CVE‑2026‑31431 on RHEL hosts.
# No package updates, kernel upgrades, checks, validations or reporting are performed.

- name: Apply CVE‑2026‑31431 kernel mitigations
  hosts: ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-228-227-78.compute-1.amazonaws.com,https://www.akamai.com/cloud/guides/cve-2026-31431-copy-fail-mitigation
  become: true
  vars:
    # Kernel command‑line fragment that disables the vulnerable algorithm.
    # The fragment is added to GRUB_CMDLINE_LINUX; existing parameters are preserved.
    grub_algo_disable: "crypto.disabled=algif_aead"
    # Sysctl name that controls in‑place processing (hypothetical – used for mitigation example).
    sysctl_name: "kernel.crypto.algif_aead_inplace"
    sysctl_value: "0"

  tasks:

    - name: Ensure sysctl to disable in‑place operation for algif_aead
      sysctl:
        name: "{{ sysctl_name }}"
        value: "{{ sysctl_value }}"
        state: present
        reload: yes

    - name: Persist the sysctl setting
      copy:
        dest: /etc/sysctl.d/99-cve-2026-31431.conf
        content: |
          # Mitigation for CVE‑2026‑31431 – disable algif_aead in‑place processing
          {{ sysctl_name }} = {{ sysctl_value }}
        owner: root
        group: root
        mode: '0644'

    - name: Add kernel boot parameter to disable the vulnerable algorithm
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="{{ grub_algo_disable }}"'
        insertafter: EOF
        create: yes
        backrefs: yes

    - name: Regenerate GRUB configuration (RHEL 7/8)
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_distribution_major_version is version('7', '>=') or
            ansible_distribution_major_version is version('8', '>=') or
            ansible_distribution_major_version is version('9', '>=')