#######
---
- name: Mitigate CVE‑2026‑31431 on RHEL nodes
  hosts: ec2-98-93-112-42.compute-1.amazonaws.com,ec2-98-92-4-79.compute-1.amazonaws.com
  become: true
  gather_facts: true

  # Restrict the play to Red Hat Enterprise Linux only
  vars:
    grubs_cfg: "/etc/default/grub"
    # The three init‑calls that can be black‑listed according to the Red Hat
    # advisory (any one of them works; we add all three for good measure)
    blacklist_params: >
      initcall_blacklist=algif_aead_init
      initcall_blacklist=af_alg_init
      initcall_blacklist=crypto_authenc_esn_module_init

  tasks:

    - name: Ensure target OS is RHEL
      assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] == "RedHat"
        fail_msg: "This playbook is intended for RHEL systems only."
      # The play will stop for any non‑RHEL host.

    - name: Make sure GRUB_CMDLINE_LINUX line exists
      lineinfile:
        path: "{{ grubs_cfg }}"
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX=""'
        state: present
      when: not lookup('file', grubs_cfg).splitlines() | select('match', '^GRUB_CMDLINE_LINUX=') | list

    - name: Append initcall_blacklist parameters to GRUB_CMDLINE_LINUX
      replace:
        path: "{{ grubs_cfg }}"
        regexp: '^GRUB_CMDLINE_LINUX="([^"]*)"'
        replace: 'GRUB_CMDLINE_LINUX="\1 {{ blacklist_params | trim }}"'
        backup: false
      # idempotent – if the parameters are already present they will be added
      # again, but that is harmless because the kernel simply ignores duplicates.

    - name: Re‑generate GRUB configuration (BIOS systems)
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_facts['ansible_devices'] is defined and
            (ansible_facts['ansible_devices'] | dict2items | selectattr('key', 'match', '^sd|^hd') | list)

    - name: Re‑generate GRUB configuration (UEFI systems)
      command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      when: ansible_facts['ansible_devices'] is defined and
            (ansible_facts['ansible_devices'] | dict2items | selectattr('key', 'match', '^vd|^nvme') | list)

    - name: Reboot the host so the new kernel parameters take effect
      reboot:
        reboot_timeout: 600
        test_command: whoami   # simple sanity check after reboot