---
# Playbook: Mitigate CVE‑2026‑31431 on RHEL hosts
# ------------------------------------------------
# This playbook applies the kernel‑boot‑parameter mitigation recommended by Red Hat:
#   initcall_blacklist=algif_aead_init
# (alternatives are af_alg_init or crypto_authenc_esn_module_init – you may edit the
#  variable below if you prefer a different blacklist entry.)
#
# It updates /etc/default/grub, rebuilds the grub.cfg and reboots the machine.
# No package updates, backups, or pre‑flight checks are performed.

- name: Apply CVE‑2026‑31431 mitigation on RHEL
  hosts: "ec2-98-93-112-42.compute-1.amazonaws.com,ec2-98-92-4-79.compute-1.amazonaws.com"
  become: true                     # required to edit grub and reboot
  gather_facts: true

  vars:
    # Choose the exact blacklist entry you want to apply.
    # You can add several entries separated by commas, e.g.
    #   initcall_blacklist=algif_aead_init,af_alg_init
    blacklist_entry: "initcall_blacklist=algif_aead_init"

    # Location of the grub configuration file – will be chosen automatically
    # in the task that rebuilds grub.cfg.
    grub_cfg_efi: "/boot/efi/EFI/redhat/grub.cfg"
    grub_cfg_bios: "/boot/grub2/grub.cfg"

  tasks:

    - name: Ensure this host is RHEL before proceeding
      assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] == "RedHat"
      fail_msg: "Playbook is intended for RHEL only."
      when: false   # The task is only to document the intent; it is deliberately disabled.

    - name: Add / update the initcall_blacklist kernel parameter
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        # Preserve any existing parameters and just append the blacklist entry.
        # The surrounding quotes are kept – if the line is missing we create it.
        line: >-
          {{ (lookup('file', '/etc/default/grub') | regex_search('^GRUB_CMDLINE_LINUX="([^"]*)"', '\\1') | default('')) | trim
            | regex_replace('(^|\\s){{ blacklist_entry }}(\\s|$)', ' ')   # remove duplicate if already present
            | regex_replace('\\s+$', '')
            | regex_replace('^', '') }}
          {{ '' if (lookup('file', '/etc/default/grub') | regex_search('^GRUB_CMDLINE_LINUX="([^"]*)"', '\\1') | default('')).strip() else '' }}
          {{ blacklist_entry }}
          "
        backrefs: yes
        create: yes
      when: ansible_facts['distribution'] == "RedHat"

    - name: Regenerate grub.cfg for BIOS systems
      command: grub2-mkconfig -o {{ grub_cfg_bios }}
      when:
        - ansible_facts['distribution'] == "RedHat"
        - not ansible_facts['ansible_facts'].get('ansible_facts', {}).get('ansible_facts', {}).get('ansible_facts', {}).get('ansible_facts')  # placeholder
        - ansible_facts['ansible_facts'] is not defined or not (ansible_facts['ansible_facts'].get('ansible_facts',{}) | bool)
        - not (ansible_facts['machine'] is defined and ansible_facts['machine'] | regex_search('x86_64') )
        - not (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/boot/efi') | list)
      ignore_errors: yes   # in case the host is UEFI – the next task will handle it

    - name: Regenerate grub.cfg for UEFI systems
      command: grub2-mkconfig -o {{ grub_cfg_efi }}
      when:
        - ansible_facts['distribution'] == "RedHat"
        - ansible_facts['mounts'] | selectattr('mount', 'equalto', '/boot/efi') | list | length > 0

    - name: Reboot the host so the new kernel parameter takes effect
      reboot:
        reboot_timeout: 600
        test_command: whoami
      when: ansible_facts['distribution'] == "RedHat"