# --------------------------------------------------------------
# Playbook:  cve-2026-53359‑mitigation.yml
# Description: Disable KVM nested virtualization on the two
#              EC2 hosts in order to mitigate the use‑after‑free
#              bug in the Linux kernel (CVE‑2026‑53359).
# --------------------------------------------------------------

- name: Apply CVE‑2026‑53359 mitigation
  hosts: >
    ec2-54-237-28-92.compute-1.amazonaws.com,
    ec2-34-230-26-219.compute-1.amazonaws.com
  become: true                # need root to manage kernel modules & /etc files
  gather_facts: false        # not required for this simple task set

  vars:
    mitigation_conf: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    mitigation_content: |
      # CVE‑2026‑53359 – disable KVM nested virtualization
      options kvm-intel nested=0
      options kvm-amd   nested=0

  handlers:
    # NOTE: No block structure is used – each handler is defined on its own line.
    - name: reload kvm_intel module
      command: modprobe -r kvm_intel && modprobe kvm_intel
      ignore_errors: true

    - name: reload kvm_amd module
      command: modprobe -r kvm_amd && modprobe kvm_amd
      ignore_errors: true

  tasks:

    - name: Remove kvm_intel module if it is loaded
      command: modprobe -r kvm_intel
      ignore_errors: true          # continue even if the module is not loaded

    - name: Remove kvm_amd module if it is loaded
      command: modprobe -r kvm_amd
      ignore_errors: true          # continue even if the module is not loaded

    - name: Deploy mitigation modprobe configuration
      copy:
        dest: "{{ mitigation_conf }}"
        content: "{{ mitigation_content }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload kvm_intel module
        - reload kvm_amd module
      ignore_errors: true

    - name: Verify nested virtualization is disabled for kvm_intel
      command: cat /sys/module/kvm_intel/parameters/nested
      register: intel_nested
      changed_when: false
      ignore_errors: true

    - name: Show kvm_intel nested status
      debug:
        msg: "kvm_intel nested parameter = {{ intel_nested.stdout | default('N/A') }}"
      when: intel_nested is defined

    - name: Verify nested virtualization is disabled for kvm_amd
      command: cat /sys/module/kvm_amd/parameters/nested
      register: amd_nested
      changed_when: false
      ignore_errors: true

    - name: Show kvm_amd nested status
      debug:
        msg: "kvm_amd nested parameter = {{ amd_nested.stdout | default('N/A') }}"
      when: amd_nested is defined
