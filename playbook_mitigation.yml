---
- name: Mitigate CVE-2026-31431
  hosts: ec2-52-90-120-144.compute-1.amazonaws.com,ec2-18-234-59-84.compute-1.amazonaws.com
  become: true
  tasks:
    - name: Update all packages to the latest versions
      yum:
        name: "*"
        state: latest
      notify: Reboot host

    - name: Apply security updates specific to the kernel
      yum:
        name: kernel
        state: latest
      notify: Reboot host

  handlers:
    - name: Reboot host
      reboot:
        reboot_timeout: 600