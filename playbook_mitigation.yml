# nested disabled for kvm_intel and kvm_amd. - name: Check if
# kvm_intel module loaded (shell: lsmod | grep kvm_intel).
# Register. - name: Same for kvm_amd. - name: Remove loaded
# modules if present (when loaded). Use modprobe -r kvm_intel
