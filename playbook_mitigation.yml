# How to use
# -------------------------------------------------------------------------
# 1. Save this file (e.g. mitigate-cve-2026-53359.yml).
# 2. Ensure your inventory has a group called "rhel" with the target servers.
# 3. Run:
#        ansible-playbook -i inventory.yaml mitigate-cve-2026-53359.yml
#
# The playbook will:
#   • Pull the most recent kernel from the configured repositories (the
#     version that contains the CVE fix released by Red Hat).
#   • Set it as the default boot entry.
#   • Reboot only when an upgrade occurred.
#   • Print the final kernel version for verification.
