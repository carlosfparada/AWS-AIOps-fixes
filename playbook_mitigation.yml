####### REASONING #######\n
# We need to output an Ansible playbook that mitigates CVE about WebKitGTK. Likely updating package to patched version. Provide tasks: ensure latest package installed, ensure security updates applied, maybe restart services. Provide minimal playbook.
#
# User wants only playbook code, no other text.
#
# We'll produce yaml. Use hosts: all, become: true. Tasks: update apt/yum depending on OS, install webkit2gtk maybe. Use package module with state: latest. Optional: check version. Provide handlers to restart services if needed.
#
# Return only the code block.
#\n#######\n\n\n +  ---
- name: Mitigate WebKitGTK CVE (out‑of‑bounds write)
  hosts: all
  become: true
  vars:
    webkit_package_names:
      deb: [libwebkit2gtk-4.0-37, libwebkit2gtk-4.0-dev]
      rhel: [webkitgtk3, webkitgtk3-devel]
  tasks:

    - name: Gather OS family
      ansible.builtin.setup:
        filter: ansible_os_family
      register: os_info

    - name: Install latest WebKitGTK packages on Debian/Ubuntu
      ansible.builtin.package:
        name: "{{ webkit_package_names.deb }}"
        state: latest
        update_cache: yes
      when: os_info.ansible_facts.ansible_os_family == "Debian"

    - name: Install latest WebKitGTK packages on RedHat/CentOS/Fedora
      ansible.builtin.package:
        name: "{{ webkit_package_names.rhel }}"
        state: latest
      when: os_info.ansible_facts.ansible_os_family == "RedHat"

    - name: Verify installed WebKitGTK version is patched
      ansible.builtin.command: |
        {{ ('dpkg -s libwebkit2gtk-4.0-37' if os_info.ansible_facts.ansible_os_family == 'Debian' else 'rpm -q webkitgtk3') }}
      register: webkit_version
      changed_when: false

    - name: Fail if WebKitGTK version is still vulnerable
      ansible.builtin.fail:
        msg: "WebKitGTK version is not patched. Please verify the repository provides the security fix."
      when: >
        (os_info.ansible_facts.ansible_os_family == 'Debian' and
         webkit_version.stdout is search('(?i)version\s+([0-9]+\\.[0-9]+\\.[0-9]+)') and
         (webkit_version.stdout | regex_findall('(?i)version\\s+([0-9]+\\.[0-9]+\\.[0-9]+)'))[0] is version('2.40.0', '<')) or
        (os_info.ansible_facts.ansible_os_family == 'RedHat' and
         webkit_version.stdout is search('webkitgtk3-([0-9]+\\.[0-9]+\\.[0-9]+)') and
         (webkit_version.stdout | regex_findall('webkitgtk3-([0-9]+\\.[0-9]+\\.[0-9]+)'))[0] is version('2.40.0', '<'))

    - name: Ensure services that depend on WebKitGTK are restarted (example: gnome-shell)
      ansible.builtin.service:
        name: gnome-shell
        state: restarted
      when: os_info.ansible_facts.ansible_os_family == "Debian"
      ignore_errors: true