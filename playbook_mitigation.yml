# Playbook: Mitigate CVE‑2026‑31431 (algif_aead in‑place operation flaw)
# ---------------------------------------------------------------
# The vulnerability is described as:
#   * An incorrect in‑place operation in the Linux kernel's
#     crypto: algif_aead interface can allow a low‑privileged local
#     attacker to corrupt system files and gain root.
#   * The fix is shipped in updated kernel packages.  See the security
#     bulletin for the detailed mitigation procedure.
# References:
#   - https://www.cve.org/CVERecord?id=CVE-2026-31431
#   - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#   - https://access.redhat.com/articles/7141989
#   - https://access.redhat.com/solutions/7141931
#   - https://access.redhat.com/solutions/7141979
#   - https://access.redhat.com/solutions/7141990
#   - https://access.redhat.com/solutions/7141996
#   - https://access.redhat.com/solutions/7142032
#   - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#   - https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#   - https://www.cisa.gov/known-exploited-vulnerabilities-catalog

- name: Apply kernel updates to remediate CVE‑2026‑31431
  hosts: ec2-52-90-70-64.compute-1.amazonaws.com,ec2-3-91-28-234.compute-1.amazonaws.com
  become: true
  vars:
    # Packages that contain the kernel on RHEL‑compatible systems
    rhel_kernel_pkgs:
      - kernel
      - kernel-core
      - kernel-modules
    # Minimum kernel version that contains the fix (example version)
    fixed_version: "6.6"

  tasks:

    - name: Gather minimal OS facts
      ansible.builtin.setup:
        filter: ansible_distribution*
      tags: always

    - name: Install the latest kernel packages on RedHat‑family hosts
      ansible.builtin.yum:
        name: "{{ rhel_kernel_pkgs }}"
        state: latest
      when: ansible_facts['os_family'] == "RedHat"
      notify: Reboot host

    - name: Install the latest generic kernel on Debian‑family hosts
      ansible.builtin.apt:
        name: linux-image-generic
        state: latest
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"
      notify: Reboot host

    - name: Capture the version of the currently running kernel
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: Fail if a vulnerable kernel is still running after the update
      ansible.builtin.fail:
        msg: >
          The host is still running a kernel version
          ({{ current_kernel.stdout }}) that is older than the
          fixed version {{ fixed_version }}.  A reboot is required.
      when: >
        (current_kernel.stdout is version(fixed_version, '<'))

  handlers:

    - name: Reboot host
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami