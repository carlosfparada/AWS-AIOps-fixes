---
# ------------------------------------------------------------
# Title : CVE‑2026‑53359 mitigation – disable nested KVM
# Author: <your‑name>
# Date  : {{ ansible_date_time.date }}
# ------------------------------------------------------------
- name: Mitigate CVE‑2026‑53359 (KVM shadow‑paging use‑after‑free)
  hosts: rhel
  become: true               # need root to touch /etc/modprobe.d and reload modules
  gather_facts: true

  vars:
    # File that will contain the mitigation options
    mitigation_conf_path: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    # Content to be written – one line per module
    mitigation_conf_content: |
      # CVE‑2026‑53359 mitigation – disable nested virtualization
      options kvm-intel nested=0
      options kvm-amd   nested=0

    # Modules we care about
    kvm_modules:
      - name: kvm_intel
        param_path: /sys/module/kvm_intel/parameters/nested
      - name: kvm_amd
        param_path: /sys/module/kvm_amd/parameters/nested

  tasks:

    # ----------------------------------------------------------------
    # 1. Ensure the drop‑in file exists with the correct content
    # ----------------------------------------------------------------
    - name: Deploy modprobe drop‑in that disables nested KVM
      ansible.builtin.copy:
        dest: "{{ mitigation_conf_path }}"
        content: "{{ mitigation_conf_content }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload KVM modules

    # ----------------------------------------------------------------
    # 2. Check whether each KVM module is currently loaded
    # ----------------------------------------------------------------
    - name: Check if {{ item.name }} is loaded
      ansible.builtin.shell: |
        lsmod | awk '$1 == "{{ item.name }}" {print $1}'
      register: kvm_loaded
      changed_when: false
      loop: "{{ kvm_modules }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        ansible_python_interpreter: /usr/bin/python3

    # ----------------------------------------------------------------
    # 3. If a module is loaded, unload it so it can be re‑inserted with
    #    the new parameter (the handler will do the reload after the
    #    drop‑in is in place).
    # ----------------------------------------------------------------
    - name: Remove loaded {{ item.item.name }} module (will be re‑loaded by handler)
      ansible.builtin.command: "modprobe -r {{ item.item.name }}"
      when: item.stdout != ""
      loop: "{{ kvm_loaded.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      ignore_errors: true          # removing a module can fail if other deps exist; we still want the handler to try a reload
      notify:
        - Reload KVM modules

    # ----------------------------------------------------------------
    # 4. Verify that the `nested` sysfs parameter reports “N”
    # ----------------------------------------------------------------
    - name: Read nested‑virt flag for {{ item.name }}
      ansible.builtin.slurp:
        src: "{{ item.param_path }}"
      register: nested_flag_raw
      when: item.name in ansible_facts.modules
      loop: "{{ kvm_modules }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Convert nested‑virt flag to text
      ansible.builtin.set_fact:
        nested_flag: "{{ (nested_flag_raw.results | selectattr('item.name','==',item.name) | first).content | b64decode | trim }}"
      loop: "{{ kvm_modules }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert that nested virtualization is disabled (value = N)
      ansible.builtin.assert:
        that:
          - nested_flag == 'N'
        fail_msg: "Nested virtualization for {{ item.name }} is still ENABLED (value='{{ nested_flag }}')"
        success_msg: "Nested virtualization for {{ item.name }} is correctly disabled (value='N')"
      loop: "{{ kvm_modules }}"
      loop_control:
        label: "{{ item.name }}"

  # --------------------------------------------------------------------
  # Handlers – executed only when notified (i.e. when the drop‑in or the
  # module removal changes state)
  # --------------------------------------------------------------------
  handlers:

    - name: Reload KVM modules
      block:
        # Load intel first – if the hardware does not support it the load will
        # simply fail harmlessly; same for amd.  We ignore errors because only
        # one of the two modules can exist on a given host.
        - name: Load kvm_intel with new parameters
          ansible.builtin.command: "modprobe kvm_intel"
          ignore_errors: true
          when: "'kvm_intel' in ansible_facts.modules"

        - name: Load kvm_amd with new parameters
          ansible.builtin.command: "modprobe kvm_amd"
          ignore_errors: true
          when: "'kvm_amd' in ansible_facts.modules"

        # Verify immediately after reload that the sysfs flag is “N”.
        - name: Verify nested flag after reload (kvm_intel)
          ansible.builtin.command: "cat /sys/module/kvm_intel/parameters/nested"
          register: post_reload_intel
          changed_when: false
          failed_when: post_reload_intel.stdout != 'N'
          when: "'kvm_intel' in ansible_facts.modules"

        - name: Verify nested flag after reload (kvm_amd)
          ansible.builtin.command: "cat /sys/module/kvm_amd/parameters/nested"
          register: post_reload_amd
          changed_when: false
          failed_when: post_reload_amd.stdout != 'N'
          when: "'kvm_amd' in ansible_facts.modules"
      listen: Reload KVM modules