# Minimalist Ansible playbook
# Target: rhel
# Purpose: Mitigate CVE‑2026‑53359 (KVM x86 shadow‑paging use‑after‑free)
# Description:
#   A flaw was found in the Linux kernel's Kernel‑based Virtual Machine (KVM) x86
#   shadow paging mechanism. The vulnerability occurs when a host page directory
#   entry (PDE) mapping is changed from within the guest, leading to an unexpected
#   role mismatch in shadow paging. This mismatch can cause a use‑after‑free
#   condition, potentially resulting in system instability, denial‑of‑service,
#   arbitrary code execution, or guest‑to‑host escape.
#
# Mitigation strategy:
#   1. Ensure the kernel package is updated to a version that includes the fix.
#   2. Reboot the host to load the patched kernel (if a kernel update was installed).
#   3. Optionally verify the running kernel version.

- name: Apply KVM CVE‑2026‑53359 mitigation on RHEL hosts
  hosts: rhel
  become: true
  vars:
    # Set the minimum kernel version that contains the fix for this CVE.
    # Adjust as needed for your RHEL release (e.g., 8.8, 9.2, etc.).
    min_fixed_kernel: "5.14.0-277.9.1.el8_9"
  tasks:

    - name: Gather current kernel version
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: Install latest kernel package (yum/dnf)
      ansible.builtin.yum:
        name: kernel
        state: latest
      when: current_kernel.stdout is version(min_fixed_kernel, '<')
      register: kernel_update

    - name: Reboot host if kernel was updated
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: "Rebooting to apply patched kernel for CVE‑2026‑53359"
      when: kernel_update is changed

    - name: Verify the running kernel version after reboot
      ansible.builtin.command: uname -r
      register: post_reboot_kernel
      changed_when: false
      when: kernel_update is changed

    - name: Fail if the running kernel is still vulnerable
      ansible.builtin.fail:
        msg: |
          The host is still running a vulnerable kernel version {{ post_reboot_kernel.stdout }}.
          Expected at least {{ min_fixed_kernel }}.
      when:
        - kernel_update is changed
        - post_reboot_kernel.stdout is version(min_fixed_kernel, '<')