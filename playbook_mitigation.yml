# Mitigation for CVE-2026-53359
# “KVM x86 shadow‑paging use‑after‑free” – fix is delivered in the
# patched RHEL kernel.  The playbook brings the kernel package to the
# latest version and reboots the host if a newer kernel was installed.

- name: Apply KVM‑CVE‑2026‑53359 mitigation
  hosts: rhel
  become: true               # need root to install kernel & reboot
  gather_facts: true

  vars:
    # The package name that provides the kernel on RHEL 8/9.
    # Adjust if you are using a different release (e.g., kernel-rt).
    kernel_pkg: kernel

  tasks:

    - name: Install the latest {{ kernel_pkg }} package
      dnf:
        name: "{{ kernel_pkg }}"
        state: latest
        update_only: true          # only upgrade, never downgrade
      register: kernel_update
      # On older RHEL versions you can use the `yum` module instead of `dnf`.

    - name: Reboot the machine if a new kernel was installed
      reboot:
        # Wait up to 10 minutes for the machine to come back.
        reboot_timeout: 600
        post_reboot_delay: 30
      when: kernel_update.changed
      # The `reboot` module automatically creates a temporary
      #  /run/reboot-required flag and waits for SSH to become reachable again.

    - name: Verify running kernel includes the fix
      command: uname -r
      register: running_kernel
      changed_when: false

    - name: Display current kernel version (for audit)
      debug:
        msg: "Host {{ inventory_hostname }} is now running kernel {{ running_kernel.stdout }}"