# packages or kernel binary. Must target only RHEL OS. Use
# hosts string list. Provide tasks: ensure sysctl parameters
# to disable the vulnerable interface? Need to find
# mitigation: For algif_aead vulnerability likely mitigated by
# disabling the kernel crypto module or setting kernel
# parameter "kernel.unprivileged_userns_clone"? Actually,
# maybe disable algorithm via /proc/sys/crypto? Not sure.
# Could use "modprobe.blacklist=algif_aead"? Actually
# algif_aead is part of kernel's AF_ALG socket interface for
# AEAD algorithms; mitigation could be to disable the AF_ALG
# interface via kernel parameter "net.crypto.afalg.enabled=0"?
# I'm not aware but could be plausible. Also can disable the
# crypto user API by setting "crypto_user_enabled" sysctl?
# Might exist. Quick search: "algif_aead mitigations sysctl".
# Might be "kernel.crypto.afalg=0". Could also use "sysctl -w
# kernel.crypto_user_enabled=0"? Not sure.
#
# Given constraints, we can create a playbook that sets a
# sysctl param "kernel.unprivileged_userns_clone=0" but that's
# unrelated.
#
# Probably use "kernel.dmesg_restrict=1"? Not.
#
# Better to use "sysctl -w crypto.fips_enabled=1"? Not.
#
# Maybe the mitigation is to set
# "kernel.modprobe.blacklist=algif_aead". But modprobe
# blacklist via /etc/modprobe.d/blacklist.conf.
#
# We can create tasks:
# - Ensure OS is RHEL (ansible_distribution == "RedHat").
# - Create /etc/modprobe.d/algif_aead.conf with "blacklist
# algif_aead" (if it's a module).
