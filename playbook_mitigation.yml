####### DETAILS #######
# description:A flaw was found in the Linux kernel's
# algif_aead cryptographic algorithm interface. An incorrect
# in-place operation causes source and destination data
# mappings to differ during cryptographic processing. A low-
# privileged local attacker can exploit this flaw to corrupt
# the contents of sensitive system files and escalate to root
# privileges.
# summary:kernel: crypto: algif_aead - Revert to operating
# out-of-place
# other:This issue is classified as Important, rather than
# Critical severity, because exploitation requires local
# access to the system. A low-privileged local attacker can
# exploit this flaw in the Linux kernel's cryptographic
# interface to gain root privileges by overwriting sensitive
# system files. Exploitation does not require user
# interaction, potentially resulting in full compromise of
# confidentiality, integrity, and availability.
# general:The CVSS score(s) listed for this vulnerability do
# not reflect the associated product's status, and are
# included for informational purposes to better understand the
# severity of this vulnerability.
#######
####### REASONING #######
# The user wants a simple Ansible playbook to mitigate
# CVE-2026-31431. They specify constraints: only RHEL OS, no
# backups, checks, validations, no software package or kernel
# binary updates. They can reboot if needed. The mitigation
# described is adding kernel boot arguments to block initcalls
# (initcall_blacklist). So playbook can edit /etc/default/grub
# to add those parameters, then rebuild GRUB config
# (grub2-mkconfig), then optionally reboot.
#
# We must produce an Ansible playbook that applies to given
# hosts: 'ec2-34-228-227-78.compute-1.amazonaws.com,ec2-54-90-
# 135-180.compute-1.amazonaws.com'.
#
# Should ensure it runs on RHEL only; include condition
# ansible_facts['os_family'] == "RedHat" and maybe version.
#
# Tasks must not include backup, checks, validation. So we
# just edit file using lineinfile or replace, but we must be
# careful not to include backup: lineinfile has backup
# optional default false? It defaults to false. We'll set
# backup: no.
#
# Add kernel boot parameters:
# initcall_blacklist=algif_aead_init
# initcall_blacklist=af_alg_init
# initcall_blacklist=crypto_authenc_esn_module_init
#
# Usually we add them to GRUB_CMDLINE_LINUX in
# /etc/default/grub. Use lineinfile to ensure line contains
# these parameters.
#
# Then run grub2-mkconfig -o /boot/grub2/grub.cfg for BIOS, or
# for UEFI /etc/grub2-efi.cfg. We'll assume BIOS common path.
#
# We can add a task to reboot.
#
# User says no checks or validation; so we won't use when
# checking if already present.
#
# Provide playbook only.
#
# Let's craft.
#######
---
# Playbook to mitigate CVE‑2026‑31431 on RHEL hosts
# ------------------------------------------------
# • No package or kernel updates are performed.
# • No backup, pre‑flight checks or validation steps are included.
# • The only change is to add the required boot‑parameter blacklist
#   entries, rebuild the GRUB config and optionally reboot the node.

- name: Apply CVE‑2026‑31431 mitigation
  hosts: >
    ec2-34-228-227-78.compute-1.amazonaws.com,
    ec2-54-90-135-180.compute-1.amazonaws.com
  become: true
  gather_facts: true

  # *** Restrict execution to RHEL only ***
  pre_tasks:
    - name: Abort if the target is not RHEL
      fail:
        msg: "This playbook is intended for Red Hat Enterprise Linux only."
      when: ansible_facts['os_family'] != "RedHat"

  tasks:

    # ------------------------------------------------
    # 1. Ensure the grub configuration contains the three
    #    initcall_blacklist entries.
    # ------------------------------------------------
    - name: Add initcall_blacklist entries to GRUB_CMDLINE_LINUX
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX="?([^"]*)"?$'
        line: >-
          GRUB_CMDLINE_LINUX="{% raw %}{{ (\\1 | default('')).split() | list
          + ['initcall_blacklist=algif_aead_init',
          'initcall_blacklist=af_alg_init',
          'initcall_blacklist=crypto_authenc_esn_module_init'] | unique | join(' ') }}{% endraw %}"
        backrefs: yes
        state: present
        create: yes
        # No backup, no validation
      vars:
        # Helper for Jinja2 string manipulation – works without extra filters
        __dummy: ""

    # ------------------------------------------------
    # 2. Re‑generate the GRUB configuration file.
    # ------------------------------------------------
    - name: Regenerate grub.cfg (BIOS systems)
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      args:
        warn: false

    - name: Regenerate grub.cfg (UEFI systems)
      command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      args:
        warn: false
      when: ansible_facts['ansible_devices']['/dev/sda']['removable'] is defined
      # (the conditional is a lightweight way to try the UEFI path on most
      #  modern instances; if it does not exist the task will simply be skipped.)

    # ------------------------------------------------
    # 3. Reboot the host so the new kernel parameters take effect.
    # ------------------------------------------------
    - name: Reboot the machine to apply the new kernel command line
      reboot:
        reboot_timeout: 600
        test_command: whoami