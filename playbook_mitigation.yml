---
# -------------------------------------------------
#  CVE‑2026‑31431 mitigation (RHEL only)
# -------------------------------------------------
- name: Mitigate algif_aead copy‑fail bug on RHEL hosts
  hosts: >
    ec2-34-228-227-78.compute-1.amazonaws.com,
    ec2-54-90-135-180.compute-1.amazonaws.com
  become: true               # need root to edit GRUB and reboot
  vars:
    # Choose ONE of the three possible mitigations.
    # Uncomment the line you want to apply.
    grub_mitigation: >
      initcall_blacklist=algif_aead_init          # most specific fix
      #initcall_blacklist=af_alg_init           # block the whole af_alg interface
      #initcall_blacklist=crypto_authenc_esn_module_init  # block the vulnerable algorithm only
  tasks:

    - name: Ensure the GRUB_CMDLINE_LINUX line exists
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="{{ grub_mitigation }}"'
        state: present
        insertafter: EOF
      notify:
        - Rebuild GRUB configuration

    - name: Reboot the node to apply the new kernel command line
      reboot:
        reboot_timeout: 600
        post_reboot_delay: 30
        test_command: whoami      # simple sanity – does not verify the mitigation
      when: not ansible_check_mode

  # -------------------------------------------------
  # Handlers – run only if the GRUB file was changed
  # -------------------------------------------------
  handlers:

    - name: Rebuild GRUB configuration
      block:
        - name: Generate GRUB config for BIOS‑based installs (RHEL 7/8)
          command: grub2-mkconfig -o /boot/grub2/grub.cfg
          changed_when: true
          ignore_errors: true

        - name: Generate GRUB config for UEFI‑based installs (RHEL 8+/9)
          command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
          changed_when: true
          ignore_errors: true
      when: ansible_facts['os_family'] == 'RedHat'