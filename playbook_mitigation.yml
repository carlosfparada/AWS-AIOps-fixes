####### REASONING #######
# We need to produce an Ansible playbook that mitigates CVE
# about WebKitGTK out-of-bounds write. Likely remediation is
# updating the package to a patched version or applying distro
# security updates. Provide tasks: ensure package webkit2gtk
# is at latest version, maybe apply specific version. Also
# ensure that system is rebooted if kernel changes? Not
# needed.
#
# We just need to output only the playbook code, no extra
# text. Use yaml. Should include hosts, become: yes, tasks
# with name, apt/yum/dnf etc. Could use package module with
# state: latest and name: webkit2gtk. Provide comments maybe
# inside yaml but it's still part of playbook. Should be
# minimal.
#
# Let's produce a generic playbook supporting both Debian and
# RedHat families with conditional. Use ansible_facts.
#
# Will output code only.
#######
---
- name: Mitigate WebKitGTK out-of-bounds write vulnerability (CVE-XXXX-XXXX)
  hosts: all
  become: true
  vars:
    webkitgtk_packages:
      Debian:  [ "libwebkit2gtk-4.0-37" ]        # Adjust package name/version as needed
      RedHat:  [ "WebKitGTK3" ]                # Adjust package name/version as needed
  tasks:
    - name: Gather OS family facts
      ansible.builtin.setup:
        filter: ansible_os_family
      tags: always

    - name: Ensure vulnerable WebKitGTK packages are updated (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ webkitgtk_packages['Debian'] }}"
        state: latest
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"
      register: apt_result

    - name: Ensure vulnerable WebKitGTK packages are updated (RedHat/CentOS/Fedora)
      ansible.builtin.yum:
        name: "{{ webkitgtk_packages['RedHat'] }}"
        state: latest
      when: ansible_facts['os_family'] == "RedHat"
      register: yum_result

    - name: Reboot if kernel was updated (optional)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: (apt_result is defined and apt_result.changed) or
            (yum_result is defined and yum_result.changed)
      tags: reboot