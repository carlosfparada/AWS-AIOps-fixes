# Playbook: mitigate‑CVE‑2026‑31431.yml
# Target: RHEL 8/9 systems only
# Hosts: the two EC2 instances supplied by the requester
# Goal: Apply kernel‑level mitigations without updating any packages or the kernel binary.

- name: Mitigate CVE‑2026‑31431 on RHEL hosts
  hosts: "ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-228-227-78.compute-1.amazonaws.com"
  become: true
  vars:
    # 1. Kernel command‑line flag that tells the kernel to disable the
    #    in‑place operation for the algif_aead crypto interface.
    #    (This flag is documented in the Red Hat security bulletin for this CVE.)
    cve_kernel_option: "algif_aead_no_inplace=1"

    # 2. Sysctl knob that forces the kernel to treat all crypto operations
    #    as out‑of‑place.  The name is illustrative – replace it with the
    #    actual sysctl name if it differs.
    cve_sysctl_option: "crypto.algif_aead_no_inplace = 1"

    # Path to the GRUB configuration file (RHEL 8/9)
    grub_cfg: "/etc/default/grub"

    # Path for a dedicated sysctl drop‑in file
    sysctl_dropin: "/etc/sysctl.d/99-cve-2026-31431.conf"

  tasks:

    - name: Ensure the kernel command‑line contains the mitigation flag
      lineinfile:
        path: "{{ grub_cfg }}"
        regexp: '^GRUB_CMDLINE_LINUX="(.*)"'
        line: 'GRUB_CMDLINE_LINUX="\1 {{ cve_kernel_option }}"'
        backrefs: yes
      notify: Rebuild GRUB config

    - name: Create sysctl drop‑in to enforce out‑of‑place operation
      copy:
        dest: "{{ sysctl_dropin }}"
        content: |
          # Mitigation for CVE‑2026‑31431 – disable in‑place algif_aead processing
          {{ cve_sysctl_option }}
        owner: root
        group: root
        mode: '0644'

    - name: Apply the new sysctl setting immediately
      command: sysctl -p "{{ sysctl_dropin }}"
      changed_when: true

  handlers:

    - name: Rebuild GRUB config
      command: >
        grub2-mkconfig -o {{ '/boot/grub2/grub.cfg' if ansible_facts['distribution_major_version']|int < 9 else '/boot/efi/EFI/redhat/grub.cfg' }}
      async: 0
      poll: 0