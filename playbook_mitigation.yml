# ------------------------------------------------------------
# Ansible Playbook – CVE‑2026‑31431 mitigation
# ------------------------------------------------------------
#  • Vulnerability:  Linux kernel algif_aead in‑place operation flaw
#  • Impact:         Local privilege‑escalation via corrupted files
#  • Mitigation:      Install a kernel version that contains the
#                     reverted “out‑of‑place” implementation.
#  • References:
#      - https://www.cve.org/CVERecord?id=CVE-2026-31431
#      - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#      - https://access.redhat.com/articles/7141989
#      - https://access.redhat.com/solutions/7141931
#      - https://access.redhat.com/solutions/7141979
#      - https://access.redhat.com/solutions/7141990
#      - https://access.redhat.com/solutions/7141996
#      - https://access.redhat.com/solutions/7142032
#      - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#      - https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
# ------------------------------------------------------------

- name: Apply CVE‑2026‑31431 mitigation on Amazon Linux / RHEL hosts
  hosts: "ec2-34-229-192-14.compute-1.amazonaws.com,ec2-34-203-232-194.compute-1.amazonaws.com"
  become: true
  vars:
    # The package name that provides the kernel on RHEL‑based systems.
    kernel_pkg: kernel
    # Optional: force a reinstall to guarantee the latest version is present.
    force_install: false

  tasks:

    - name: Ensure the latest kernel package is installed
      yum:
        name: "{{ kernel_pkg }}"
        state: latest
        update_cache: yes
        # The `force` parameter is not required unless you explicitly want to
        # reinstall the same version; it is left optional via the variable.
        force: "{{ force_install }}"
      notify: Reboot host to apply new kernel

    # (Optional) You could add other housekeeping tasks here, e.g., cleaning
    # old kernels, but they are not required for the CVE mitigation.

  handlers:

    - name: Reboot host to apply new kernel
      reboot:
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 30
        msg: "Rebooting to load kernel that fixes CVE‑2026‑31431"