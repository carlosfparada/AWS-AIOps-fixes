---
- name: Mitigate CVE-2026-53359 on RHEL KVM hosts
  hosts: rhel_kvm   # ← adjust to the group/name you use for your RHEL hosts
  become: true
  vars:
    # Set to false if you want to postpone the reboot and handle it manually
    reboot_if_needed: true

  tasks:

    - name: Gather currently running kernel version
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: Install latest RHEL kernel and related KVM packages
      ansible.builtin.yum:
        name:
          - kernel
          - kernel-rt          # (optional – only if you run a realtime kernel)
          - kvm
          - kvm-tools
          - qemu-kvm
          - virt-what
        state: latest
        update_cache: yes
      register: yum_update

    - name: Record whether the kernel package was updated
      ansible.builtin.set_fact:
        kernel_updated: "{{ yum_update.changed and ('kernel' in yum_update.results | map(attribute='name') | list) }}"

    - name: Verify that a newer kernel is now installed
      ansible.builtin.command: rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel
      register: installed_kernels
      changed_when: false

    - name: Show installed kernel versions (debug)
      ansible.builtin.debug:
        msg: "Installed kernel packages: {{ installed_kernels.stdout_lines }}"

    - name: Determine if a reboot is required
      ansible.builtin.set_fact:
        reboot_required: "{{ kernel_updated | bool }}"

    - name: Reboot the host if a newer kernel was installed
      ansible.builtin.reboot:
        msg: "Rebooting to apply kernel update that fixes CVE-2026-53359"
        reboot_timeout: 600
        pre_reboot_delay: 10
        post_reboot_delay: 30
      when:
        - reboot_if_needed | bool
        - reboot_required | bool

    - name: Verify that the host is now running the patched kernel
      ansible.builtin.command: uname -r
      register: new_kernel
      changed_when: false

    - name: Confirm the kernel version changed (optional safety check)
      ansible.builtin.assert:
        that:
          - new_kernel.stdout != current_kernel.stdout
        fail_msg: "The kernel version did NOT change after the reboot – please investigate."
        success_msg: "Host is now running kernel {{ new_kernel.stdout }}, which includes the CVE‑2026‑53359 fix."

    - name: (Optional) Pin the kernel package to the patched version
      ansible.builtin.yum:
        name: kernel
        state: present
        lock: true
      when: false   # set to true only if you want to prevent accidental downgrades