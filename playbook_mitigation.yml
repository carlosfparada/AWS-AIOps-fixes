---
# Minimal Ansible playbook to mitigate CVE‑2026‑31431 on RHEL hosts
# ---------------------------------------------------------------
# Target hosts (use the exact string you supplied)
- hosts: ec2-34-228-227-78.compute-1.amazonaws.com,ec2-54-90-135-180.compute-1.amazonaws.com
  become: true                      # we need root privileges for kernel/grub changes
  gather_facts: true                # needed to verify the OS family

  # Run the play only on Red Hat Enterprise Linux (RHEL) systems
  when: ansible_facts['os_family'] == "RedHat"

  vars:
    # Kernel command‑line option that disables the vulnerable in‑place operation
    # (the exact name is taken from the Red Hat advisory – adjust if the advisory
    #  uses a different name).
    mitigation_option: "algif_aead=noplace"

    # Path to the GRUB configuration file that must be edited
    grub_cfg: /etc/default/grub

  tasks:

    - name: Ensure the mitigation option is present in GRUB_CMDLINE_LINUX
      lineinfile:
        path: "{{ grub_cfg }}"
        regexp: '^GRUB_CMDLINE_LINUX='
        line: >-
          GRUB_CMDLINE_LINUX="{{ (lookup('file', grub_cfg) | regex_search('GRUB_CMDLINE_LINUX="([^"]*)"', '\\1') | default('')) | regex_replace('(?:\\s|^)' + mitigation_option + '(?:\\s|$)', '') }} {{ mitigation_option }}"
        backrefs: yes
        insertafter: EOF
        create: yes
      notify:
        - Rebuild GRUB config

    - name: Verify that the new kernel command line contains the mitigation
      command: grep -E "GRUB_CMDLINE_LINUX=.*{{ mitigation_option }}" "{{ grub_cfg }}"
      register: grep_result
      changed_when: false
      failed_when: grep_result.rc != 0
      # If the check fails, Ansible will abort – this prevents applying an incomplete fix.

  handlers:

    - name: Rebuild GRUB config
      command: >
        {{ ansible_facts['distribution_major_version'] is version('8', '>=')
           | ternary('grub2-mkconfig -o /boot/grub2/grub.cfg',
                     'grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg') }}
      when: ansible_facts['distribution'] == 'RedHat' or ansible_facts['distribution'] == 'CentOS'
      become: true