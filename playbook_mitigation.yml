####### REASONING #######
# We need to write an Ansible playbook to mitigate CVE
# CVE-2026-53359. Must target the given hosts list. Include
# steps: create modprobe config file with options disabling
# nested, unload modules if loaded, verify settings. Provide
# playbook. Also can include tasks to gather facts, check
# modules, remove if necessary, create file, reload sysctl?
# Actually modprobe config requires reboot or reloading
# modules. Provide tasks with become. Use lineinfile to create
# file? Could use copy module. Use shell commands for removal
# and validation. Provide handlers to reboot if needed.
#
# We should comply with policy: providing security advice is
# allowed. No disallowed content. Provide safe playbook.
# Provide explanation. Provide YAML.
#
# Let's answer.
#######
---
- name: Mitigate CVE‑2026‑53359 (KVM shadow‑paging use‑after‑free)
  hosts:
    - ec2-54-237-28-92.compute-1.amazonaws.com
    - ec2-34-230-26-219.compute-1.amazonaws.com
  become: true            # all tasks need root privileges
  gather_facts: true

  vars:
    mitigation_conf: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    kvm_modules:
      - { name: kvm_intel, param_path: /sys/module/kvm_intel/parameters/nested }
      - { name: kvm_amd,   param_path: /sys/module/kvm_amd/parameters/nested   }

  tasks:

    - name: Ensure the mitigation configuration file exists with correct options
      copy:
        dest: "{{ mitigation_conf }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          # CVE‑2026‑53359 mitigation – disable nested virtualization
          options kvm_intel nested=0
          options kvm_amd   nested=0
      notify: Reload KVM modules

    - name: Check which KVM modules are currently loaded
      ansible.builtin.shell: lsmod | awk '{print $1}'
      register: loaded_modules_raw
      changed_when: false

    - name: Build a list of loaded KVM modules
      set_fact:
        loaded_kvm_modules: "{{ loaded_modules_raw.stdout_lines | intersect(['kvm_intel', 'kvm_amd']) }}"

    - name: Remove loaded KVM modules (if any) to apply new options
      ansible.builtin.command: modprobe -r {{ item }}
      loop: "{{ loaded_kvm_modules }}"
      ignore_errors: true   # continue even if one module cannot be removed
      register: rmodprobe_remove
      when: loaded_kvm_modules | length > 0

    - name: Fail if a KVM module could not be removed cleanly
      ansible.builtin.fail:
        msg: |
          The module {{ item.item }} could not be removed (retcode {{ item.rc }})
          – a reboot is required to apply the mitigation.
      loop: "{{ rmodprobe_remove.results }}"
      when: item.failed

    - name: (Re)load KVM modules after removal (optional – many admins prefer a reboot)
      ansible.builtin.command: modprobe {{ item }}
      loop: "{{ loaded_kvm_modules }}"
      when: loaded_kvm_modules | length > 0
      notify: Verify nested flag

    - name: Verify that nested virtualization is disabled
      ansible.builtin.shell: cat {{ item.param_path }}
      register: nested_status
      loop: "{{ kvm_modules }}"
      changed_when: false
      ignore_errors: true

    - name: Show verification result
      ansible.builtin.debug:
        msg: |
          Module {{ item.item.name }} – nested flag = "{{ item.stdout | default('not loaded') }}"
      loop: "{{ nested_status.results }}"

    - name: Fail if any module still reports nested=Y
      ansible.builtin.fail:
        msg: |
          Nested virtualization for {{ item.item.name }} is still enabled (value = "{{ item.stdout }}").
          A reboot is required or the module must be re‑loaded.
      when: item.stdout is defined and item.stdout | trim != 'N'
      loop: "{{ nested_status.results }}"

  handlers:

    - name: Reload KVM modules
      block:
        - name: Attempt to unload kvm_intel (if loaded)
          ansible.builtin.command: modprobe -r kvm_intel
          ignore_errors: true

        - name: Attempt to unload kvm_amd (if loaded)
          ansible.builtin.command: modprobe -r kvm_amd
          ignore_errors: true

        - name: Load kvm_intel with new options
          ansible.builtin.command: modprobe kvm_intel
          when: "'kvm_intel' in ansible_facts.modules"

        - name: Load kvm_amd with new options
          ansible.builtin.command: modprobe kvm_amd
          when: "'kvm_amd' in ansible_facts.modules"

      listen: Reload KVM modules
      become: true

    - name: Verify nested flag (called after reload)
      ansible.builtin.shell: |
        for mod in kvm_intel kvm_amd; do
          if [ -e /sys/module/${mod}/parameters/nested ]; then
            echo "${mod}: $(cat /sys/module/${mod}/parameters/nested)"
          else
            echo "${mod}: not loaded"
          fi
        done
      register: verify_after_reload
      changed_when: false
      listen: Verify nested flag
      become: true

    - name: Reboot host if needed
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami
      when: >
        (loaded_kvm_modules | length > 0) and
        (rmodprobe_remove is defined and rmodprobe_remove.failed)
      listen: Reboot host