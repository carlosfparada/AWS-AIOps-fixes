# ------------------------------------------------------------
# Playbook:  mitigate_cve_2026_31431.yml
# Target hosts: two Amazon‑Linux/Red Hat Enterprise instances
# CVE: CVE‑2026‑31431 – crypto: algif_aead – in‑place operation flaw
# ------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on the affected instances
  hosts: "ec2-34-229-192-14.compute-1.amazonaws.com,ec2-34-203-232-194.compute-1.amazonaws.com"
  become: true                     # we need root privileges
  gather_facts: true

  vars:
    # ---- 1. Patched kernel version (example for RHEL 9) -----------------
    # Replace this with the exact version that contains the fix for
    # CVE‑2026‑31431 as published in the security bulletin.
    patched_kernel_pkg: "kernel-5.15.0-213.el9_2.6"

    # ---- 2. Optional: disable the algif_aead module (if not required) ---
    algif_aead_modprobe_conf: "/etc/modprobe.d/disable-algif_aead.conf"
    algif_aead_modprobe_content: |
      # Disable algif_aead to avoid the in‑place vulnerability
      install algif_aead /bin/false

    # ---- 3. Optional: kernel command‑line parameter (example) ------------
    # Some distributions allow disabling the problematic behaviour via
    # a kernel boot parameter.  Adjust the name/value as described in
    # the vendor’s security bulletin.
    grub_kernel_option: "algif_aead_inplace=0"

  tasks:

    # -----------------------------------------------------------------
    # 1️⃣ Install the specific patched kernel (do NOT use state: latest)
    # -----------------------------------------------------------------
    - name: Install the patched kernel package that contains the CVE fix
      ansible.builtin.yum:
        name: "{{ patched_kernel_pkg }}"
        state: present                       # explicit version, not "latest"
      notify:
        - Rebuild initramfs
        - Update GRUB configuration
        - Reboot host to load patched kernel

    # ---------------------------------------------------------------
    # 2️⃣ Prevent the vulnerable algif_aead module from loading (optional)
    # ---------------------------------------------------------------
    - name: Create modprobe drop‑in to block algif_aead
      ansible.builtin.copy:
        dest: "{{ algif_aead_modprobe_conf }}"
        content: "{{ algif_aead_modprobe_content }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Rebuild initramfs
        - Reboot host (module change requires a reboot)

    # ------------------------------------------------------------
    # 3️⃣ Add a kernel boot parameter that disables in‑place ops (optional)
    # ------------------------------------------------------------
    - name: Ensure kernel command‑line contains the mitigation flag
      ansible.builtin.command: >
        grubby --update-kernel=ALL
               --args="{{ grub_kernel_option }}"
      register: grubby_result
      changed_when: "'{{ grub_kernel_option }}' not in grubby_result.stdout"
      notify:
        - Update GRUB configuration
        - Reboot host (kernel cmdline change)

    # ----------------------------------------------------------------
    # 4️⃣ Record that the mitigation was applied – useful for audit logs
    # ----------------------------------------------------------------
    - name: Write mitigation fact for reporting
      ansible.builtin.copy:
        dest: /etc/cve_mitigation/CVE-2026-31431
        content: |
          CVE‑2026‑31431 mitigated on {{ ansible_date_time.iso8601 }}
          Patched kernel: {{ patched_kernel_pkg }}
          Algif_aead disabled: {{ algif_aead_modprobe_conf }}
          Kernel boot flag: {{ grub_kernel_option }}
          See security bulletin for details.
        owner: root
        group: root
        mode: '0644'
      when: not ansible_facts['distribution'] == 'Ubuntu'   # example condition

# ----------------------------------------------------------------------
# Handlers – **NO block structures** (each handler is a single task)
# ----------------------------------------------------------------------
  handlers:

    - name: Rebuild initramfs
      ansible.builtin.command: >
        dracut -f
      args:
        warn: false

    - name: Update GRUB configuration
      ansible.builtin.command: >
        grub2-mkconfig -o /boot/grub2/grub.cfg
      args:
        warn: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Reboot host to load patched kernel
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami