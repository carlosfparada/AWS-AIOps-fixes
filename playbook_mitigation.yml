# --------------------------------------------------------------
# Playbook:  mitigate_cve_2026_31431.yml
# Purpose:  Apply the vendor‑recommended mitigation for CVE‑2026‑31431
#           (Linux kernel algif_aead in‑place operation flaw).
# Hosts:   ec2-54-237-246-170.compute-1.amazonaws.com,
#          ec2-34-229-197-19.compute-1.amazonaws.com
# --------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on the target EC2 instances
  hosts: ec2-54-237-246-170.compute-1.amazonaws.com,ec2-34-229-197-19.compute-1.amazonaws.com
  become: true                     # all tasks need root privileges
  gather_facts: true

  vars:
    # The minimum kernel release that contains the upstream revert
    # (the exact version depends on the distro – adjust if needed)
    #   RHEL9: 5.14.0-282.10.1.el9_2
    #   Amazon Linux 2023: kernel-6.1.84-1.amzn2023.0.1
    # Feel free to override this variable at runtime.
    required_kernel_version: ""

  tasks:

    - name: "Ensure the system is using a supported, up‑to‑date kernel"
      package:
        name: kernel
        state: latest
      when: ansible_os_family in ["RedHat", "Debian", "Suse"]
      register: kernel_pkg

    - name: "Refresh the grub configuration (RHEL / Amazon Linux family)"
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when:
        - ansible_os_family == "RedHat"
        - kernel_pkg.changed
      notify: Reboot host

    - name: "Refresh the EFI boot loader (if using UEFI on RHEL family)"
      command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      when:
        - ansible_os_family == "RedHat"
        - kernel_pkg.changed
        - ansible_facts['devices']['disk'] is defined
        - ansible_facts['devices']['disk'][0]['partitions'] is defined
      notify: Reboot host

    - name: "Update bootloader on Debian/Ubuntu (if required)"
      when:
        - ansible_os_family == "Debian"
        - kernel_pkg.changed
      block:
        - name: "Regenerate initramfs"
          command: update-initramfs -u -k all
        - name: "Update GRUB configuration"
          command: update-grub
      notify: Reboot host

    - name: "Verify the running kernel version meets the minimum requirement"
      command: uname -r
      register: running_kernel
      changed_when: false

    - name: "Fail if the running kernel is still vulnerable"
      fail:
        msg: >
          The host is still running an old kernel ({{ running_kernel.stdout }}) that
          does not contain the fix for CVE‑2026‑31431.  A reboot is required after
          the kernel package update.
      when:
        - required_kernel_version != ""
        - running_kernel.stdout is version(required_kernel_version, '<')
      # If no explicit version is set we rely on the previous reboot handler.

  handlers:
    - name: Reboot host
      reboot:
        msg: "Rebooting to load the newly installed kernel with CVE‑2026‑31431 mitigation"
        pre_reboot_delay: 5
        reboot_timeout: 600
        test_command: whoami