# Playbook: mitigate_cve_2026_31431.yml
# Description:  Mitigate CVE‑2026‑31431 on RHEL hosts by black‑listing the
#               vulnerable kernel init‑calls.  No package updates or validation
#               steps are performed – only kernel boot‑parameter changes and a
#               reboot.

- name: Apply CVE‑2026‑31431 mitigation on RHEL systems
  hosts: ec2-34-228-227-78.compute-1.amazonaws.com,ec2-54-90-135-180.compute-1.amazonaws.com
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify target OS is RedHat family
      assert:
        that: ansible_facts['os_family'] == "RedHat"
        fail_msg: "The target host is not a RedHat based system."

  tasks:
    # ------------------------------------------------------------
    # Add the required initcall_blacklist entry to the GRUB cmdline
    # ------------------------------------------------------------
    - name: Append initcall_blacklist=algif_aead_init to GRUB_CMDLINE_LINUX
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX="(.*)"'
        line: 'GRUB_CMDLINE_LINUX="\1 initcall_blacklist=algif_aead_init"'
        backrefs: yes
      notify: Regenerate GRUB configuration

    # ------------------------------------------------------------
    # Regenerate GRUB configuration for BIOS‑based installs
    # ------------------------------------------------------------
    - name: Regenerate GRUB config (BIOS)
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_facts['ansible_devices']['/dev/sda'] is defined   # simple BIOS check
      listen: Regenerate GRUB configuration

    # ------------------------------------------------------------
    # Regenerate GRUB configuration for UEFI‑based installs
    # ------------------------------------------------------------
    - name: Regenerate GRUB config (UEFI)
      command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      when: ansible_facts['ansible_mounts'] | selectattr('mount','equalto','/sys/firmware/efi') | list | length > 0
      listen: Regenerate GRUB configuration

    # ------------------------------------------------------------
    # Reboot to apply the new kernel parameters
    # ------------------------------------------------------------
    - name: Reboot the host so the blacklist takes effect
      reboot:
        reboot_timeout: 600
        test_command: uptime