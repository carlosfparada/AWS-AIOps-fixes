# ------------------------------------------------------------
# Playbook:  mitigate_cve_2026_31431.yml
# Purpose : Apply the Red Hat security‑bulletin mitigation for
#           CVE‑2026‑31431 (algif_aead in‑place operation flaw).
# ------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on the two EC2 instances
  hosts: "ec2-52-207-223-135.compute-1.amazonaws.com,ec2-54-152-125-62.compute-1.amazonaws.com"
  become: true                     # all actions need root privileges
  gather_facts: true

  vars:
    # The specific kernel version that contains the back‑ported fix.
    # Do NOT use “latest kernel” – we pin to the version published in the
    # Red Hat security advisory (see the references below).
    patched_kernel_rhel9: "kernel-5.14.0-284.el9"
    # If you are on RHEL 8 use the corresponding package name instead.
    # e.g. patched_kernel_rhel8: "kernel-4.18.0-425.el8"

  tasks:

    - name: Ensure the package manager cache is up‑to‑date (yum/dnf)
      ansible.builtin.yum:
        update_cache: yes
      when: ansible_facts['pkg_mgr'] == 'yum'

    - name: Install the patched kernel that contains the CVE fix (RHEL 9)
      ansible.builtin.yum:
        name: "{{ patched_kernel_rhel9 }}"
        state: present
      when:
        - ansible_facts['distribution'] == "RedHat"
        - ansible_facts['distribution_major_version'] | int == 9

    - name: Verify that the patched kernel is now installed
      ansible.builtin.command: rpm -q {{ patched_kernel_rhel9 }}
      register: kernel_check
      changed_when: false

    - name: Set the default boot entry to the newly‑installed kernel
      ansible.builtin.command: |
        grub2-set-default 0
      when: kernel_check.rc == 0
      notify: Reboot host to activate patched kernel

    - name: Add a note to /etc/motd so admins know the mitigation is applied
      ansible.builtin.lineinfile:
        path: /etc/motd
        line: "CVE‑2026‑31431 mitigation applied – patched kernel {{ patched_kernel_rhel9 }} installed."
        state: present

  # ------------------------------------------------------------
  # Handlers – NOT USING block structures (as requested)
  # ------------------------------------------------------------
  handlers:

    - name: Reboot host to activate patched kernel
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami

