# /boot/grub2/grub.cfg (or /etc/grub2.cfg for UEFI). Also run
# reboot.
#
# We should limit to RHEL only: use when:
# ansible_facts['distribution'] == 'RedHat' or
# ansible_os_family == 'RedHat'.
#
# We need a simple playbook. Use hosts: ec2-..., all. Use
# gather_facts: true.
#
# We'll include tasks: ensure boot args include
# initcall_blacklist=algif_aead_init, af_alg_init,
# crypto_authenc_esn_module_init etc. Possibly combine into a
# single line separated by space. Update lineinfile regex to
# match existing GRUB_CMDLINE_LINUX.
#
# Add task to rebuild grub: command: grub2-mkconfig -o
# /boot/grub2/grub.cfg (for BIOS) but for UEFI it's
# /boot/efi/EFI/redhat/grub.cfg; we can use conditional based
# on ansible_facts['ansible_devices']? Simpler: use
# 'grub2-mkconfig -o /boot/grub2/grub.cfg' for RHEL.
