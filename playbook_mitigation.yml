# Minimalist Ansible playbook to mitigate CVE‑2026‑53359 on RHEL hosts
# ---------------------------------------------------------------
# CVE‑2026‑53359: KVM x86 shadow‑paging use‑after‑free vulnerability.
# Mitigation is achieved by installing the kernel version that contains the
# upstream fix (released in the RHEL security advisory RHSA‑2026:xxxx) and
# rebooting the machine so the new kernel is used.
#
# This playbook assumes the target hosts belong to an inventory group called
# "rhel".  It runs with escalated privileges (become: true) because kernel
# updates require root access.

- name: Mitigate CVE‑2026‑53359 on RHEL hosts
  hosts: rhel
  become: true
  vars:
    # The package name and the minimal version that contains the fix.
    # Adjust these values if a later advisory changes the required version.
    kernel_pkg: kernel
    # Example of the patched version; replace with the exact version from
    # the Red Hat advisory (e.g., 5.14.0-284.el9).
    kernel_fixed_version: ">=5.14.0-284.el9"

  tasks:

    - name: Ensure the latest patched kernel is installed
      ansible.builtin.yum:
        name: "{{ kernel_pkg }}"
        state: latest
        # Use the "enablerepo" option only if you need a specific repo such as
        # rhel-9-for-x86_64-baseos-rpms.  Omit if the system is already subscribed.
        # enablerepo: rhel-9-for-x86_64-baseos-rpms
      register: yum_result

    - name: Verify the installed kernel meets the fixed version requirement
      ansible.builtin.command: rpm -q --qf "%{VERSION}-%{RELEASE}\n" {{ kernel_pkg }}
      register: kernel_version
      changed_when: false
      failed_when: kernel_version.stdout is not match('^([0-9]+\\.){2}[0-9]+-[0-9]+.*$')
      # The regex above is a generic sanity check; for stricter verification,
      # compare against the exact version string from the advisory.

    - name: Debug – show the kernel version that is now installed
      ansible.builtin.debug:
        msg: "Installed {{ kernel_pkg }} version: {{ kernel_version.stdout }}"

    - name: Reboot the host if the kernel was updated
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: uname -r
      when: yum_result.changed

    - name: Ensure the running kernel is the patched one after reboot
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false

    - name: Fail if the running kernel is still vulnerable
      ansible.builtin.fail:
        msg: |
          The host is still running a vulnerable kernel ({{ running_kernel.stdout }}).
          Expected a kernel version that includes the CVE‑2026‑53359 fix.
      when: running_kernel.stdout is not match('^5\\.14\\.0-284.*$')
      # Adjust the pattern to match the exact fixed kernel release.