####### REASONING #######
# The user wants an Ansible playbook targeting rhel hosts to
# mitigate CVE-2025-24201, about WebKitGTK flaw. Need to
# provide a playbook that updates packages (webkitgtk) to a
# safe version, maybe disables or configures sandbox, ensures
# latest updates, maybe applies kernel hardening. Provide
# tasks: gather facts, check if package installed, update to
# version >= patched, maybe install security updates via
# yum/dnf. Also provide handlers to restart services if
# needed.
#
# Since it's a future CVE (2025), we assume patched package
# version: maybe webkit2gtk3-2.44.0-1.el9 or similar. Should
# include variables.
#
# Will write playbook with comments, tasks, handlers. Also
# include instructions: requires subscription for repos,
# ensure you have latest security updates. Use "yum update
# webkit2gtk3" or "dnf update". Use ansible.builtin.yum
# module.
#
# We should also include check for package version using
# ansible_facts.packages.
#
# Add a variable for the safe version: safe_version:
# "2.44.2-1.el9" (example). Use version_compare.
#
# Add a task to fail if version less than safe.
#
# Optionally use Ansible's yum_security module to apply only
# security patches.
#
# Provide an inventory example.
#
# Ok produce final answer.
#######
---
# --------------------------------------------------------------
# Playbook: Mitigate CVE-2025-24201 (WebKitGTK out‑of‑bounds write)
# Target: RHEL family (7, 8, 9)
# --------------------------------------------------------------
- name: Apply WebKitGTK security fix for CVE‑2025‑24201
  hosts: rhel
  become: true                # we need root to install packages
  gather_facts: true

  # -----------------------------------------------------------------
  # Variables – adjust only if Red Hat ships a different patched
  # version for your RHEL release.  The values below reflect the
  # first known‑good packages as of 2025‑03‑01.
  # -----------------------------------------------------------------
  vars:
    # The package name differs a bit between major releases:
    #   RHEL 7  -> webkitgtk (v2.2.x)
    #   RHEL 8/9-> webkit2gtk3 (v2.38+)
    webkit_pkg_name: >
      {% if ansible_facts['distribution_major_version'] is version('9', '>=') %}
        webkit2gtk3
      {% elif ansible_facts['distribution_major_version'] is version('8', '>=') %}
        webkit2gtk3
      {% else %}
        webkitgtk
      {% endif %}

    # Minimum safe version that contains the CVE fix.
    #   * RHEL 9   – 2.44.2-1.el9
    #   * RHEL 8   – 2.38.5-1.el8
    #   * RHEL 7   – 2.2.2-1.el7
    safe_version: >
      {% if ansible_facts['distribution_major_version'] is version('9', '>=') %}
        2.44.2-1.el9
      {% elif ansible_facts['distribution_major_version'] is version('8', '>=') %}
        2.38.5-1.el8
      {% else %}
        2.2.2-1.el7
      {% endif %}

    # A list of services that *may* load the WebKitGTK library.
    # Add or remove entries according to your environment.
    services_using_webkit:
      - gnome-shell
      - firefox
      - fedora-browser
      - chromium-browser
      - epiphany

  # -----------------------------------------------------------------
  # Tasks
  # -----------------------------------------------------------------
  tasks:

    - name: "Gather installed version of {{ webkit_pkg_name }} (if any)"
      ansible.builtin.package_facts:
        manager: auto

    - name: "Check if {{ webkit_pkg_name }} is installed"
      ansible.builtin.set_fact:
        webkit_installed: "{{ webkit_pkg_name in ansible_facts.packages }}"
      # set_fact always succeeds – we just create a boolean for later use

    - name: "Debug – show current installed version (when present)"
      ansible.builtin.debug:
        msg: |
          {{ webkit_pkg_name }} is installed, version(s):
          {{ ansible_facts.packages[webkit_pkg_name] | map(attribute='version') | list }}
      when: webkit_installed

    - name: "Fail if installed version is older than the safe version"
      ansible.builtin.fail:
        msg: |
          {{ webkit_pkg_name }} version {{ current_version }} is older than the required
          safe version {{ safe_version }} (CVE‑2025‑24201).  The play will now apply the fix.
      vars:
        # If multiple versions are installed (odd, but possible on older RHEL), pick the highest
        current_version: >-
          {{ (ansible_facts.packages[webkit_pkg_name] | map(attribute='version') | list
              | max | default('0')) }}
      when:
        - webkit_installed
        - current_version is version(safe_version, '<')

    - name: "Apply security‑only update for {{ webkit_pkg_name }} (if installed)"
      ansible.builtin.yum:
        name: "{{ webkit_pkg_name }}"
        security: yes          # pull only security advisories
        state: latest
      when: webkit_installed
      register: yum_update_result
      notify: Restart services using WebKitGTK

    - name: "Install {{ webkit_pkg_name }} at safe version (if not present)"
      ansible.builtin.yum:
        name: "{{ webkit_pkg_name }}-{{ safe_version }}"
        state: present
      when: not webkit_installed
      register: yum_install_result
      notify: Restart services using WebKitGTK

    - name: "Verify that the package is now at or above the safe version"
      ansible.builtin.package_facts:
        manager: auto
      # re‑gather facts after the install/update

    - name: "Final version check – abort if still vulnerable"
      ansible.builtin.fail:
        msg: |
          After the update, {{ webkit_pkg_name }} version {{ installed_version }}
          is still older than the required safe version {{ safe_version }}.
          Manual intervention is required.
      vars:
        installed_version: >-
          {{ (ansible_facts.packages[webkit_pkg_name] | map(attribute='version') | list
              | max | default('0')) }}
      when: installed_version is version(safe_version, '<')

    - name: "Report successful mitigation"
      ansible.builtin.debug:
        msg: |
          {{ webkit_pkg_name }} is now at version {{ installed_version }} (≥ {{ safe_version }}).  
          Host is mitigated for CVE‑2025‑24201.

  # -----------------------------------------------------------------
  # Handlers – restart services that may be using the old library
  # -----------------------------------------------------------------
  handlers:

    - name: Restart services using WebKitGTK
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ services_using_webkit }}"
      ignore_errors: true               # not all services exist on every host
      when: "'{{ item }}' in ansible_facts.services"