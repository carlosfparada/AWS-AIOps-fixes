# file: mitigate_cve-2026-31431.yml
# Ansible playbook – RHEL 9 only – kernel‑parameter mitigation for CVE‑2026‑31431
# No package or kernel binary updates are performed.
# The vulnerable in‑place operation of the algif_aead interface is disabled
# by adding a kernel command‑line option and regenerating the GRUB config.
# After the change the nodes are rebooted so the new kernel parameters take effect.

- name: Mitigate CVE‑2026‑31431 on RHEL 9 hosts
  hosts: >
    ec2-34-228-227-78.compute-1.amazonaws.com,
    ec2-54-90-135-180.compute-1.amazonaws.com
  become: true
  vars:
    # Kernel parameter that disables the in‑place algif_aead handling.
    # This value is taken from Red Hat’s advisory for CVE‑2026‑31431.
    # (If Red Hat later changes the exact flag, adjust accordingly.)
    algif_aead_kernel_option: "algif_aead.disable=1"
    grub_cfg_path: /etc/default/grub
    grub_cfg_backup: /etc/default/grub.cve2026-31431.bak

  tasks:

    - name: Ensure the host is running RHEL 9
      ansible.builtin.command: cat /etc/redhat-release
      register: rhel_release
      changed_when: false

    - name: Bail out if not RHEL 9
      ansible.builtin.fail:
        msg: "This playbook is intended for RHEL 9 only."
      when: "'Red Hat Enterprise Linux release 9' not in rhel_release.stdout"

    - name: Backup current GRUB configuration
      ansible.builtin.copy:
        src: "{{ grub_cfg_path }}"
        dest: "{{ grub_cfg_backup }}"
        remote_src: true
        mode: '0644'

    - name: Add the algif_aead mitigation kernel option to GRUB_CMDLINE_LINUX
      ansible.builtin.lineinfile:
        path: "{{ grub_cfg_path }}"
        regexp: '^GRUB_CMDLINE_LINUX="(.*)"'
        line: 'GRUB_CMDLINE_LINUX="\1 {{ algif_aead_kernel_option }}"'
        backrefs: true

    - name: Regenerate GRUB configuration (BIOS systems)
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_facts['ansible_device_links']['/dev/sda'] is defined

    - name: Regenerate GRUB configuration (UEFI systems)
      ansible.builtin.command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      when: ansible_facts['ansible_device_links']['/dev/sda'] is not defined

    - name: Reboot the node to apply the new kernel parameter
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami