---
- name: Mitigate WebKitGTK out-of-bounds write vulnerability (CVE‑XXXX-XXXX)
  hosts: all
  become: true
  vars:
    # Adjust these package names if your distribution uses different naming
    webkitgtk_packages:
      debian:
        - libwebkit2gtk-4.0-37
        - libwebkit2gtk-4.0-dev
      redhat:
        - webkit2gtk3
        - webkit2gtk3-devel

  tasks:

    - name: Determine package manager
      ansible.builtin.setup:
        filter: ansible_pkg_mgr
      register: pkg_mgr_info

    - name: Set package list based on OS family
      set_fact:
        packages_to_update: "{{ webkitgtk_packages[ansible_facts['os_family'] | lower] | default([]) }}"

    - name: Ensure WebKitGTK packages are at latest version
      ansible.builtin.package:
        name: "{{ packages_to_update }}"
        state: latest
      when: packages_to_update | length > 0

    - name: Verify installed version meets or exceeds fixed release
      ansible.builtin.command: >
        dpkg-query -W -f='${Version}' {{ packages_to_update[0] }}
      register: current_version
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Fail if vulnerable version is still installed (Debian)
      ansible.builtin.fail:
        msg: >
          Vulnerable WebKitGTK version {{ current_version.stdout }} detected.
          Upgrade failed or not available in configured repositories.
      when:
        - ansible_facts['os_family'] == "Debian"
        - current_version.stdout is version('2.36.5', '<')   # replace with the fixed version

    - name: Verify installed version meets or exceeds fixed release (RedHat)
      ansible.builtin.command: >
        rpm -q --qf '%{VERSION}-%{RELEASE}' {{ packages_to_update[0] }}
      register: current_version_rpm
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Fail if vulnerable version is still installed (RedHat)
      ansible.builtin.fail:
        msg: >
          Vulnerable WebKitGTK version {{ current_version_rpm.stdout }} detected.
          Upgrade failed or not available in configured repositories.
      when:
        - ansible_facts['os_family'] == "RedHat"
        - current_version_rpm.stdout is version('2.36.5-1.el8', '<')   # replace with the fixed version