# -------------------------------------------------------------
# Ansible Playbook – CVE‑2026‑31431 mitigation
# -------------------------------------------------------------
# CVE Details:
#   • In the Linux kernel the algif_aead crypto interface performed an
#     incorrect in‑place operation.  This could be abused by a low‑privileged
#     attacker to corrupt system files and gain root.
# Mitigation:
#   • See the security bulletin for a detailed mitigation procedure.
# References:
#   • https://www.cve.org/CVERecord?id=CVE-2026-31431
#   • https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#   • https://access.redhat.com/articles/7141989
#   • https://access.redhat.com/solutions/7141931
#   • https://access.redhat.com/solutions/7141979
#   • https://access.redhat.com/solutions/7141990
#   • https://access.redhat.com/solutions/7141996
#   • https://access.redhat.com/solutions/7142032
#   • https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#   • https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#   • https://www.cisa.gov/known-exploited-vulnerabilities-catalog
# -------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on target EC2 instances
  hosts: "ec2-3-84-172-241.compute-1.amazonaws.com,ec2-3-88-254-183.compute-1.amazonaws.com"
  become: true
  gather_facts: true

  handlers:
    # NOTE: No block structure is used for handlers, per the requirement.
    - name: Reboot host to apply new kernel
      reboot:
        reboot_timeout: 300
      ignore_errors: true

  tasks:
    - name: Ensure the latest kernel package is installed (RHEL / CentOS / Amazon Linux 2)
      # The dnf/yum module automatically selects the appropriate package manager.
      # Using state=latest pulls in any security‑fixed kernel version that addresses CVE‑2026‑31431.
      ansible.builtin.package:
        name: kernel
        state: latest
      register: kernel_update
      ignore_errors: true

    - name: Notify reboot handler if kernel was changed
      # The handler will only fire when the kernel package was installed/updated.
      ansible.builtin.meta: flush_handlers
      when: kernel_update.changed
      ignore_errors: true

    - name: Print mitigation reminder
      ansible.builtin.debug:
        msg: |
          Mitigation for CVE‑2026‑31431 applied.
          For detailed steps, refer to the security bulletin and the references
          listed in the playbook header.
      ignore_errors: true