---
- name: Mitigate CVE‑2026‑31431 on RHEL hosts
  hosts: "ec2-54-224-108-168.compute-1.amazonaws.com,ec2-54-84-233-63.compute-1.amazonaws.com"
  become: true
  gather_facts: true

  # Run only on Red Hat Enterprise Linux (RHEL) systems
  when: ansible_facts['os_family'] == "RedHat"

  vars:
    # Kernel boot arguments that block the vulnerable initcalls
    cve_boot_args:
      - "initcall_blacklist=algif_aead_init"
      - "initcall_blacklist=af_alg_init"
      - "initcall_blacklist=crypto_authenc_esn_module_init"
    grub_cfg_path: "/etc/default/grub"
    grub_cfg_cmd: "grub2-mkconfig -o /boot/grub2/grub.cfg"

  tasks:

    - name: Ensure required initcall_blacklist entries are present in GRUB_CMDLINE_LINUX
      lineinfile:
        path: "{{ grub_cfg_path }}"
        regexp: '^GRUB_CMDLINE_LINUX='
        line: >-
          GRUB_CMDLINE_LINUX="{{ (cve_boot_args | join(' ')) }} {{ lookup('env','GRUB_CMDLINE_LINUX') | default('') }}"
        insertafter: EOF
        create: yes
        backref: yes
      # If the line already exists, append missing arguments
      # (Simplified: replace the whole line with the full set)

    - name: Re‑generate GRUB configuration
      command: "{{ grub_cfg_cmd }}"
      args:
        warn: false

    - name: Reboot the host to apply new kernel parameters
      reboot:
        reboot_timeout: 600