# CVE‑2025‑24201 mitigation playbook
# --------------------------------------------------------------
# Target:   RHEL 7/8/9 (or compatible) hosts
# Goal:     Install the security‑patched WebKitGTK package and
#           ensure SELinux is enforcing.
# --------------------------------------------------------------

- name: Mitigate CVE‑2025‑24201 (WebKitGTK out‑of‑bounds write)
  hosts: rhel            # <-- customise this to match your inventory group
  become: true           # required to install packages / change SELinux
  gather_facts: true

  vars:
    # ------------------------------------------------------------------
    # The package name that contains WebKitGTK on each RHEL major release.
    #   RHEL 7  -> webkitgtk3 (provided by the 'webkitgtk3' SRPM)
    #   RHEL 8/9 -> webkit2gtk3 (the modern split‑package name)
    # ------------------------------------------------------------------
    webkit_pkg_rhel7:  webkitgtk3
    webkit_pkg_rhel8:  webkit2gtk3
    webkit_pkg_rhel9:  webkit2gtk3

    # Minimum version that contains the fix (taken from Red Hat advisories)
    #   * RHEL 7  : 2.4.11-8.el7_9
    #   * RHEL 8  : 2.42.5-1.el8
    #   * RHEL 9  : 2.42.5-1.el9
    #
    # Adjust if a later patch level is released.
    webkit_fixed_version_rhel7: "2.4.11-8.el7_9"
    webkit_fixed_version_rhel8: "2.42.5-1.el8"
    webkit_fixed_version_rhel9: "2.42.5-1.el9"

    # Whether you want the host to reboot automatically if a kernel update
    # was installed.  Set to false if you prefer to handle reboots manually.
    auto_reboot: true

  # ------------------------------------------------------------------------
  # Determine which package name & fixed version apply to the current host.
  # ------------------------------------------------------------------------
  pre_tasks:
    - name: Set platform‑specific variables
      set_fact:
        webkit_pkg: >-
          {% if ansible_distribution_major_version | int == 7 %}
            {{ webkit_pkg_rhel7 }}
          {% elif ansible_distribution_major_version | int == 8 %}
            {{ webkit_pkg_rhel8 }}
          {% else %}
            {{ webkit_pkg_rhel9 }}
          {% endif %}
        webkit_fixed_version: >-
          {% if ansible_distribution_major_version | int == 7 %}
            {{ webkit_fixed_version_rhel7 }}
          {% elif ansible_distribution_major_version | int == 8 %}
            {{ webkit_fixed_version_rhel8 }}
          {% else %}
            {{ webkit_fixed_version_rhel9 }}
          {% endif %}

    - name: Debug – show resolved package & version
      debug:
        msg: "Will manage package '{{ webkit_pkg }}' – fixed version ≥ {{ webkit_fixed_version }}"

  # ------------------------------------------------------------------------
  # Main remediation tasks
  # ------------------------------------------------------------------------
  tasks:

    - name: Ensure the package cache is up‑to‑date (dnf on RHEL8/9, yum on RHEL7)
      ansible.builtin.package:
        update_cache: yes
      when: ansible_pkg_mgr in ['dnf', 'yum']

    - name: Install/upgrade the WebKitGTK package to the latest security‑fixed release
      ansible.builtin.package:
        name: "{{ webkit_pkg }}"
        state: latest
        # The `security: true` flag works with the `dnf` module; for yum we
        # fall back to a normal `latest` install because yum does not expose
        # an explicit security flag.
        security: "{{ ansible_pkg_mgr == 'dnf' }}"
      register: webkit_pkg_result
      notify:
        - Reboot host if required

    - name: Verify the installed version satisfies the CVE fix requirement
      ansible.builtin.command:
        cmd: rpm -q --qf "%{VERSION}-%{RELEASE}" {{ webkit_pkg }}
      register: installed_version
      changed_when: false
      check_mode: no

    - name: Fail if the installed version is older than the fixed version
      ansible.builtin.assert:
        that:
          - "installed_version.stdout is version(webkit_fixed_version, '>=')"
        fail_msg: |
          The installed {{ webkit_pkg }} version ({{ installed_version.stdout }}) is
          older than the version that contains the CVE‑2025‑24201 fix
          ({{ webkit_fixed_version }}).  Please check your repos or consider
          applying Red Hat's advisory manually.
        success_msg: |
          {{ webkit_pkg }} version {{ installed_version.stdout }} meets or exceeds
          the required fixed version {{ webkit_fixed_version }}.

    - name: Ensure SELinux is in enforcing mode (hardening the sandbox)
      ansible.builtin.seboolean:
        name: selinuxuser_execheap
        state: true
        persistent: yes
      when: ansible_facts.selinux.status != "enabled"

    - name: Set SELinux mode to enforcing (if currently permissive)
      ansible.builtin.command: setenforce 1
      when: ansible_facts.selinux.mode != "enforcing"
      become: true

  # ------------------------------------------------------------------------
  # Handlers
  # ------------------------------------------------------------------------
  handlers:

    - name: Reboot host if required
      ansible.builtin.reboot:
        msg: "Reboot triggered by CVE‑2025‑24201 mitigation playbook"
        reboot_timeout: 600
      when: auto_reboot | bool