####### REASONING #######
# We need to output only ansible playbook code that mitigates
# the CVE for WebKitGTK. Likely updating the package to fixed
# version, ensuring patches applied, maybe enable security
# updates. Provide playbook. We must output only the playbook
# code, no extra text. So start with "---" then tasks. Could
# include hosts, become: true. Use apt/yum module for package
# update. Provide variables for version perhaps. Could also
# check service restart if needed. Provide handlers. Let's
# produce concise playbook.
#######
---
- name: Mitigate WebKitGTK out-of-bounds write vulnerability
  hosts: all
  become: true
  vars:
    webkitgtk_package:
      Debian: "libwebkit2gtk-4.0-37"
      RedHat: "webkitgtk4"
    webkitgtk_fixed_version:
      Debian: "2.40.5-0ubuntu0.22.04.1"   # example fixed version
      RedHat: "2.40.5-1.el9"              # example fixed version
  tasks:
    - name: Gather OS distribution facts
      ansible.builtin.setup:
        filter: ansible_distribution*
    
    - name: Set package name based on OS family
      set_fact:
        pkg_name: "{{ webkitgtk_package[ansible_facts['os_family']] }}"
    
    - name: Ensure WebKitGTK is at a fixed version (Debian/Ubuntu)
      when: ansible_facts['os_family'] == 'Debian'
      apt:
        name: "{{ pkg_name }}={{ webkitgtk_fixed_version['Debian'] }}"
        state: present
        update_cache: yes
      notify: Restart affected services
    
    - name: Ensure WebKitGTK is at a fixed version (RedHat/CentOS/Fedora)
      when: ansible_facts['os_family'] == 'RedHat'
      yum:
        name: "{{ pkg_name }}-{{ webkitgtk_fixed_version['RedHat'] }}"
        state: present
      notify: Restart affected services

    - name: Verify installed version is fixed or newer
      command: "{{ ansible_facts['os_family'] == 'Debian' | ternary('dpkg -s ' + pkg_name, 'rpm -q ' + pkg_name) }}"
      register: version_check
      changed_when: false

    - name: Fail if vulnerable version is still installed
      fail:
        msg: "WebKitGTK vulnerable version detected. Manual intervention required."
      when: >
        (ansible_facts['os_family'] == 'Debian' and
         version_check.stdout is search('Version: (?!{{ webkitgtk_fixed_version['Debian'] }})')) or
        (ansible_facts['os_family'] == 'RedHat' and
         version_check.stdout is search('{{ webkitgtk_fixed_version['RedHat'] }}') == false)

  handlers:
    - name: Restart affected services
      service:
        name: "{{ item }}"
        state: restarted
      loop:
        - gdm
        - lightdm
        - sddm
        - plasma-desktop