---
# Playbook: mitigate_cve_2026_53359.yml
# Description:  Disables nested KVM virtualization on the two affected
#               EC2 hosts in order to mitigate CVE‑2026‑53359.
#               The mitigation consists of:
#               1) Removing any loaded kvm_intel / kvm_amd modules.
#               2) Installing a modprobe drop‑in that forces nested=0.
#               3) Reloading the modules so the new options take effect.
#               4) Verifying the modules report “N” (nested disabled).

- name: Mitigate CVE‑2026‑53359 on selected EC2 instances
  hosts: 
    - ec2-54-237-28-92.compute-1.amazonaws.com
    - ec2-34-230-26-219.compute-1.amazonaws.com
  become: true                # required to manage kernel modules and /etc files
  gather_facts: false        # not needed for this task set

  vars:
    mitigation_conf: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    mitigation_content: |
      # CVE‑2026‑53359 – disable nested virtualization
      options kvm-intel nested=0
      options kvm-amd   nested=0

  tasks:

    # -----------------------------------------------------------------
    # 1. Detect which KVM modules are currently loaded
    # -----------------------------------------------------------------
    - name: Check if kvm_intel is loaded
      command: lsmod
      register: lsmod_out
      changed_when: false

    - name: Set fact – kvm_intel_loaded
      set_fact:
        kvm_intel_loaded: "{{ 'kvm_intel' in lsmod_out.stdout_lines|map('split')|map('first')|list }}"

    - name: Set fact – kvm_amd_loaded
      set_fact:
        kvm_amd_loaded: "{{ 'kvm_amd' in lsmod_out.stdout_lines|map('split')|map('first')|list }}"

    # -----------------------------------------------------------------
    # 2. Unload any loaded modules before we change their parameters
    # -----------------------------------------------------------------
    - name: Remove kvm_intel module if loaded
      command: modprobe -r kvm_intel
      when: kvm_intel_loaded
      notify: reload kvm modules
      ignore_errors: true     # ignore if removal fails for any reason

    - name: Remove kvm_amd module if loaded
      command: modprobe -r kvm_amd
      when: kvm_amd_loaded
      notify: reload kvm modules
      ignore_errors: true

    # -----------------------------------------------------------------
    # 3. Install the mitigation drop‑in file
    # -----------------------------------------------------------------
    - name: Deploy modprobe mitigation configuration
      copy:
        dest: "{{ mitigation_conf }}"
        content: "{{ mitigation_content }}"
        owner: root
        group: root
        mode: '0644'
      notify: reload kvm modules

    # -----------------------------------------------------------------
    # 4. (Re)load the modules so the new options are applied
    # -----------------------------------------------------------------
    # The handler defined below will execute the reload when it is
    # notified by any of the previous tasks.

    # -----------------------------------------------------------------
    # 5. Verify that nested virtualization is now disabled
    # -----------------------------------------------------------------
    - name: Verify nested disabled for kvm_intel (if module present)
      command: cat /sys/module/kvm_intel/parameters/nested
      register: intel_nested
      changed_when: false
      failed_when: false
      when: kvm_intel_loaded or (ansible_facts.modules is defined and 'kvm_intel' in ansible_facts.modules)

    - name: Verify nested disabled for kvm_amd (if module present)
      command: cat /sys/module/kvm_amd/parameters/nested
      register: amd_nested
      changed_when: false
      failed_when: false
      when: kvm_amd_loaded or (ansible_facts.modules is defined and 'kvm_amd' in ansible_facts.modules)

    - name: Assert that nested is disabled for kvm_intel
      assert:
        that:
          - intel_nested.stdout == 'N'
        fail_msg: "Nested virtualization is still enabled for kvm_intel"
      when: intel_nested is defined

    - name: Assert that nested is disabled for kvm_amd
      assert:
        that:
          - amd_nested.stdout == 'N'
        fail_msg: "Nested virtualization is still enabled for kvm_amd"
      when: amd_nested is defined

  handlers:

    # -----------------------------------------------------------------
    # Handler – reload KVM modules without using a block structure
    # -----------------------------------------------------------------
    - name: reload kvm modules
      become: true
      # The command reloads the modules with the new options.
      # If a module was not previously loaded, modprobe will simply load it.
      command: >
        /bin/sh -c '
        modprobe -r kvm_intel kvm_amd 2>/dev/null || true;
        modprobe kvm_intel 2>/dev/null || true;
        modprobe kvm_amd   2>/dev/null || true'