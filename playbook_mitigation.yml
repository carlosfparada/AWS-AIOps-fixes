# playbook: mitigate_webkitgtk_cve.yml
# Description: Update WebKitGTK to a version that contains the security fix
#              for the out‑of‑bounds write vulnerability.
# Requirements:  - Ansible 2.9+ (comes with RHEL 8/9)
#                - Managed nodes must be registered to RHSM or have the appropriate
#                  Red Hat repositories enabled.
# Usage: ansible-playbook -i inventory mitigate_webkitgtk_cve.yml

- name: Mitigate WebKitGTK out‑of‑bounds write vulnerability
  hosts: rhel   # <-- adjust to your inventory group / host pattern
  become: true
  vars:
    # Package name varies by RHEL major version:
    #   RHEL 7  -> webkitgtk
    #   RHEL 8/9 -> webkitgtk4
    #   (Both provide the same library, choose the one that exists on the host)
    pkg_name_rhel7: webkitgtk
    pkg_name_rhel8: webkitgtk4

    # Minimum version that includes the CVE fix.
    #   You can obtain the exact version from the Red Hat security advisory (RHSA‑xxxx).
    #   Example (replace with the real version numbers):
    min_fixed_version_rhel7: "2.4.10-38.el7"
    min_fixed_version_rhel8: "2.40.5-6.el8"

    # Whether to force a reboot if a library reload is required.
    reboot_if_needed: true

  pre_tasks:
    - name: Gather full facts (required for ansible_distribution_major_version)
      ansible.builtin.setup:
        filter: ansible_distribution*

    - name: Ensure RHSM subscription is attached (RHEL 8/9)
      ansible.builtin.command: subscription-manager status
      register: rhsm_status
      changed_when: false
      failed_when: rhsm_status.rc != 0
      when: ansible_distribution_major_version|int >= 8

    - name: Enable Red Hat repositories that contain security updates
      ansible.builtin.command: |
        subscription-manager repos --enable={{ item }}
      loop:
        - rhel-{{ ansible_distribution_major_version }}-server-rpms
        - rhel-{{ ansible_distribution_major_version }}-server-rhscl-rpms
        - rhel-{{ ansible_distribution_major_version }}-server-extras-rpms
      when: ansible_distribution_major_version|int >= 8
      register: repo_enable
      changed_when: "'Enabling' in repo_enable.stdout"
      # ignore errors on already‑enabled repos
      ignore_errors: true

  tasks:
    - name: Determine correct package name for this host
      ansible.builtin.set_fact:
        webkitgtk_pkg_name: >-
          {% if ansible_distribution_major_version|int == 7 %}
            {{ pkg_name_rhel7 }}
          {% else %}
            {{ pkg_name_rhel8 }}
          {% endif %}
        webkitgtk_min_version: >-
          {% if ansible_distribution_major_version|int == 7 %}
            {{ min_fixed_version_rhel7 }}
          {% else %}
            {{ min_fixed_version_rhel8 }}
          {% endif %}

    - name: Install or update WebKitGTK to the latest available version
      ansible.builtin.package:
        name: "{{ webkitgtk_pkg_name }}"
        state: latest
        use: "{{ 'dnf' if ansible_distribution_major_version|int >= 8 else 'yum' }}"
      register: webkit_install

    - name: Verify installed WebKitGTK version meets minimum fixed version
      ansible.builtin.command: rpm -q --qf '%{VERSION}-%{RELEASE}\n' {{ webkitgtk_pkg_name }}
      register: installed_version
      changed_when: false

    - name: Fail if installed version is older than the minimum fixed version
      ansible.builtin.assert:
        that:
          - installed_version.stdout is version(webkitgtk_min_version, '>=')
        fail_msg: |
          The installed {{ webkitgtk_pkg_name }} version ({{ installed_version.stdout }})
          is older than the security‑fixed version {{ webkitgtk_min_version }}.
          Manual intervention may be required.
        success_msg: |
          {{ webkitgtk_pkg_name }} version {{ installed_version.stdout }} meets the
          required minimum {{ webkitgtk_min_version }}.

    - name: List services that might need a restart because they link to WebKitGTK
      ansible.builtin.shell: |
        systemctl list-units --type=service --state=running |
        grep -iE 'epiphany|gnome|webkit' || true
      register: services_to_restart
      changed_when: false

    - name: Restart affected services (if any)
      ansible.builtin.service:
        name: "{{ item.split()[0] }}"
        state: restarted
      loop: "{{ services_to_restart.stdout_lines }}"
      when: services_to_restart.stdout != ''
      notify:
        - Print service restart summary

    - name: Check if a reboot is required (yum/dnf plugin)
      ansible.builtin.command: |
        {{ 'dnf' if ansible_distribution_major_version|int >= 8 else 'yum' }} needs-restarting -r
      register: reboot_needed
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: Reboot the host if required and allowed
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami
      when:
        - reboot_if_needed | bool
        - reboot_needed.rc == 0   # 0 => restart required
        - webkit_install.changed   # only reboot if we actually updated the package

  handlers:
    - name: Print service restart summary
      ansible.builtin.debug:
        msg: |
          The following services were restarted because they link against {{ webkitgtk_pkg_name }}:
          {{ services_to_restart.stdout_lines | default([]) }}