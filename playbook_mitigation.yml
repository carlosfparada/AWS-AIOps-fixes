---
# --------------------------------------------------------------
#  CVE‑2026‑31431 – “Copy Fail” mitigation for RHEL
#  (kernel init‑call blacklist)
#
#  No package updates, backups or validation steps are performed.
# --------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on RHEL systems
  hosts: "ec2-34-228-227-78.compute-1.amazonaws.com,ec2-54-90-135-180.compute-1.amazonaws.com"
  become: true                # needed to edit /etc/default/grub and reboot
  gather_facts: true

  # ----------------------------------------------------------------
  # Run the tasks only when the target OS is Red Hat Enterprise Linux
  # ----------------------------------------------------------------
  vars:
    # Choose ONE of the three possible black‑list entries described in the
    # Red Hat advisory.  The default here disables the algif_aead init‑call.
    cve_2026_31431_blacklist: "algif_aead_init"
    # If additional kernel parameters are already present they will be
    # preserved – we only ensure our blacklist entry exists.
    grub_cfg: "/etc/default/grub"
    grub_cfg_cmdline: "GRUB_CMDLINE_LINUX"

  tasks:

    - name: Verify we are on RHEL
      assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] == "RedHat"
        msg: "Host {{ inventory_hostname }} is not a RHEL system – skipping."
      when: ansible_facts['os_family'] != "RedHat" or ansible_facts['distribution'] != "RedHat"

    # ------------------------------------------------------------
    # Ensure the initcall blacklist entry is present in the GRUB
    # command line.  If the line already exists we simply append the
    # missing entry; otherwise we add a new line.
    # ------------------------------------------------------------
    - name: Read current GRUB_CMDLINE_LINUX line
      slurp:
        src: "{{ grub_cfg }}"
      register: grub_file_raw
      changed_when: false

    - name: Decode GRUB file content
      set_fact:
        grub_file_content: "{{ grub_file_raw.content | b64decode }}"

    - name: Extract existing kernel cmdline (if any)
      set_fact:
        existing_cmdline: >-
          {{ (grub_file_content | regex_search('^' + grub_cfg_cmdline + '="([^"]*)"', '\\1')) | default('') }}

    - name: Build new kernel cmdline (preserve existing options)
      set_fact:
        new_cmdline: >-
          {{ existing_cmdline | regex_replace('(^|\\s)initcall_blacklist=[^\\s]*', '') }}
          initcall_blacklist={{ cve_2026_31431_blacklist }}

    - name: Collapse multiple spaces in new cmdline
      set_fact:
        new_cmdline: "{{ new_cmdline | regex_replace('\\s+', ' ') | trim }}"

    - name: Update GRUB_CMDLINE_LINUX in {{ grub_cfg }}
      lineinfile:
        path: "{{ grub_cfg }}"
        regexp: '^{{ grub_cfg_cmdline }}='
        line: '{{ grub_cfg_cmdline }}="{{ new_cmdline }}"'
        insertafter: EOF
        create: true
      notify:
        - Rebuild GRUB config
        - Reboot host

  handlers:

    - name: Rebuild GRUB config (BIOS)
      command: >-
        grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_facts['ansible_devices'] is defined   # simple guard

    - name: Rebuild GRUB config (UEFI)
      command: >-
        grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      when: ansible_facts['ansible_mounts'] | selectattr('mount', 'equalto', '/boot/efi') | list | length > 0

    - name: Reboot host
      reboot:
        reboot_timeout: 3600
        test_command: whoami