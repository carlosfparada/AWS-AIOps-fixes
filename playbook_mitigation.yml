---
- name: Mitigate WebKitGTK CVE (out-of-bounds write)
  hosts: all
  become: true
  vars:
    webkit_packages:
      Debian:
        name: libwebkit2gtk-4.0-37
        service: gnome-shell
      RedHat:
        name: webkitgtk4
        service: gnome-shell
      Fedora:
        name: webkit2gtk3
        service: gnome-shell
  tasks:
    - name: Determine platform specific package and service
      set_fact:
        pkg_name: "{{ webkit_packages[ansible_os_family].name | default('') }}"
        svc_name: "{{ webkit_packages[ansible_os_family].service | default('') }}"

    - name: Ensure WebKitGTK package is present and up‑to‑date (Debian/Ubuntu)
      apt:
        name: "{{ pkg_name }}"
        state: latest
        update_cache: yes
      when: ansible_os_family == "Debian" and pkg_name != ''
      notify: Restart affected service

    - name: Ensure WebKitGTK package is present and up‑to‑date (RedHat/CentOS)
      yum:
        name: "{{ pkg_name }}"
        state: latest
      when: ansible_os_family == "RedHat" and pkg_name != ''
      notify: Restart affected service

    - name: Ensure WebKitGTK package is present and up‑to‑date (Fedora)
      dnf:
        name: "{{ pkg_name }}"
        state: latest
      when: ansible_distribution == "Fedora" and pkg_name != ''
      notify: Restart affected service

  handlers:
    - name: Restart affected service
      service:
        name: "{{ svc_name }}"
        state: restarted
        enabled: yes
      when: svc_name != ''