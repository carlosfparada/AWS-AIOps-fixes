# description:A flaw was found in the Linux kernel's
# algif_aead cryptographic algorithm interface. An incorrect
# in-place operation causes source and destination data
# mappings to differ during cryptographic processing. A low-
# privileged local attacker can exploit this flaw to corrupt
# the contents of sensitive system files and escalate to root
# privileges.
# summary:kernel: crypto: algif_aead - Revert to operating
# out-of-place
# other:This issue is classified as Important, rather than
# Critical severity, because exploitation requires local
# access to the system. A low-privileged local attacker can
# exploit this flaw in the Linux kernel's cryptographic
# interface to gain root privileges by overwriting sensitive
# system files. Exploitation does not require user
# interaction, potentially resulting in full compromise of
# confidentiality, integrity, and availability.
# general:The CVSS score(s) listed for this vulnerability do
# not reflect the associated product's status, and are
# included for informational purposes to better understand the
# severity of this vulnerability.
