# ------------------------------------------------------------
# Playbook : mitigate-cve-2026-53359.yml
# Target   : rhel group
# Purpose  : Install a kernel version that contains the fix for
#            CVE‑2026‑53359 (KVM x86 shadow‑paging use‑after‑free)
#            and reboot the host if a kernel upgrade occurs.
# ------------------------------------------------------------

- name: Mitigate CVE-2026-53359 on RHEL hosts
  hosts: rhel                      # the inventory group containing the RHEL systems
  become: true                     # required to manage packages and reboot
  gather_facts: true               # needed to report the current kernel version

  vars:
    # Optional – record the minimum kernel version that includes the fix.
    # Update this value when a newer fix is released.
    fixed_kernel_version: "5.14.0-281.el9"

  tasks:

    - name: Ensure the latest kernel package is installed
      # The `package` module is abstract; on RHEL it uses yum/dnf under the hood.
      package:
        name: kernel
        state: latest
      register: kernel_pkg

    - name: Verify that the running kernel meets the minimum version
      # This check fails the play if the host is still on a vulnerable kernel.
      # It runs *after* the install step so a fresh reboot is still required.
      assert:
        that:
          - ansible_facts.kernel is version(fixed_kernel_version, '>=')
        fail_msg: >
          The running kernel ({{ ansible_facts.kernel }}) is older than the
          required version ({{ fixed_kernel_version }).  Reboot or manually
          select a newer kernel to close CVE‑2026‑53359.
        success_msg: >
          Kernel version ({{ ansible_facts.kernel }}) satisfies the CVE‑2026‑53359
          mitigation requirement.

    - name: Reboot the machine if the kernel package was upgraded
      reboot:
        reboot_timeout: 600      # seconds to wait for the system to come back
        test_command: whoami     # simple command to verify host is up
      when: kernel_pkg.changed
      tags: reboot

# ------------------------------------------------------------
# End of playbook
# ------------------------------------------------------------