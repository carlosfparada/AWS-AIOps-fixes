---
# playbook: mitigate_cve_2026_31431.yml
# Description:
#   CVE‑2026‑31431 – A flaw in the Linux kernel's algif_aead
#   cryptographic‑algorithm interface could allow a low‑privileged local
#   attacker to corrupt sensitive files and gain root.  The recommended
#   mitigation for RHEL systems is to install a kernel that contains the fix
#   (kernel ≥ 5.14.0‑213.el9 or later, depending on the RHEL release) and
#   reboot into the updated kernel.
#
# This minimal playbook updates the kernel package on all hosts in the
# "rhel" inventory group and reboots the machine if a newer kernel was
# installed.

- name: Mitigate CVE‑2026‑31431 on RHEL hosts
  hosts: rhel
  become: true
  vars:
    # Adjust this to the minimum kernel version that contains the fix for
    # the target RHEL release.  Leaving it empty will simply install the
    # latest kernel available in the enabled repos.
    kernel_min_version: ""

  tasks:

    - name: Install the latest kernel package (or the required minimum version)
      ansible.builtin.yum:
        name: "{{ 'kernel-' + kernel_min_version if kernel_min_version else 'kernel' }}"
        state: latest
        # Use dnf on newer RHEL versions (the yum module works as a wrapper)
        # enablerepo: "base,updates"   # uncomment if you need to limit repos
      register: kernel_update

    - name: Gather the currently running kernel version
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false
      check_mode: false

    - name: Determine the version of the newly installed kernel (if any)
      ansible.builtin.command: rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel
      register: newest_kernel
      changed_when: false
      check_mode: false
      when: kernel_update.changed

    - name: Reboot the host if a newer kernel was installed
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: /usr/bin/true
      when: kernel_update.changed

    - name: Verify the system is now running the updated kernel
      ansible.builtin.command: uname -r
      register: post_reboot_kernel
      changed_when: false
      check_mode: false
      when: kernel_update.changed

    - name: Fail if the running kernel is still the old version
      ansible.builtin.fail:
        msg: |
          The host rebooted but is still running the old kernel.
          Expected: {{ newest_kernel.stdout }}
          Got: {{ post_reboot_kernel.stdout }}
      when:
        - kernel_update.changed
        - post_reboot_kernel.stdout != newest_kernel.stdout