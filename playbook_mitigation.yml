# --------------------------------------------------------------
# Playbook:  mitigate_cve_2026_31431.yml
# Target:    RHEL systems only
# CVE:       CVE‑2026‑31431 – crypto/algif_aead in‑place flaw
# --------------------------------------------------------------

- name: "Mitigate CVE‑2026‑31431 on RHEL hosts"
  hosts: "ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-228-227-78.compute-1.amazonaws.com"
  become: true
  gather_facts: true

  # ----------------------------------------------------------------
  # Run the whole play only when the OS is Red Hat Enterprise Linux.
  # ----------------------------------------------------------------
  pre_tasks:
    - name: "Fail fast if the target is not RHEL"
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "RedHat"
        fail_msg: "This mitigation playbook is intended for RHEL only."
        success_msg: "Target OS is RHEL – proceeding with mitigation."

    - name: "Collect current SELinux mode"
      ansible.builtin.command: getenforce
      register: selinux_mode
      changed_when: false

    - name: "Warn if SELinux is not Enforcing"
      ansible.builtin.debug:
        msg: "SELinux is currently {{ selinux_mode.stdout }}. The play will enforce it."
      when: selinux_mode.stdout != "Enforcing"

  # ----------------------------------------------------------------
  # 1. Disable the vulnerable kernel module (algif_aead) via modprobe
  # ----------------------------------------------------------------
  tasks:
    - name: "Create modprobe config to block algif_aead"
      ansible.builtin.copy:
        dest: /etc/modprobe.d/disable-algif_aead.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CVE‑2026‑31431 mitigation – block algif_aead
          # The module is not needed for typical server workloads.
          # Using /bin/true makes any load request a no‑op.
          install algif_aead /bin/true
      notify: "Recreate initramfs (if needed)"

    - name: "Ensure the module is not already loaded"
      ansible.builtin.shell: |
        if lsmod | grep -q '^algif_aead'; then
          modprobe -r algif_aead
        fi
      args:
        warn: false
      register: unload_result
      changed_when: unload_result.rc == 0

  # ---------------------------------------------------------------
  # 2. Harden kernel command‑line to make the module unusable early
  # ---------------------------------------------------------------
    - name: "Add kernel command‑line hardening (disable algif_aead via module_blacklist)"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: >-
          GRUB_CMDLINE_LINUX="{{ ansible_facts['cmdline'] | default('') }}
          module_blacklist=algif_aead"
        backrefs: yes
        state: present
      notify: "Regenerate GRUB configuration"

  # ---------------------------------------------------------------
  # 3. Enforce SELinux in Enforcing mode (recommended hardening)
  # ---------------------------------------------------------------
    - name: "Set SELinux to Enforcing permanently"
      ansible.builtin.selinux:
        policy: targeted
        state: enforcing

  # ---------------------------------------------------------------
  # 4. Apply a restrictive crypto policy (drops undocumented algos)
  # ---------------------------------------------------------------
    - name: "Set system-wide crypto policy to DEFAULT (or FIPS if required)"
      ansible.builtin.command: update-crypto-policies --set DEFAULT
      args:
        creates: /etc/crypto-policies/back-ends
      register: crypto_policy
      changed_when: "'DEFAULT' in crypto_policy.stdout"

  # ---------------------------------------------------------------
  # 5. Verify the mitigation
  # ---------------------------------------------------------------
    - name: "Confirm algif_aead cannot be loaded"
      ansible.builtin.command: modprobe -n -v algif_aead
      register: modprobe_check
      changed_when: false
      failed_when: "'install /bin/true' not in modprobe_check.stdout"

    - name: "Display final SELinux state"
      ansible.builtin.command: getenforce
      register: final_selinux
      changed_when: false

    - name: "Report mitigation status"
      ansible.builtin.debug:
        msg: |
          Mitigation steps applied:
            * algif_aead module blocked via /etc/modprobe.d
            * Kernel cmdline augmented with module_blacklist=algif_aead
            * SELinux forced to Enforcing
            * System crypto policy set to DEFAULT
          Final SELinux mode: {{ final_selinux.stdout }}

  # ----------------------------------------------------------------
  # Handlers – actions that need a reboot or grub regeneration
  # ----------------------------------------------------------------
  handlers:
    - name: "Regenerate GRUB configuration"
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_facts['distribution_version'] is version('7', '<')
      # For RHEL 8/9 the path is /boot/efi/EFI/redhat/grub.cfg
      # the command works for both BIOS and UEFI installations.
      notify: "Reboot the node (optional but recommended)"

    - name: "Recreate initramfs (if needed)"
      ansible.builtin.command: dracut -f
      when: ansible_facts['distribution_version'] is version('7', '>=') or
            ansible_facts['distribution_version'] is version('8', '>=') or
            ansible_facts['distribution_version'] is version('9', '>=') 

    - name: "Reboot the node (optional but recommended)"
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: "Rebooting to apply kernel cmdline changes for CVE‑2026‑31431 mitigation."
      when: false   # set to true if you want Ansible to force a reboot automatically