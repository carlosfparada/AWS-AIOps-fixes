# ------------------------------------------------------------
# CVE‑2026‑31431 mitigation – kernel‑parameter (RHEL only)
# ------------------------------------------------------------
# Target hosts (as requested):
#   ec2-54-90-135-180.compute-1.amazonaws.com,
#   ec2-34-228-227-78.compute-1.amazonaws.com
#
# Variables (can be overridden on the command line or in host_vars):
#   cve_2026_31431_reboot: true   # set to false if you do not want an automatic reboot
# ------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on RHEL hosts
  hosts: >
    ec2-54-90-135-180.compute-1.amazonaws.com,
    ec2-34-228-227-78.compute-1.amazonaws.com
  become: true
  gather_facts: true

  vars:
    # ------------------------------------------------------------------
    # Set to false if you prefer to reboot manually after the playbook runs.
    # ------------------------------------------------------------------
    cve_2026_31431_reboot: true

    # GRUB file locations – they differ between RHEL 7 and RHEL 8/9.
    grub_cfg_path: |
      {% if ansible_facts['distribution_major_version']|int < 8 %}
        /etc/default/grub
      {% else %}
        /etc/default/grub
      {% endif %}
    grub_cfg_backup: "/etc/default/grub.cve-2026-31431.bak"

    # Kernel boot‑parameter we want to enforce
    kernel_param: "algif_aead.inplace=0"

  pre_tasks:
    - name: Ensure the target OS is RedHat (RHEL)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: "This playbook is intended for RHEL only. Detected {{ ansible_facts['distribution'] }}."
      tags: always

    - name: Verify that we are running a kernel version that understands algif_aead.inplace
      ansible.builtin.command: |
        grep -q "algif_aead.inplace" /proc/commands
      register: kernel_param_check
      ignore_errors: true
      changed_when: false
      tags: always

    - name: Debug – show current kernel command line (optional)
      ansible.builtin.command: cat /proc/cmdline
      register: current_cmdline
      changed_when: false
      tags: never
    - name: Show current kernel cmdline
      ansible.builtin.debug:
        msg: "Current kernel cmdline: {{ current_cmdline.stdout }}"
      tags: never

  tasks:
    - name: Backup existing GRUB configuration (if not already backed up)
      ansible.builtin.copy:
        src: "{{ grub_cfg_path }}"
        dest: "{{ grub_cfg_backup }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        force: false   # only create the backup once
      tags: grub

    - name: Read current GRUB config into a variable
      ansible.builtin.slurp:
        src: "{{ grub_cfg_path }}"
      register: grub_cfg_raw
      tags: grub

    - name: Decode GRUB config file contents
      ansible.builtin.set_fact:
        grub_cfg_content: "{{ grub_cfg_raw.content | b64decode }}"
      tags: grub

    - name: Ensure the kernel boot‑parameter is present in GRUB_CMDLINE_LINUX
      ansible.builtin.lineinfile:
        path: "{{ grub_cfg_path }}"
        regexp: '^GRUB_CMDLINE_LINUX="([^"]*)"$'
        line: >-
          GRUB_CMDLINE_LINUX="{{ '\\1' | regex_replace('(^|\\s){{ kernel_param }}(\\s|$)', '\\1') }} {{ kernel_param }}"
        backrefs: yes
        state: present
        insertafter: '^GRUB_CMDLINE_LINUX='
        create: yes
        mode: '0644'
      notify: Regenerate GRUB config
      tags: grub

    - name: Ensure the kernel boot‑parameter is also present in GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.lineinfile:
        path: "{{ grub_cfg_path }}"
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="([^"]*)"$'
        line: >-
          GRUB_CMDLINE_LINUX_DEFAULT="{{ '\\1' | regex_replace('(^|\\s){{ kernel_param }}(\\s|$)', '\\1') }} {{ kernel_param }}"
        backrefs: yes
        state: present
        insertafter: '^GRUB_CMDLINE_LINUX_DEFAULT='
        create: yes
        mode: '0644'
      notify: Regenerate GRUB config
      tags: grub

    - name: Verify that the kernel parameter was added correctly
      ansible.builtin.command: grep -E "{{ kernel_param }}" "{{ grub_cfg_path }}"
      register: verify_param
      changed_when: false
      tags: verify

    - name: Show verification result (debug)
      ansible.builtin.debug:
        msg: "GRUB file now contains the required kernel parameter."
      when: verify_param.rc == 0
      tags: verify

    - name: Optionally reboot the host to apply new kernel command line
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 10
        post_reboot_delay: 30
        test_command: whoami
      when: cve_2026_31431_reboot | bool
      tags: reboot

  handlers:
    - name: Regenerate GRUB config
      ansible.builtin.command: >
        {% if ansible_facts['distribution_major_version']|int < 8 %}
          grub2-mkconfig -o /boot/grub2/grub.cfg
        {% else %}
          grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
        {% endif %}
      become: true
      notify:
        - Verify GRUB regeneration

    - name: Verify GRUB regeneration
      ansible.builtin.command: |
        {% if ansible_facts['distribution_major_version']|int < 8 %}
          grub2-probe --target=fs /boot
        {% else %}
          grub2-probe --target=fs /boot/efi
        {% endif %}
      changed_when: false
      become: true