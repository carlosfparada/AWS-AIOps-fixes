# Minimalist Ansible playbook to protect RHEL hosts from CVE‑2026‑53359
# (KVM x86 shadow‑paging use‑after‑free vulnerability)

- name: Harden RHEL KVM hosts
  hosts: rhel
  become: true               # required for package management & reboot
  vars:
    # Reference package name for the kernel on RHEL
    kernel_pkg: kernel
    # Minimum kernel version that contains the fix (example – adjust to your repo)
    # 9.2.0-1.el9.x86_64 (RHEL 9) and newer include the patch.
    min_fixed_version: "9.2.0-1.el9"

  tasks:

    - name: Gather current kernel version
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: Ensure the latest kernel package is installed
      ansible.builtin.yum:
        name: "{{ kernel_pkg }}"
        state: latest
      register: yum_result

    - name: Check if a reboot is required (new kernel installed or older kernel running)
      ansible.builtin.set_fact:
        reboot_needed: >-
          {{ (yum_result.changed) or
             (current_kernel.stdout is version(min_fixed_version, '<')) }}

    - name: Reboot the host if a newer, patched kernel is needed
      ansible.builtin.reboot:
        msg: "Rebooting to apply patched kernel for CVE‑2026‑53359 mitigation"
        reboot_timeout: 600
      when: reboot_needed
      async: 0
      poll: 0

    - name: Verify that the running kernel is now patched
      ansible.builtin.command: uname -r
      register: post_reboot_kernel
      changed_when: false
      when: reboot_needed

    - name: Fail if the kernel is still vulnerable after reboot
      ansible.builtin.fail:
        msg: |
          The host is still running an unpatched kernel ({{ post_reboot_kernel.stdout }}).
          Ensure the kernel package provides at least version {{ min_fixed_version }}.
      when:
        - reboot_needed
        - post_reboot_kernel.stdout is version(min_fixed_version, '<')