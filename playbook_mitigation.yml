# File: mitigate-cve-2026-53359.yml
# Purpose: Install the patched RHEL kernel that fixes the KVM x86 shadow‑paging
#          vulnerability (CVE‑2026‑53359) and reboot if a newer kernel was
#          installed.
# Target: hosts in the inventory group "rhel"
# --------------------------------------------------------------

- name: Mitigate CVE‑2026‑53359 (KVM shadow‑paging use‑after‑free)
  hosts: rhel
  become: true            # needed for package management & reboot
  gather_facts: true

  vars:
    # Red‑Hat Advisory (example): RHSA‑2026:xxxx – kernel‑{version}
    # Adjust the package name if you run a different RHEL stream (e.g. AppStream).
    kernel_pkg: kernel

  tasks:

    - name: Install the latest kernel from the enabled repos
      ansible.builtin.package:
        name: "{{ kernel_pkg }}"
        state: latest
      register: kernel_update
      # The package module works with yum, dnf and microdnf on all RHEL versions.

    - name: Ensure the latest kernel is set as the default boot entry
      ansible.builtin.command: |
        grub2-set-default 0
      when: kernel_update.changed
      # In RHEL 9+ grub2-set-default 0 points to the first (newest) entry.
      # No restart of the bootloader is required; just a reboot later.

    - name: Reboot the host if a new kernel was installed
      ansible.builtin.reboot:
        reboot_timeout: 600          # seconds to wait for the node to come back
        post_reboot_delay: 30        # give services a bit of time to start
        test_command: uptime         # simple check that the host is up
      when: kernel_update.changed
      # The reboot will only happen when the kernel package was upgraded,
      # avoiding unnecessary restarts.

    - name: Verify that the running kernel contains the fix
      ansible.builtin.shell: |
        uname -r
      register: running_kernel
      changed_when: false

    - name: Display the kernel version after remediation
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} is now running kernel {{ running_kernel.stdout }}"

