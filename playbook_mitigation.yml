# -------------------------------------------------
# Playbook: cve-2026-31431-mitigate.yml
# Purpose: Install a kernel that contains the fix for CVE‑2026‑31431
# Targets: ec2-3-84-172-241.compute-1.amazonaws.com,
#          ec2-3-88-254-183.compute-1.amazonaws.com
# -------------------------------------------------

- name: Mitigate CVE‑2026‑31431 (algif_aead in‑place bug)
  hosts: patched_cve_2026_31431
  become: true                     # required for package & reboot actions
  gather_facts: true

  vars:
    # -----------------------------------------------------------------
    #   Minimum kernel version that contains the fix.
    #   The exact version depends on the distro; the examples below
    #   are for RHEL‑9 / Rocky‑9 / AlmaLinux‑9 / Amazon Linux 2.
    #   Adjust to the version listed in the Red Hat security bulletin
    #   (or the distro’s changelog) when the fix is released.
    # -----------------------------------------------------------------
    # For RHEL‑9 based families (kernel‑9.x.x‑xxx.el9)
    cve_fixed_kernel_rhel: "6.8.0-2026.0.0.el9"

    # For Amazon Linux 2 (kernel‑4.x.x‑xxx.amzn2.x86_64)
    cve_fixed_kernel_amzn2: "4.14.307-215.529.amzn2.x86_64"

    # Choose the appropriate pattern for your OS; the tasks below will
    # automatically pick the right one based on the `ansible_distribution`
    # fact.
    cve_fixed_kernel: >-
      {% if ansible_distribution == 'RedHat' or ansible_distribution == 'Rocky' or ansible_distribution == 'AlmaLinux' %}
        {{ cve_fixed_kernel_rhel }}
      {% elif ansible_distribution == 'Amazon' %}
        {{ cve_fixed_kernel_amzn2 }}
      {% else %}
        ""   # Unknown distro – fail later with a clear message
      {% endif %}

  pre_tasks:
    - name: Verify that the host distribution is supported
      fail:
        msg: >-
          The host {{ inventory_hostname }} is running an unsupported distribution
          ({{ ansible_distribution }}). Please adapt the playbook to your distro.
      when: cve_fixed_kernel == ""

  tasks:

    - name: Refresh the package manager cache (yum/dnf)
      ansible.builtin.yum:
        update_cache: yes
      when: ansible_pkg_mgr in ['yum', 'dnf']

    - name: Install the latest kernel package
      ansible.builtin.package:
        name: kernel
        state: latest
      register: kernel_install
      notify: Reboot if kernel changed

    - name: Record the kernel version currently running
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: Print current running kernel (pre‑reboot)
      ansible.builtin.debug:
        msg: "Running kernel on {{ inventory_hostname }} before update: {{ current_kernel.stdout }}"

    - name: Ensure that the installed kernel is newer than the vulnerable version
      ansible.builtin.assert:
        that:
          - "'{{ cve_fixed_kernel }}' in kernel_install.results[0].stdout or kernel_install.results[0].changed"
        fail_msg: >-
          The installed kernel does not appear to contain the fix for CVE‑2026‑31431.
          Expected a kernel version matching {{ cve_fixed_kernel }}.
        success_msg: >-
          Kernel package installed/updated – will verify after reboot.

  handlers:
    - name: Reboot if kernel changed
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami
      when: kernel_install.changed

  post_tasks:
    - name: Wait for the node to become reachable again (max 5 min)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather the kernel version after reboot
      ansible.builtin.command: uname -r
      register: new_kernel
      changed_when: false

    - name: Verify that the new kernel meets or exceeds the fixed version
      ansible.builtin.assert:
        that:
          - new_kernel.stdout is version(cve_fixed_kernel, '>=')
        fail_msg: >-
          After reboot the kernel version {{ new_kernel.stdout }} is still
          older than the required fixed version {{ cve_fixed_kernel }}.
        success_msg: >-
          Host {{ inventory_hostname }} is now running kernel {{ new_kernel.stdout }},
          which satisfies the CVE‑2026‑31431 mitigation requirement.

    - name: Show final kernel version
      ansible.builtin.debug:
        msg: "Final running kernel on {{ inventory_hostname }}: {{ new_kernel.stdout }}"

