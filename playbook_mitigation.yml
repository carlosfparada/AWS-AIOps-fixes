####### REASONING #######
# We need to write an Ansible playbook targeting RHEL hosts to
# mitigate CVE-2025-24201, concerning WebKitGTK out-of-bounds
# write. The mitigation likely is to update the vulnerable
# package (webkitgtk) to a fixed version, or apply patches, or
# configure system to block. Provide playbook with tasks:
# gather facts, check RHEL version, use yum/dnf module to
# ensure package is latest or at least version >= fixed.
# Possibly use the security advisory.
#
# We should also provide variables, handlers, tags.
#
# The answer: Provide a YAML playbook, explanation, maybe a
# role.
#
# Let's produce.
#######
---
# ------------------------------------------------------------
# Ansible Playbook – Mitigate CVE‑2025‑24201 on RHEL hosts
# ------------------------------------------------------------
# Author:  <your‑name>
# Date:    2026‑07‑10
# Version: 1.0
# ------------------------------------------------------------
# Requirements
# ------------
# • Ansible 2.14+ (uses community.general.version_compare)
# • Managed nodes must have access to Red Hat subscription repos
#   (RHSM or satellite) that contain the security advisory.
# • If you use a proxy for yum/dnf, ensure it is reachable from the
#   managed host before running this playbook.
# ------------------------------------------------------------

- name: "Mitigate CVE‑2025‑24201 – WebKitGTK out‑of‑bounds write"
  hosts: all                      # limit with ‑‑limit or an inventory group, e.g. rhel
  become: true
  gather_facts: true

  vars:
    # ------------------------------------------------------------------
    # Fixed package versions per RHEL major release.
    # These values are taken from the Red Hat Security Advisory that
    # patches CVE‑2025‑24201 (RHSA‑2025:xxxx).  Update them whenever a
    # newer patch level is released.
    # ------------------------------------------------------------------
    webkitgtk_fixed_versions:
      "7":  "2.36.5-1.el7_9"          # Example – check the advisory for exact values
      "8":  "2.42.9-2.el8_9"
      "9":  "2.44.5-1.el9_4"

    # Packages that ship WebKitGTK on RHEL.  Some releases split the
    # libraries into separate packages (e.g. webkit2gtk3, webkit2gtk4).
    webkitgtk_packages:
      - webkit2gtk3
      - webkit2gtk4
      - webkit2gtk4-devel
      - webkit2gtk4-doc
      - webkit2gtk3-devel
      - webkit2gtk3-doc

    # Services that typically load WebKitGTK libraries.
    # Adjust to your environment – empty list if you do not need restarts.
    services_to_restart:
      - gdm
      - httpd
      - nginx
      - firefox
      - gnome-shell

  pre_tasks:
    - name: "Validate that the managed host is a RHEL family OS"
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: "This playbook only supports RedHat‑family (RHEL) systems."
        success_msg: "RHEL host detected ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})."

    - name: "Determine RHEL major version"
      ansible.builtin.set_fact:
        rhel_major: "{{ ansible_facts['distribution_major_version'] }}"

    - name: "Fail if we do not have a known fixed version for this RHEL major release"
      ansible.builtin.assert:
        that:
          - webkitgtk_fixed_versions[rhel_major] is defined
        fail_msg: "No fixed version data for RHEL {{ rhel_major }} – please update the playbook."
        success_msg: "Fixed version for RHEL {{ rhel_major }} is {{ webkitgtk_fixed_versions[rhel_major] }}."

    - name: "Gather current installed WebKitGTK package versions"
      ansible.builtin.package_facts:
        manager: auto

    - name: "Create a list of installed WebKitGTK packages with their current versions"
      ansible.builtin.set_fact:
        installed_webkitgtk:
          "{{ webkitgtk_packages |
              select('in', ansible_facts.packages) |
              map('extract', ansible_facts.packages) |
              map('first') |
              community.general.json_query('[].version') |
              list }}"

  tasks:
    - name: "Check if any installed WebKitGTK package is older than the fixed version"
      vars:
        fixed_version: "{{ webkitgtk_fixed_versions[rhel_major] }}"
      community.general.version_compare:
        version: "{{ item }}"
        compare: "<"
        match: "*"
        desired_version: "{{ fixed_version }}"
      when: item is defined
      register: version_check
      loop: "{{ installed_webkitgtk }}"
      loop_control:
        label: "{{ item | default('N/A') }}"

    - name: "Set fact – is_update_needed (true if any package is older)"
      ansible.builtin.set_fact:
        is_update_needed: "{{ version_check.results | selectattr('changed', 'equalto', true) | list | length > 0 }}"

    - name: "Debug – show which packages need upgrading (optional)"
      ansible.builtin.debug:
        msg: |
          Packages that need upgrade:
          {% for result in version_check.results if result.changed %}
            - {{ result.item }} (installed < {{ webkitgtk_fixed_versions[rhel_major] }})
          {% else %}
            - None – all installed packages are already at or above the fixed version.
          {% endfor %}
      when: is_update_needed

    - name: "Upgrade WebKitGTK packages to the fixed version (RHEL {{ rhel_major }})"
      ansible.builtin.yum:
        name: "{{ webkitgtk_packages }}"
        state: latest            # we rely on the repo to provide the fixed version
        update_cache: yes
        lock_timeout: 300
      when: is_update_needed
      register: yum_update

    - name: "Capture update result in a summary fact"
      ansible.builtin.set_fact:
        cve_2025_24201_status: >-
          {% if is_update_needed %}
          patched ({{ yum_update.changes | length }} packages updated)
          {% else %}
          already up‑to‑date
          {% endif %}

    - name: "Restart services that depend on WebKitGTK (if any were updated)"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        daemon_reload: yes
      loop: "{{ services_to_restart }}"
      when:
        - is_update_needed
        - ansible_facts.services[item] is defined   # skip if service not present
      ignore_errors: true       # not all systems have every service; ignore failures

  post_tasks:
    - name: "Print a final compliance summary"
      ansible.builtin.debug:
        msg: |
          --------------------------------------------------------
          CVE‑2025‑24201 mitigation status for host {{ inventory_hostname }}:
          • RHEL major version      : {{ rhel_major }}
          • Fixed package version   : {{ webkitgtk_fixed_versions[rhel_major] }}
          • Update needed?          : {{ is_update_needed }}
          • Final status (fact)     : {{ cve_2025_24201_status }}
          --------------------------------------------------------

    - name: "Fail the play if the host is still vulnerable"
      ansible.builtin.assert:
        that:
          - not is_update_needed
        fail_msg: |
          **WARNING** – Host {{ inventory_hostname }} still has vulnerable WebKitGTK packages.
          Please investigate repository access, subscription status, or version data.
        success_msg: "All managed hosts are now patched for CVE‑2025‑24201."

# ------------------------------------------------------------
# END OF PLAYBOOK
# ------------------------------------------------------------