####### REASONING #######
# We need to respond with an Ansible playbook targeting RHEL
# hosts to mitigate the CVE described. Likely the mitigation
# is to update the WebKitGTK package to a fixed version,
# possibly install security updates, ensure the repo is
# enabled, and maybe restart services. Provide playbook with
# tasks: gather facts, ensure latest security packages, maybe
# use dnf module to install specific version. Also include
# checking the CVE ID if known (maybe CVE-2023-XXXXX). Since
# not provided, we can describe generic mitigation. Provide
# comments, handlers, variables. Also include checking if
# package is installed, backup configuration, etc. Also
# optionally apply SELinux or sandbox. Provide an example with
# variable for package version. Provide a playbook in YAML.
#
# We'll comply.
#######
---
- name: Mitigate WebKitGTK out‑of‑bounds write vulnerability (CVE‑???)
  hosts: rhel
  become: true
  gather_facts: true
  vars:
    # --------------------------------------------------------------
    # 1️⃣  Package name(s) – adjust if your distro uses a different name
    # --------------------------------------------------------------
    webkit_pkg_rhel7: "webkitgtk3"
    webkit_pkg_rhel8: "webkit2gtk3"
    webkit_pkg_rhel9: "webkit2gtk3"

    # --------------------------------------------------------------
    # 2️⃣  Minimum safe version – replace with the version that contains the fix.
    #     You can look it up on the Red Hat Errata page for the CVE.
    # --------------------------------------------------------------
    safe_version_rhel7: "2.4.11-9.el7"
    safe_version_rhel8: "2.40.5-1.el8"
    safe_version_rhel9: "2.40.5-6.el9"

    # --------------------------------------------------------------
    # 3️⃣  Services that may need a restart after the library upgrade.
    # --------------------------------------------------------------
    services_to_restart:
      - httpd
      - cockpit
      - gnome-shell
      - gdm

  tasks:

    - name: "🖥️  Determine the correct WebKitGTK package name for this host"
      set_fact:
        webkit_pkg: >-
          {% if ansible_facts['distribution_major_version'] is version('7', '==') %}
            {{ webkit_pkg_rhel7 }}
          {% elif ansible_facts['distribution_major_version'] is version('8', '==') %}
            {{ webkit_pkg_rhel8 }}
          {% else %}
            {{ webkit_pkg_rhel9 }}
          {% endif %}
        safe_version: >-
          {% if ansible_facts['distribution_major_version'] is version('7', '==') %}
            {{ safe_version_rhel7 }}
          {% elif ansible_facts['distribution_major_version'] is version('8', '==') %}
            {{ safe_version_rhel8 }}
          {% else %}
            {{ safe_version_rhel9 }}
          {% endif %}

    - name: "🔎  Show detected package name and target safe version (debug)"
      debug:
        msg:
          - "Package to manage: {{ webkit_pkg }}"
          - "Safe version for this OS: {{ safe_version }}"

    # --------------------------------------------------------------
    # 4️⃣  Ensure security repositories are enabled (RHEL 8/9 use dnf)
    # --------------------------------------------------------------
    - name: "Enable optional and security repos on RHEL 8/9"
      when: ansible_facts['distribution_major_version']|int >= 8
      block:
        - name: "Enable codeready-builder (if using RHEL 8)"
          ansible.builtin.command: subscription-manager repos --enable=rhel-8-for-x86_64-codeready-builder-rpms
          register: crb_enable
          changed_when: "'Enabled' in crb_enable.stdout"
          failed_when: crb_enable.rc != 0 and 'Already enabled' not in crb_enable.stderr

        - name: "Enable the security repository (RHEL 8/9)"
          ansible.builtin.command: subscription-manager repos --enable=rhel-{{ ansible_facts['distribution_major_version'] }}-for-x86_64-appstream-rpms
          register: appstream_enable
          changed_when: "'Enabled' in appstream_enable.stdout"
          failed_when: appstream_enable.rc != 0 and 'Already enabled' not in appstream_enable.stderr

    # --------------------------------------------------------------
    # 5️⃣  Install / upgrade to the patched WebKitGTK version
    # --------------------------------------------------------------
    - name: "💿  Install the latest patched WebKitGTK package (yum on RHEL 7)"
      yum:
        name: "{{ webkit_pkg }}"
        state: latest
      when: ansible_facts['distribution_major_version']|int == 7
      register: yum_result

    - name: "💿  Install the latest patched WebKitGTK package (dnf on RHEL 8/9)"
      dnf:
        name: "{{ webkit_pkg }}"
        state: latest
        # make sure we get security updates even if a newer non‑security version exists
        security: yes
      when: ansible_facts['distribution_major_version']|int >= 8
      register: dnf_result

    # --------------------------------------------------------------
    # 6️⃣  Capture the version before and after the upgrade
    # --------------------------------------------------------------
    - name: "🧾  Capture pre‑upgrade version"
      command: rpm -q {{ webkit_pkg }}
      register: pre_version
      changed_when: false
      failed_when: pre_version.rc != 0

    - name: "🧾  Capture post‑upgrade version"
      command: rpm -q {{ webkit_pkg }}
      register: post_version
      changed_when: false
      failed_when: post_version.rc != 0

    # --------------------------------------------------------------
    # 7️⃣  Verify we are now on the safe version (or newer)
    # --------------------------------------------------------------
    - name: "✅  Ensure the installed version meets or exceeds the safe version"
      assert:
        that:
          - "post_version.stdout is version(safe_version, '>=')"
        fail_msg: >-
          The installed WebKitGTK version {{ post_version.stdout }} is older than the safe
          version {{ safe_version }}. Please investigate repository access or manual update.
        success_msg: >-
          WebKitGTK is now at {{ post_version.stdout }}, which satisfies the safe version requirement.

    # --------------------------------------------------------------
    # 8️⃣  Restart services that may be using the old library
    # --------------------------------------------------------------
    - name: "🔁  Restart services that embed WebKitGTK (if they are running)"
      service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ services_to_restart }}"
      when: "'{{ webkit_pkg }}' in pre_version.stdout"
      ignore_errors: true   # Some services may not exist on all hosts

    # --------------------------------------------------------------
    # 9️⃣  Report the outcome
    # --------------------------------------------------------------
    - name: "🗒️  Summarize remediation result"
      set_fact:
        remediation_summary: |
          Host: {{ inventory_hostname }}
          OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          Package: {{ webkit_pkg }}
          Pre‑upgrade version: {{ pre_version.stdout }}
          Post‑upgrade version: {{ post_version.stdout }}
          Safe version required: {{ safe_version }}
          Services restarted: {{ services_to_restart | select('in', ansible_facts.services.keys()) | list }}
    - name: "📤  Print remediation summary"
      debug:
        msg: "{{ remediation_summary }}"

  # --------------------------------------------------------------
  # Optional: write the summary to a central log file on the control node
  # --------------------------------------------------------------
  post_tasks:
    - name: "🗂️  Store remediation summary locally"
      local_action:
        module: copy
        content: "{{ remediation_summary }}\n"
        dest: "./mitigation_reports/{{ inventory_hostname }}_webkitygtk_cve.txt"
      run_once: false