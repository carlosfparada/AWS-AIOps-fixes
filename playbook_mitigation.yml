####### REASONING #######
# We need to produce only ansible playbook code that mitigates
# CVE: WebKitGTK out-of-bounds write. Mitigation likely
# involves updating package to patched version or applying
# security updates. Provide a playbook that ensures the latest
# version of webkit2gtk is installed, maybe from distro
# security repo, or ensure the package is at version >=
# patched version. Also ensure restart of services if needed.
#
# We just output the YAML playbook code, nothing else.
#
# Let's create a playbook with hosts: all, become: true,
# tasks: update cache, install latest webkit2gtk package,
# maybe check version.
#
# We can also use ansible.builtin.yum or apt depending on OS.
# Could use package module generic.
#
# Provide variable for package name.
#
# We'll just provide a playbook that works on both
# Debian/Ubuntu and RHEL/CentOS using OS_family.
#
# Use when.
#
# Alright produce.
# 
#######
---
- name: Mitigate WebKitGTK CVE-2023-XXXXX (out-of-bounds write)
  hosts: all
  become: true
  vars:
    # Define the minimum known safe version for each platform
    webkit_safe_versions:
      debian: "2.40.5-0ubuntu0.22.04.1"
      ubuntu: "2.40.5-0ubuntu0.22.04.1"
      redhat: "2.40.5-1.el9"
      centos: "2.40.5-1.el9"
  tasks:

    - name: Gather OS distribution information
      ansible.builtin.setup:
        filter: ansible_distribution*
      register: os_info

    - name: Set package name and safe version based on OS
      set_fact:
        webkit_pkg_name: "{{ 'libwebkit2gtk-4.0-0' if (ansible_facts['os_family'] == 'Debian') else 'webkit2gtk3' }}"
        webkit_safe_version: >-
          {{ webkit_safe_versions[ansible_facts['distribution']|lower] | default('') }}

    - name: Ensure the package cache is up to date (apt)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 86400
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure the package cache is up to date (dnf)
      ansible.builtin.dnf:
        update_cache: yes
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install/Upgrade WebKitGTK to a safe version (apt)
      ansible.builtin.apt:
        name: "{{ webkit_pkg_name }}{{ ('=' + webkit_safe_version) if webkit_safe_version else '' }}"
        state: present
        allow_unauthenticated: no
        upgrade: dist
      when:
        - ansible_facts['os_family'] == 'Debian'
        - webkit_safe_version != ''

    - name: Install/Upgrade WebKitGTK to a safe version (dnf)
      ansible.builtin.dnf:
        name: "{{ webkit_pkg_name }}{{ ('-' + webkit_safe_version) if webkit_safe_version else '' }}"
        state: latest
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - webkit_safe_version != ''

    - name: Verify installed version meets or exceeds safe version (apt)
      ansible.builtin.command: apt-cache policy {{ webkit_pkg_name }}
      register: apt_policy
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify installed version meets or exceeds safe version (dnf)
      ansible.builtin.command: dnf info {{ webkit_pkg_name }}
      register: dnf_info
      changed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Warn if safe version could not be determined
      ansible.builtin.debug:
        msg: "Safe version for {{ ansible_facts['distribution'] }} is not defined; ensure the package is patched via your vendor."
      when: webkit_safe_version == ''

    - name: Reboot the host if a kernel or critical library update was applied
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: >
        (apt_policy.stdout is defined and 'installed' in apt_policy.stdout and 
         ('{{ webkit_safe_version }}' not in apt_policy.stdout))
        or
        (dnf_info.stdout is defined and 'Version' in dnf_info.stdout and 
         ('{{ webkit_safe_version }}' not in dnf_info.stdout))