# ------------------------------------------------------------
# Ansible Playbook – CVE‑2026‑31431 Mitigation
# ------------------------------------------------------------
# Details:
#   • Vulnerability in the Linux kernel’s algif_aead cryptographic
#     interface – an in‑place operation can lead to data corruption
#     and local privilege escalation.
#   • The fix reverts the in‑place handling and forces a copy of the
#     associated data.
#
# Mitigation:
#   See the security bulletin for a detailed mitigation procedure.
#
# References:
#   • https://www.cve.org/CVERecord?id=CVE-2026-31431
#   • https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#   • https://access.redhat.com/articles/7141989
#   • https://access.redhat.com/solutions/7141931
#   • https://access.redhat.com/solutions/7141979
#   • https://access.redhat.com/solutions/7141990
#   • https://access.redhat.com/solutions/7141996
#   • https://access.redhat.com/solutions/7142032
#   • https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#   • https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#   • https://www.cisa.gov/known-exploited-vulnerabilities-catalog
# ------------------------------------------------------------

- name: Mitigate CVE-2026-31431 on targeted EC2 instances
  hosts: "ec2-52-90-70-64.compute-1.amazonaws.com,ec2-3-91-28-234.compute-1.amazonaws.com"
  become: true          # Ensure we have root privileges
  gather_facts: true

  vars:
    # Adjust the version below to the minimum patched version for your distro.
    # For RHEL 9 the fix is included in kernel‑5.14.0‑231.el9 (example).
    min_patched_kernel: "5.14.0-231.el9"

  tasks:

    - name: Install the latest kernel package (RHEL/CentOS/Fedora)
      yum:
        name: kernel
        state: latest
      notify: Reboot the host

    - name: Capture the running kernel version
      command: uname -r
      register: current_kernel
      changed_when: false
      check_mode: false

    - name: Ensure the running kernel meets the minimum patched version
      fail:
        msg: >
          The current kernel version ({{ current_kernel.stdout }}) is older than the
          required patched version {{ min_patched_kernel }}.  Kernel must be upgraded
          before proceeding.
      when: current_kernel.stdout is version(min_patched_kernel, '<')

    - name: Verify that the kernel module 'algif_aead' is present and loaded
      shell: |
        lsmod | grep -w algif_aead || modprobe algif_aead
      args:
        warn: false
      register: algif_aead_check
      changed_when: false

    - name: Confirm that the module loaded without errors
      fail:
        msg: "Failed to load the algif_aead module – kernel may be mis‑configured."
      when: algif_aead_check.rc != 0

  handlers:

    - name: Reboot the host
      reboot:
        reboot_timeout: 600
        test_command: whoami
      listen: Reboot the host