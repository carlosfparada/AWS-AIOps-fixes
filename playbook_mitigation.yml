# ------------------------------------------------------------
# Playbook: mitigate-cve-2026-31431.yml
# Description: Apply the upstream fix for CVE‑2026‑31431 (algif_aead
#              in‑place operation bug) by updating the kernel to the
#              latest patched version and rebooting the host.
# Targets: ec2-3-84-172-241.compute-1.amazonaws.com,
#          ec2-3-88-254-183.compute-1.amazonaws.com
# ------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on the target EC2 instances
  hosts: "ec2-3-84-172-241.compute-1.amazonaws.com,ec2-3-88-254-183.compute-1.amazonaws.com"
  become: true               # all tasks need root privileges
  gather_facts: true         # we need the kernel version, etc.

  vars:
    # -----------------------------------------------------------------
    # CVE meta‑data (useful for documentation, idempotency checks, etc.)
    # -----------------------------------------------------------------
    cve_id:              "CVE-2026-31431"
    cve_severity:        "Low"
    cve_description: |
      A flaw was found in the Linux kernel's algif_aead cryptographic
      algorithm interface. An incorrect in‑place operation causes source
      and destination data mappings to differ during cryptographic
      processing. A low‑privileged local attacker can exploit this flaw
      to corrupt the contents of sensitive system files and escalate to
      root privileges.

      In the Linux kernel, the vulnerability has been resolved by
      reverting to an out‑of‑place operation (see commit 72548b09…).

    mitigation_note: |
      See the security bulletin for a detailed mitigation procedure.
    # -----------------------------------------------------------------
    # Package list – adjust if you use a distro that splits the kernel
    # into separate packages (e.g., kernel-uek, kernel-modules, …)
    # -----------------------------------------------------------------
    kernel_packages:
      - kernel
      - kernel-core       # on RHEL 9 / Enterprise Linux 9
      - kernel-modules    # on RHEL 9 / Enterprise Linux 9
      - kernel-devel      # optional, only if you compile modules locally

    # -----------------------------------------------------------------
    # References – stored for easy lookup / audit
    # -----------------------------------------------------------------
    cve_references:
      - https://www.cve.org/CVERecord?id=CVE-2026-31431
      - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
      - https://access.redhat.com/articles/7141989
      - https://access.redhat.com/solutions/7141931
      - https://access.redhat.org/solutions/7141979
      - https://access.redhat.org/solutions/7141990
      - https://access.redhat.org/solutions/7141996
      - https://access.redhat.org/solutions/7142032
      - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
      - https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog

  tasks:

    # -----------------------------------------------------------------
    # 1️⃣  Display CVE information – helpful for logs / audit trails
    # -----------------------------------------------------------------
    - name: Show CVE details
      ansible.builtin.debug:
        msg:
          - "Mitigating {{ cve_id }} on {{ inventory_hostname }}"
          - "{{ cve_description }}"
          - "References: {{ cve_references | join(', ') }}"

    # -----------------------------------------------------------------
    # 2️⃣  Install the latest kernel (and related packages)
    # -----------------------------------------------------------------
    - name: Ensure latest kernel packages are installed
      ansible.builtin.package:
        name: "{{ kernel_packages }}"
        state: latest
      register: kernel_update

    # -----------------------------------------------------------------
    # 3️⃣  Determine if a reboot is required
    # -----------------------------------------------------------------
    - name: Check if the running kernel is the newest one
      ansible.builtin.command: rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel
      changed_when: false
      register: installed_kernels

    - name: Get the version of the currently running kernel
      ansible.builtin.command: uname -r
      changed_when: false
      register: running_kernel

    - name: Set fact – reboot needed?
      ansible.builtin.set_fact:
        reboot_required: "{{ running_kernel.stdout not in installed_kernels.stdout_lines }}"

    - name: Debug – kernel version comparison
      ansible.builtin.debug:
        msg:
          - "Running kernel: {{ running_kernel.stdout }}"
          - "Installed kernels: {{ installed_kernels.stdout_lines }}"
          - "Reboot required: {{ reboot_required }}"

    # -----------------------------------------------------------------
    # 4️⃣  Make the latest kernel the default (GRUB2)
    # -----------------------------------------------------------------
    - name: Set default boot entry to the latest kernel (GRUB2)
      ansible.builtin.command: >
        grub2-set-default 0
      when: reboot_required
      args:
        warn: false
      become: true

    # -----------------------------------------------------------------
    # 5️⃣  Reboot the host if the new kernel is not yet active
    # -----------------------------------------------------------------
    - name: Reboot the machine to apply the new kernel
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: uname -r
      when: reboot_required
      listen: reboot_trigger

    # -----------------------------------------------------------------
    # 6️⃣  Verify the kernel is now patched
    # -----------------------------------------------------------------
    - name: Verify that the running kernel matches the latest installed one
      ansible.builtin.command: uname -r
      changed_when: false
      register: post_reboot_kernel
      until: post_reboot_kernel.stdout in installed_kernels.stdout_lines
      retries: 5
      delay: 15

    - name: Final verification message
      ansible.builtin.debug:
        msg: >
          Host {{ inventory_hostname }} is now running kernel {{ post_reboot_kernel.stdout }},
          which includes the fix for {{ cve_id }}.

# ------------------------------------------------------------
# End of playbook
# ------------------------------------------------------------