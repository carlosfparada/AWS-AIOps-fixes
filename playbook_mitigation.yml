---                                   # Ansible playbook header
- name: Mitigate CVE-2026-31431 on RHEL hosts
  hosts: >
    ec2-54-90-135-180.compute-1.amazonaws.com,
    ec2-34-228-227-78.compute-1.amazonaws.com
  become: true                         # all tasks need privilege escalation
  gather_facts: true                   # we need ansible_facts to detect OS

  # -------------------------------------------------------------------------
  # 1️⃣  Fail fast on non‑RHEL systems
  # -------------------------------------------------------------------------
  pre_tasks:
    - name: Verify the target OS is Red Hat Enterprise Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "RedHat"
        fail_msg: >-
          This playbook is intended for RHEL only. Detected
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
        success_msg: "RHEL detected – proceeding with mitigation."

  # -------------------------------------------------------------------------
  # 2️⃣  Apply kernel‑parameter mitigations
  # -------------------------------------------------------------------------
  tasks:

    # ---------------------------------------------------------
    # 2.1  Blacklist the vulnerable kernel module (algif_aead)
    # ---------------------------------------------------------
    - name: Create a modprobe blacklist entry for algif_aead
      ansible.builtin.copy:
        dest: /etc/modprobe.d/algif_aead.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Mitigation for CVE-2026-31431 – disable the algif_aead crypto module
          blacklist algif_aead
      notify: Regenerate initramfs (RHEL‑specific)

    # ---------------------------------------------------------
    # 2.2  Disable the AF_ALG socket interface via sysctl
    # ---------------------------------------------------------
    - name: Ensure sysctl kernel.crypto_user_enabled = 0 (disable AF_ALG)
      ansible.builtin.sysctl:
        name: kernel.crypto_user_enabled
        value: 0
        sysctl_set: yes
        state: present
        reload: yes
        comment: "Mitigation for CVE-2026-31431 – turn off user‑space crypto sockets"

    # ---------------------------------------------------------
    # 2.3  Persist the sysctl across reboots
    # ---------------------------------------------------------
    - name: Persist the kernel.crypto_user_enabled setting in /etc/sysctl.d
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-cve-2026-31431.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CVE-2026-31431 mitigation – disable user‑space crypto sockets
          kernel.crypto_user_enabled = 0
      notify: Reload sysctl

  # -------------------------------------------------------------------------
  # 3️⃣  Reboot – only if any of the above changes required it
  # -------------------------------------------------------------------------
  handlers:

    - name: Regenerate initramfs (RHEL‑specific)
      ansible.builtin.command: dracut -f
      listen: Regenerate initramfs (RHEL‑specific)
      when: ansible_facts['distribution_major_version']|int >= 7
      async: 600
      poll: 0
      register: dracut_job

    - name: Wait for initramfs regeneration to finish
      ansible.builtin.async_status:
        jid: "{{ dracut_job.ansible_job_id }}"
      register: dracut_result
      until: dracut_result.finished
      retries: 30
      delay: 10
      when: dracut_job is defined

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      listen: Reload sysctl

    - name: Reboot the machine to apply kernel‑level changes
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 10
        post_reboot_delay: 30
        test_command: whoami
      listen: Reboot the machine to apply kernel‑level changes
      when: 
        - "'blacklist algif_aead' in (lookup('file', '/etc/modprobe.d/algif_aead.conf') | default(''))"
        - ansible_facts['booted'] | bool   # always true; kept for readability

  # The play ends here – any host that is not RHEL will have already aborted in pre_tasks.