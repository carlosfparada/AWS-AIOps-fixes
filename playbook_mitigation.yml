# --------------------------------------------------------------
# Playbook:  cve-2026-53359‑mitigation.yml
# Purpose :  Disable nested virtualization for the KVM Intel and
#            AMD modules on the two supplied hosts.
# --------------------------------------------------------------

- name: Mitigate CVE‑2026‑53359 on the affected EC2 instances
  hosts:
    - ec2-54-237-28-92.compute-1.amazonaws.com
    - ec2-34-230-26-219.compute-1.amazonaws.com
  become: true               # need root privileges for modprobe & /etc files
  gather_facts: false        # not required for this short playbook

  vars:
    mitigation_conf: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    mitigation_content: |
      # CVE‑2026‑53359 – disable KVM nested virtualization
      # Reference: https://access.redhat.com/solutions/6979679
      options kvm-intel nested=0
      options kvm-amd   nested=0

  pre_tasks:
    # -----------------------------------------------------------------
    # Gather information about which KVM modules are currently loaded.
    # -----------------------------------------------------------------
    - name: Check if the kvm_intel module is loaded
      command: lsmod
      register: lsmod_out
      changed_when: false

    - name: Set fact – is kvm_intel loaded?
      set_fact:
        kvm_intel_loaded: "{{ 'kvm_intel' in lsmod_out.stdout_lines | map('split') | map('first') | list }}"

    - name: Set fact – is kvm_amd loaded?
      set_fact:
        kvm_amd_loaded: "{{ 'kvm_amd' in lsmod_out.stdout_lines | map('split') | map('first') | list }}"

  tasks:
    # -----------------------------------------------------------------
    # 1. Un‑load the modules if they are already present – they must be
    #    removed before the new modprobe options take effect.
    # -----------------------------------------------------------------
    - name: Unload kvm_intel module (if loaded)
      command: modprobe -r kvm_intel
      when: kvm_intel_loaded
      ignore_errors: true               # ignore if other modules depend on it
      register: rm_intel
      notify: reload_kvm_modules

    - name: Unload kvm_amd module (if loaded)
      command: modprobe -r kvm_amd
      when: kvm_amd_loaded
      ignore_errors: true
      register: rm_amd
      notify: reload_kvm_modules

    # -----------------------------------------------------------------
    # 2. Deploy the modprobe configuration that disables nesting.
    # -----------------------------------------------------------------
    - name: Deploy mitigation file in /etc/modprobe.d/
      copy:
        dest: "{{ mitigation_conf }}"
        content: "{{ mitigation_content }}"
        owner: root
        group: root
        mode: '0644'
      notify: reload_kvm_modules

    # -----------------------------------------------------------------
    # 3. Verify that the kernel parameters now report “N” (disabled).
    # -----------------------------------------------------------------
    - name: Verify nested flag for kvm_intel (if module present)
      command: cat /sys/module/kvm_intel/parameters/nested
      register: intel_nested
      failed_when: intel_nested.stdout != "N"
      changed_when: false
      when: kvm_intel_loaded

    - name: Verify nested flag for kvm_amd (if module present)
      command: cat /sys/module/kvm_amd/parameters/nested
      register: amd_nested
      failed_when: amd_nested.stdout != "N"
      changed_when: false
      when: kvm_amd_loaded

    - name: Report successful mitigation
      debug:
        msg: |
          CVE‑2026‑53359 mitigated: nested virtualization is now disabled
          on {{ inventory_hostname }}.
      when: (kvm_intel_loaded | default(false) and intel_nested.stdout == "N") or
            (kvm_amd_loaded | default(false) and amd_nested.stdout == "N") or
            (not kvm_intel_loaded and not kvm_amd_loaded)

  handlers:
    # -----------------------------------------------------------------
    # Reload the KVM modules so they pick up the new “nested=0” options.
    # -----------------------------------------------------------------
    - name: reload_kvm_modules
      block:
        - name: Load kvm_intel module (if it existed before)
          command: modprobe kvm_intel
          when: kvm_intel_loaded
          ignore_errors: true

        - name: Load kvm_amd module (if it existed before)
          command: modprobe kvm_amd
          when: kvm_amd_loaded
          ignore_errors: true
      listen: reload_kvm_modules