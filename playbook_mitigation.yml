####### REASONING #######
# The user wants an Ansible playbook to mitigate a specific
# CVE on RHEL hosts: a flaw in WebKitGTK. They want a
# playbook. Provide a playbook that updates package, applies
# relevant patches, maybe ensures version. Also include steps
# to check current version, apply update from RHEL security
# repository, possibly restart services. Provide variables,
# handlers. Should be safe. Also maybe include remediations
# like disabling WebKitGTK if not needed. Provide explanation.
# Ensure it's not disallowed. It's permissible. Provide YAML.
#######
---
# --------------------------------------------------------------
# Playbook: mitigate_webkitgtk.yml
# Purpose: Apply Red Hat security fix for WebKitGTK (CVE‑XXXX‑XXXX)
# Supported OS: RHEL 7, 8, 9 (all with RHSM subscription)
# --------------------------------------------------------------

- name: "Mitigate WebKitGTK out‑of‑bounds write vulnerability"
  hosts: all
  become: true
  vars:
    # -----------------------------------------------------------------
    # Default variables – override them in group_vars/host_vars if desired
    # -----------------------------------------------------------------
    # Package name(s) that contain WebKitGTK.  Adjust if you have a
    # different naming scheme (e.g., on RHEL 7 the package is called
    # `webkitgtk3`; on RHEL 8/9 it is `webkit2gtk3`).
    webkitgtk_packages:
      - webkit2gtk3          # RHEL 8/9
      - webkitgtk3           # RHEL 7 (fallback)

    # Desired minimal version after the security fix.
    # Update this value whenever Red Hat releases a newer advisory.
    webkitgtk_fixed_version: "2.40.5-1.el9_0"   # Example for RHEL 9

    # List of services that may be using WebKitGTK and should be restarted.
    # Add/remove entries based on your environment.
    service_restart:
      - gdm
      - cockpit
      - gnome-shell
      - NetworkManager

    # Whether to actually apply changes or just perform a “check‑mode” run.
    dry_run: false

    # Whether to verify the installed version after the update.
    verify_installation: true

    # Optional: custom Red Hat repository URL (if you use a satellite/spacewalk mirror)
    rh_repo_baseurl: ""   # leave empty to use the default RHSM repos

  pre_tasks:

    - name: "Assert we are running on a Red Hat family OS"
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: "This playbook only supports Red Hat based systems."
      tags: always

    - name: "Gather subscription status (RHEL) – fail if not registered"
      ansible.builtin.command: "subscription-manager status"
      register: sub_status
      changed_when: false
      failed_when: sub_status.rc != 0
      when: ansible_facts['distribution'] in ['RedHat', 'CentOS']
      tags: always

    - name: "Enable required Red Hat repos (if a custom baseurl is supplied)"
      ansible.builtin.yum_repository:
        name: rhel-{{ ansible_facts['distribution_major_version'] }}-server-rpms
        description: "Red Hat Enterprise Linux {{ ansible_facts['distribution_major_version'] }} Server RPMs"
        baseurl: "{{ rh_repo_baseurl | default(omit) }}"
        enabled: true
        gpgcheck: true
        gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release"
      when: rh_repo_baseurl | length > 0
      tags: repos

  tasks:

    - name: "Collect currently installed WebKitGTK packages"
      ansible.builtin.package_facts:
        manager: auto
      tags: gather

    - name: "Show current versions (debug)"
      ansible.builtin.debug:
        var: ansible_facts.packages
        verbosity: 2
      tags: debug

    - name: "Identify which WebKitGTK package is present"
      set_fact:
        webkit_pkg_installed: "{{ item }}"
      loop: "{{ webkitgtk_packages }}"
      when: ansible_facts.packages[item] is defined
      register: pkg_finder
      tags: identify

    - name: "Fail if no known WebKitGTK package is installed"
      ansible.builtin.fail:
        msg: "None of the expected WebKitGTK packages are present on {{ inventory_hostname }}."
      when: webkit_pkg_installed is not defined
      tags: identify

    - name: "Display the package that will be patched"
      ansible.builtin.debug:
        msg: "Package {{ webkit_pkg_installed }} will be updated to version >= {{ webkitgtk_fixed_version }}."
      tags: identify

    - name: "Check if the installed version already satisfies the fix"
      ansible.builtin.set_fact:
        current_version: "{{ ansible_facts.packages[webkit_pkg_installed][0].version }}-{{ ansible_facts.packages[webkit_pkg_installed][0].release }}"
      when: ansible_facts.packages[webkit_pkg_installed] is defined

    - name: "Compare current version with required fixed version"
      ansible.builtin.set_fact:
        needs_update: "{{ (current_version is version(webkitgtk_fixed_version, '<')) }}"
      when: current_version is defined

    - name: "Skip update if package already meets required version"
      ansible.builtin.debug:
        msg: "Package {{ webkit_pkg_installed }} is already at version {{ current_version }} (>= {{ webkitgtk_fixed_version }}). No action needed."
      when: not needs_update
      tags: skip

    - name: "Update WebKitGTK package to security‑fixed version"
      ansible.builtin.yum:
        name: "{{ webkit_pkg_installed }}"
        state: latest
        # `security` flag forces yum to pull only RHSA security updates (if you prefer that)
        # security: yes
      when: needs_update and not dry_run
      tags: update

    - name: "Do a dry‑run package update (no changes) – for testing"
      ansible.builtin.yum:
        name: "{{ webkit_pkg_installed }}"
        state: latest
        update_cache: yes
        # yum's `--downloadonly` cannot be expressed directly; we rely on `check_mode`
      when: needs_update and dry_run
      check_mode: true
      tags: dryrun

    - name: "Re‑run package facts after update"
      ansible.builtin.package_facts:
        manager: auto
      when: needs_update and not dry_run
      tags: post_update

    - name: "Verify that the package now meets the required version"
      ansible.builtin.assert:
        that:
          - (ansible_facts.packages[webkit_pkg_installed][0].version ~ '-' ~ ansible_facts.packages[webkit_pkg_installed][0].release) is version(webkitgtk_fixed_version, '>=')
        fail_msg: "Package {{ webkit_pkg_installed }} still does not meet the required version after update."
      when:
        - verify_installation
        - needs_update
        - not dry_run
      tags: verify

    - name: "Restart services that may use WebKitGTK"
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: "{{ service_restart }}"
      when: needs_update and not dry_run
      tags: restart

  post_tasks:

    - name: "Summarize remediation result"
      ansible.builtin.debug:
        msg: |
          ----------------------------------------------------
          Host: {{ inventory_hostname }}
          Package: {{ webkit_pkg_installed | default('N/A') }}
          Current version: {{ ansible_facts.packages[webkit_pkg_installed][0].version }}-{{ ansible_facts.packages[webkit_pkg_installed][0].release }}
          Required minimum: {{ webkitgtk_fixed_version }}
          Update applied: {{ needs_update | default(false) and (not dry_run) }}
          Services restarted: {{ service_restart | join(', ') if (needs_update and not dry_run) else 'none' }}
          ----------------------------------------------------
      tags: summary

    - name: "Fail if update was required but not applied (e.g., in dry‑run mode)"
      ansible.builtin.fail:
        msg: |
          UPDATE NOT APPLIED!  The host required a WebKitGTK security update,
          but the playbook was run in dry‑run mode or the update failed.
          Review the log and re‑run without `dry_run: true`.
      when:
        - needs_update | default(false)
        - dry_run
      tags: final_check