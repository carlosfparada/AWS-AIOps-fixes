# Playbook to mitigate CVE‑2026‑31431 (algif_aead in‑place operation flaw)
# --------------------------------------------------------------------
#  * CVE details:
#    - In the Linux kernel the algif_aead cryptographic algorithm interface
#      performed an unsafe in‑place operation that could be exploited by a
#      low‑privileged attacker to corrupt system files and obtain root.
#  * Mitigation:
#    - Apply the kernel update that reverts the in‑place change (see the
#      security bulletin for a detailed mitigation procedure).
#  * References:
#    - https://www.cve.org/CVERecord?id=CVE-2026-31431
#    - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#    - https://access.redhat.com/articles/7141989
#    - https://access.redhat.com/solutions/7141931
#    - https://access.redhat.com/solutions/7141979
#    - https://access.redhat.com/solutions/7141990
#    - https://access.redhat.com/solutions/7141996
#    - https://access.redhat.com/solutions/7142032
#    - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#    - https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog

- name: Apply kernel patch for CVE‑2026‑31431
  hosts: 'ec2-3-84-172-241.compute-1.amazonaws.com,ec2-3-88-254-183.compute-1.amazonaws.com'
  become: true
  vars:
    # Minimum kernel version that contains the fix (example for RHEL 9)
    # Adjust the version according to your distribution's advisory.
    required_kernel: "5.14.0-284.11.1.el9_2"
  tasks:

    - name: Gather current kernel version
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: Debug current kernel version
      ansible.builtin.debug:
        msg: "Current kernel version is {{ current_kernel.stdout }}"

    - name: Install the latest kernel package (RHEL / CentOS / Rocky / AlmaLinux)
      ansible.builtin.yum:
        name: kernel
        state: latest
      register: kernel_update
      when: ansible_facts.os_family == "RedHat"

    - name: Install the latest kernel package (Debian / Ubuntu)
      ansible.builtin.apt:
        name: linux-image-generic
        state: latest
        update_cache: yes
      register: kernel_update
      when: ansible_facts.os_family == "Debian"

    - name: Set fact if kernel was updated
      ansible.builtin.set_fact:
        kernel_needs_reboot: true
      when: kernel_update.changed

    - name: Reboot the host to load the patched kernel
      ansible.builtin.reboot:
        msg: "Rebooting to apply kernel update that mitigates CVE‑2026‑31431"
        reboot_timeout: 600
      when: kernel_needs_reboot | default(false)
      notify: Verify running kernel after reboot

  handlers:
    - name: Verify running kernel after reboot
      ansible.builtin.command: uname -r
      register: post_reboot_kernel
      changed_when: false

    - name: Fail if the required kernel is not running
      ansible.builtin.fail:
        msg: |
          The required kernel ({{ required_kernel }}) is not running after reboot.
          Current kernel: {{ post_reboot_kernel.stdout }}. \
          Please investigate further.
      when: post_reboot_kernel.stdout is version(required_kernel, '<')