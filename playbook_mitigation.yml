# ---------------------------------------------------------
# Ansible Playbook – CVE‑2026‑31431 mitigation
# ---------------------------------------------------------
# Details:
#   • In the Linux kernel the algif_aead “in‑place” operation was
#     reverted because source and destination mappings differ.
#   • A low‑privileged local attacker can corrupt sensitive files and
#     gain root privileges.
#
# Mitigation:
#   See the security bulletin for a detailed mitigation procedure.
#
# References:
#   - https://www.cve.org/CVERecord?id=CVE-2026-31431
#   - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#   - https://access.redhat.com/articles/7141989
#   - https://access.redhat.com/solutions/7141931
#   - https://access.redhat.com/solutions/7141979
#   - https://access.redhat.com/solutions/7141990
#   - https://access.redhat.com/solutions/7141996
#   - https://access.redhat.com/solutions/7142032
#   - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/
#     managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#   - https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#   - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
#
# -----------------------------------------------------------------
# NOTE:
#   * The play targets are **exactly** the string required by the task:
#       ec2-52-90-70-64.compute-1.amazonaws.com,ec2-3-91-28-234.compute-1.amazonaws.com
#   * No `block` structures are used inside handlers, per the request.
#   * If a kernel upgrade is required the host is rebooted **before**
#     the running kernel version is verified.
# -----------------------------------------------------------------

# -----------------------------------------------------------------
# Play 1 – Install the newest kernel (if needed) and reboot
# -----------------------------------------------------------------
- name: Install latest kernel and reboot if required
  hosts: ec2-52-90-70-64.compute-1.amazonaws.com,ec2-3-91-28-234.compute-1.amazonaws.com
  become: true
  gather_facts: true

  tasks:

    - name: Ensure the latest kernel package is installed
      package:
        name: kernel
        state: latest
      register: kernel_pkg
      notify: Reboot host

    - name: Record the version of the newly‑installed kernel package
      command: rpm -q --qf '%{VERSION}-%{RELEASE}' kernel
      register: latest_kernel_pkg
      changed_when: false
      when: kernel_pkg.changed

  handlers:

    - name: Reboot host
      reboot:
        reboot_timeout: 600        # seconds to wait for the host to come back
        post_reboot_delay: 10      # give the system a few seconds after it’s up
      listen: Reboot host

# -----------------------------------------------------------------
# Play 2 – Verify that the running kernel matches the latest package
# -----------------------------------------------------------------
- name: Verify kernel version after possible reboot
  hosts: ec2-52-90-70-64.compute-1.amazonaws.com,ec2-3-91-28-234.compute-1.amazonaws.com
  become: true
  gather_facts: true

  tasks:

    - name: Get the version of the installed kernel package
      command: rpm -q --qf '%{VERSION}-%{RELEASE}' kernel
      register: installed_kernel_pkg
      changed_when: false

    - name: Show kernel versions for debugging
      debug:
        msg:
          - "Running kernel (ansible_kernel) : {{ ansible_kernel }}"
          - "Installed kernel package version: {{ installed_kernel_pkg.stdout }}"

    - name: Ensure the running kernel is the latest one installed
      assert:
        that:
          - ansible_kernel == installed_kernel_pkg.stdout
        fail_msg: >-
          The running kernel ({{ ansible_kernel }}) does not match the
          latest installed package ({{ installed_kernel_pkg.stdout }}).
          A reboot may be required or the kernel update failed.