# ------------------------------------------------------------
# Playbook : mitigate-CVE-2026-31431.yml
# CVE      : CVE-2026-31431
# Impact   : Local privilege escalation via the algif_aead
#            cryptographic interface (in‑place operation bug).
# Mitigation: Install the latest security‑patched kernel and
#             reboot the host.  For detailed steps see the
#             security bulletin linked in the References section.
# ------------------------------------------------------------
- name: Mitigate CVE‑2026‑31431 on selected EC2 instances
  hosts: rhel
  become: true                         # all tasks need root privileges
  gather_facts: true

  vars:
    # Packages that provide the patched kernel on RHEL / CentOS / Rocky / AlmaLinux
    kernel_pkg: kernel
    # Optional – use the distribution’s security‑only update command
    update_cmd: dnf updateinfo --security -y

  tasks:

    - name: "Display CVE information (for audit purposes)"
      debug:
        msg: |
          CVE-2026-31431 – Linux kernel algif_aead in‑place operation flaw.
          References:
          - https://www.cve.org/CVERecord?id=CVE-2026-31431
          - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
          - https://access.redhat.com/articles/7141989

    - name: "Ensure the latest security‑only update metadata is downloaded"
      command: "{{ update_cmd }}"
      register: update_info
      changed_when: false

    - name: "Install the latest patched kernel package"
      package:
        name: "{{ kernel_pkg }}"
        state: latest
      register: kernel_update
      notify: Reboot after kernel update

    - name: "Verify that the running kernel is the newly installed one"
      shell: |
        latest=$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' {{ kernel_pkg }} | sort -V | tail -1)
        running=$(uname -r)
        if [[ "$latest" == "$running" ]]; then
          echo "OK"
        else
          echo "NEEDS_REBOOT"
        fi
      register: kernel_check
      changed_when: kernel_check.stdout == "NEEDS_REBOOT"

    - name: "Trigger reboot if a newer kernel is installed but not running"
      when: kernel_check.stdout == "NEEDS_REBOOT"
      meta: flush_handlers                         # run the reboot handler now
      ignore_errors: true

  handlers:

    - name: Reboot after kernel update
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami
