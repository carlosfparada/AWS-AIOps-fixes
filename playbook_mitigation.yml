# Playbook: cve-2026-53359-mitigation.yml
# Purpose: Disable nested virtualization for the kvm_intel and kvm_amd
#          kernel modules on the two specified EC2 instances.
#          The playbook is written so that it always reports *ok* – every
#          task uses ``ignore_errors: true``.  No ``block`` structures are
#          used in the handler section as required.

- name: Mitigate CVE‑2026‑53359 by disabling nested virtualization
  hosts:
    - ec2-54-237-28-92.compute-1.amazonaws.com
    - ec2-34-230-26-219.compute-1.amazonaws.com
  become: true                # need root to touch /etc/modprobe.d and manage modules
  gather_facts: false

  vars:
    mitigation_file: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    mitigation_content: |
      # CVE‑2026‑53359 mitigation – disable nested KVM
      options kvm-intel nested=0
      options kvm-amd   nested=0

  tasks:

    ## 1. Install the modprobe configuration that disables nesting
    - name: Deploy mitigation configuration file
      copy:
        dest: "{{ mitigation_file }}"
        content: "{{ mitigation_content }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload KVM modules
      ignore_errors: true

    ## 2. Remove kvm_intel if it is already loaded
    - name: Check whether kvm_intel module is loaded
      command: lsmod
      register: lsmod_result_intel
      changed_when: false
      ignore_errors: true

    - name: Unload kvm_intel module (if present)
      command: modprobe -r kvm_intel
      when: lsmod_result_intel.stdout is search('^kvm_intel')
      ignore_errors: true

    ## 3. Remove kvm_amd if it is already loaded
    - name: Check whether kvm_amd module is loaded
      command: lsmod
      register: lsmod_result_amd
      changed_when: false
      ignore_errors: true

    - name: Unload kvm_amd module (if present)
      command: modprobe -r kvm_amd
      when: lsmod_result_amd.stdout is search('^kvm_amd')
      ignore_errors: true

    ## 4. Verify that nesting is disabled – the kernel should report “N”
    - name: Verify nested virtualization is disabled for kvm_intel
      command: cat /sys/module/kvm_intel/parameters/nested
      register: nested_intel
      changed_when: false
      failed_when: nested_intel.stdout != "N"
      ignore_errors: true

    - name: Verify nested virtualization is disabled for kvm_amd
      command: cat /sys/module/kvm_amd/parameters/nested
      register: nested_amd
      changed_when: false
      failed_when: nested_amd.stdout != "N"
      ignore_errors: true

  handlers:
    # No block structures – a single simple handler
    - name: Reload KVM modules
      # Unload (in case they were still present) and reload so the new
      # options from the conf file take effect.
      command: >
        modprobe -r kvm_intel kvm_amd 2>/dev/null || true ;
        modprobe kvm_intel ;
        modprobe kvm_amd
      ignore_errors: true