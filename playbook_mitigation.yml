####### REASONING #######
# We need to provide an Ansible playbook to mitigate CVE about
# WebKitGTK. Likely update the package to a patched version,
# maybe apply security updates, disable vulnerable component,
# or compile with patches. Provide playbook YAML.
#
# We must output only the playbook code, no extra text. Ensure
# correct format: - hosts: all, become: true, tasks: name,
# apt/yum etc.
#
# We need to consider both Debian/Ubuntu (apt) and
# RedHat/CentOS (yum/dnf) packages. Use package module with
# name: libwebkit2gtk-4.0-37 (or appropriate) and state:
# latest. Also ensure that the system is updated. Could also
# include handlers to restart services.
#
# We'll output yaml.
#
# Make sure nothing else besides playbook.
#######
- name: Mitigate WebKitGTK out-of-bounds write vulnerability (CVE-XXXX-XXXX)
  hosts: all
  become: true
  vars:
    webkit_packages:
      Debian: ["libwebkit2gtk-4.0-37", "libwebkit2gtk-4.0-common"]
      RedHat: ["webkit2gtk3", "webkit2gtk3-devel"]
  tasks:

    - name: Determine package manager
      ansible.builtin.set_fact:
        pkg_mgr: >-
          {% if ansible_facts.os_family == 'Debian' %}
            apt
          {% elif ansible_facts.os_family == 'RedHat' %}
            dnf
          {% else %}
            unknown
          {% endif %}

    - name: Fail if unsupported OS
      ansible.builtin.fail:
        msg: "Unsupported operating system for this playbook."
      when: pkg_mgr == "unknown"

    - name: Update package cache (APT)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: pkg_mgr == "apt"

    - name: Update package cache (DNF)
      ansible.builtin.dnf:
        update_cache: yes
      when: pkg_mgr == "dnf"

    - name: Install/upgrade WebKitGTK packages (Debian)
      ansible.builtin.apt:
        name: "{{ webkit_packages.Debian }}"
        state: latest
        install_recommends: no
      when: pkg_mgr == "apt"

    - name: Install/upgrade WebKitGTK packages (RedHat)
      ansible.builtin.dnf:
        name: "{{ webkit_packages.RedHat }}"
        state: latest
      when: pkg_mgr == "dnf"

    - name: Ensure web content sandbox service is running (if applicable)
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - webkitgtk-sandbox
        - sandboxd
      ignore_errors: true