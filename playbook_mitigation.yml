# ------------------------------------------------------------
# Playbook:  mitigate_cve_2026_31431.yml
# Target :  ec2-54-92-188-122.compute-1.amazonaws.com
# Purpose:  Apply the recommended mitigation for CVE‑2026‑31431.
# ------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on the affected host
  hosts: 'ec2-54-92-188-122.compute-1.amazonaws.com'
  become: true                         # we need root to touch kernel files / reboot
  gather_facts: true

  vars:
    # Minimum kernel version that contains the upstream fix.
    # The exact value depends on the distribution; the list below is illustrative.
    # Adjust as needed for your OS version.
    cve_fixed_kernel:
      rhel:   "9.4"
      centos: "9.4"
      fedora: "41"
      ubuntu: "24.04"

    # A human‑readable message that will be shown when the running kernel
    # does not contain the fix.
    mitigation_msg: |
      ----------------------------------------------------------------
      The running kernel ({{ ansible_kernel }}) does NOT contain the
      CVE‑2026‑31431 fix (algif_aead out‑of‑place operation).  Please
      apply a kernel update that includes the patch, then reboot.
      See the security bulletin for the detailed mitigation procedure:
      https://access.redhat.com/articles/7141989
      ----------------------------------------------------------------

  tasks:

    - name: Determine OS family specific fixed kernel version
      set_fact:
        required_kernel: >-
          {{ cve_fixed_kernel[ansible_distribution | lower]
             if ansible_distribution | lower in cve_fixed_kernel
             else 'UNKNOWN' }}

    - name: Show the kernel version that contains the fix (debug)
      debug:
        msg: "Minimum kernel with fix for {{ ansible_distribution }}: {{ required_kernel }}"

    - name: Compare running kernel with required version
      vars:
        # Split version strings into numeric components for a simple comparison
        running_parts: "{{ ansible_kernel.split('.') | map('int') | list }}"
        required_parts: "{{ required_kernel.split('.') | map('int') | list }}"
      set_fact:
        kernel_is_new_enough: >-
          {{ (running_parts[0] > required_parts[0]) or
             (running_parts[0] == required_parts[0] and running_parts[1] >= required_parts[1]) }}

    - name: Warn if the kernel does NOT contain the fix
      debug:
        msg: "{{ mitigation_msg }}"
      when: required_kernel != 'UNKNOWN' and not kernel_is_new_enough

    - name: Prompt user to update the kernel (optional, for manual control)
      pause:
        prompt: |
          The host is running a kernel without the CVE‑2026‑31431 fix.
          Would you like to install the latest kernel now? (yes/no)
      register: user_choice
      when: required_kernel != 'UNKNOWN' and not kernel_is_new_enough

    - name: Install the latest kernel package (only if user answered yes)
      package:
        name: "{{ item }}"
        state: latest
      loop: "{{ kernel_packages }}"
      vars:
        # Choose the appropriate kernel package name per distro
        kernel_packages: >-
          {{
            ['kernel']                               if ansible_os_family == 'RedHat' else
            ['linux-image-generic']                  if ansible_os_family == 'Debian' else
            []                                        # fallback – nothing to do
          }}
      when:
        - required_kernel != 'UNKNOWN'
        - not kernel_is_new_enough
        - user_choice.user_input | lower == 'yes'

    - name: Reboot the machine so the new kernel becomes active
      reboot:
        msg: "Reboot initiated by Ansible – CVE‑2026‑31431 mitigation"
        reboot_timeout: 600
      when:
        - required_kernel != 'UNKNOWN'
        - not kernel_is_new_enough
        - user_choice.user_input | lower == 'yes'

    - name: Notify that the host is already protected
      debug:
        msg: |
          ----------------------------------------------------------------
          The running kernel ({{ ansible_kernel }}) already includes the
          fix for CVE‑2026‑31431.  No further action required.
          ----------------------------------------------------------------
      when: required_kernel != 'UNKNOWN' and kernel_is_new_enough

  # ------------------------------------------------------------
  # Handlers (no block structures, as requested)
  # ------------------------------------------------------------
  handlers:
    - name: reload sysctl (not required for this CVE but kept as an example)
      sysctl:
        name: net.ipv4.ip_forward
        value: 0
        state: present
        reload: yes