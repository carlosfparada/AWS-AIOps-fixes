# Mitigation playbook for CVE‑2026‑31431 (algif_aead kernel flaw)
# Only RHEL systems are targeted.  No package or kernel updates are performed.
# The playbook adds the required initcall blacklist boot arguments,
# regenerates the GRUB configuration and reboots the hosts.

- name: Apply CVE‑2026‑31431 mitigation on RHEL
  hosts: "ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-228-227-78.compute-1.amazonaws.com"
  become: true
  vars:
    # boot‑time blacklist entries recommended by Red Hat
    blacklist_args:
      - "initcall_blacklist=algif_aead_init"
      - "initcall_blacklist=af_alg_init"
      - "initcall_blacklist=crypto_authenc_esn_module_init"

  tasks:

    - name: Ensure GRUB_CMDLINE_LINUX contains the required blacklist arguments
      lineinfile:
        path: /etc/default/grub
        # If the line already exists we replace the whole line with the
        # original content plus any missing arguments – this is a simple
        # idempotent operation that does not perform any validation.
        regexp: '^GRUB_CMDLINE_LINUX="([^"]*)"'
        line: >-
          GRUB_CMDLINE_LINUX="{{ '\\1' | regex_replace('\"', '') }}
          {% for arg in blacklist_args %}
          {{ arg }}
          {% endfor %}"
        backrefs: true
      notify: Rebuild GRUB configuration

    - name: Reboot the host to apply new kernel boot parameters
      reboot:
        reboot_timeout: 600
        post_reboot_delay: 30
      when: "'reboot' in ansible_run_tags"

  handlers:

    - name: Rebuild GRUB configuration
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      # The command updates the boot loader with the new kernel cmdline.
      # No checks are performed – the task simply runs the command.

    # The reboot handler can be triggered manually with the tag “reboot”
    # (e.g., ansible-playbook … --tags reboot).  If you always want an
    # immediate reboot, you can remove the condition above and keep the
    # task un‑tagged.