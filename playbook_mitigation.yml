# Playbook: mitigate‑cve‑2026‑31431.yml
# Target: RHEL only – no package or kernel binary updates.
# Mitigation is done by disabling the in‑place operation of algif_aead
# via a kernel command‑line option and a sysctl tunable (example placeholder).

- name: Apply CVE‑2026‑31431 mitigation on RHEL nodes
  hosts: ec2-54-90-135-180.compute-1.amazonaws.com,ec2-34-228-227-78.compute-1.amazonaws.com,https://www.akamai.com/cloud/guides/cve-2026-31431-copy-fail-mitigation
  become: true
  vars:
    # Kernel boot parameter that disables the vulnerable in‑place path
    # (the exact name is taken from Red Hat’s mitigation documentation)
    kernel_boot_param: "algif_aead_inplace=0"
    # Sysctl name that mirrors the boot‑parameter (placeholder)
    sysctl_name: "crypto.algif_aead_inplace"
    sysctl_value: "0"

  tasks:

    - name: Ensure the kernel boot parameter is present in GRUB configuration
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX=.*{{ kernel_boot_param }}.*$'
        line: >-
          {{ (lookup('file', '/etc/default/grub') |
              regex_replace('GRUB_CMDLINE_LINUX="([^"]*)"', 
                            'GRUB_CMDLINE_LINUX="\1 {{ kernel_boot_param }}"')
             ) }}
        backrefs: yes
        state: present

    - name: Regenerate GRUB configuration (RHEL 7/8/9)
      command: >
        {% if ansible_facts['distribution_major_version'] == '7' %}
          grub2-mkconfig -o /boot/grub2/grub.cfg
        {% else %}
          grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
        {% endif %}
      args:
        warn: false

    - name: Create sysctl file for algif_aead mitigation
      copy:
        dest: /etc/sysctl.d/99-algif-aead.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          {{ sysctl_name }} = {{ sysctl_value }}

    - name: Apply the new sysctl setting immediately
      sysctl:
        name: "{{ sysctl_name }}"
        value: "{{ sysctl_value }}"
        state: present
        reload: yes