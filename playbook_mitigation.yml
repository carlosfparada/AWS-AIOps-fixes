# Minimalist Ansible playbook to mitigate CVE‑2025‑38352 on RHEL hosts.
# CVE‑2025‑38352 – race condition in the Linux kernel POSIX CPU timer handling
# (handle_posix_cpu_timers() vs. posix_cpu_timer_del()) can lead to use‑after‑free,
# allowing a local attacker to crash the system or gain higher privileges.
#
# Mitigation strategy:
#   * Install the kernel version that contains the fix (RHEL 9.4+ / RHEL 8.9+).
#   * Reboot if the newly‑installed kernel becomes the default boot entry.

- name: Mitigate CVE‑2025‑38352 on RHEL hosts
  hosts: rhel                 # <-- inventory group containing RHEL machines
  become: true                # required to install packages and reboot
  gather_facts: true

  vars:
    # Minimum kernel version that includes the fix.
    # Adjust according to the RHEL release you manage.
    #   RHEL 9  → 5.14.0‑284.24.1.el9_2
    #   RHEL 8  → 4.18.0‑425.19.2.el8_8
    # Using a simple version check is optional; the playbook will simply
    # install the latest kernel available from the enabled repos.
    kernel_pkg: kernel

  tasks:

    - name: Ensure the latest kernel package is installed
      ansible.builtin.yum:
        name: "{{ kernel_pkg }}"
        state: latest
      register: kernel_install

    - name: Verify that a newer kernel is now the default (if applicable)
      ansible.builtin.command: grubby --default-kernel
      register: default_kernel
      changed_when: false
      when: kernel_install.changed

    - name: Reboot the host to load the fixed kernel
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 30
        msg: "Rebooting to apply kernel fix for CVE‑2025‑38352"
      when: kernel_install.changed
      # The reboot handler will wait until the system is reachable again.

  # -------------------------------------------------------------------------
  # OPTIONAL: Verify the running kernel version after reboot (debug purpose)
  # -------------------------------------------------------------------------
