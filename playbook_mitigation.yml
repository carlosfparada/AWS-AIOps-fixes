# --------------------------------------------------------------
# Mitigate CVE‑2026‑31431 on RHEL hosts without updating any
# packages or the kernel. The mitigation follows the Red Hat
# security bulletin – it disables the in‑place operation of the
# algif_aead crypto interface via a kernel command‑line flag
# (and, where the kernel exposes it, a sysctl knob).
# --------------------------------------------------------------

- name: Mitigate CVE‑2026‑31431 on RHEL nodes
  hosts: ec2-34-228-227-78.compute-1.amazonaws.com,ec2-54-90-135-180.compute-1.amazonaws.com
  become: true                     # we need root to touch GRUB & sysctl
  gather_facts: true

  # ----------------------------------------------------------------
  # Make sure the play runs only on Red Hat based systems.
  # ----------------------------------------------------------------
  pre_tasks:
    - name: Verify target OS is Red Hat Enterprise Linux
      assert:
        that:
          - ansible_os_family == "RedHat"
        fail_msg: "This playbook is intended for RHEL only."

  # ----------------------------------------------------------------
  # 1️⃣  Add a kernel‑command‑line parameter that disables the
  #     in‑place operation of algif_aead.
  # 2️⃣  (Optional) Set a sysctl that accomplishes the same thing
  #     on kernels that expose it.
  # ----------------------------------------------------------------
  tasks:

    - name: Ensure GRUB_CMDLINE_LINUX contains the mitigation flag
      block:
        - name: Read the current GRUB_CMDLINE_LINUX line
          slurp:
            src: /etc/default/grub
          register: grub_file

        - name: Build the new GRUB_CMDLINE_LINUX line
          set_fact:
            new_grub_cmdline: >-
              {{ (grub_file.content|b64decode)
                 | regex_replace('(^GRUB_CMDLINE_LINUX=")(.*)("$)', '\\1\\2 algif_aead=disable\\3')
                 | regex_replace('algif_aead=\\S*', 'algif_aead=disable') }}

        - name: Write back the modified /etc/default/grub
          copy:
            dest: /etc/default/grub
            content: "{{ new_grub_cmdline }}"
            force: yes
          notify: Rebuild GRUB configuration

    - name: (Optional) Disable in‑place algif_aead via sysctl, if supported
      sysctl:
        name: crypto.algif_aead.inplace
        value: 0
        state: present
        reload: yes
      ignore_errors: yes               # Not all kernels expose this knob

  # ----------------------------------------------------------------
  # Handlers – rebuild GRUB and reboot so the new kernel parameter takes effect.
  # ----------------------------------------------------------------
  handlers:
    - name: Rebuild GRUB configuration
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_distribution_major_version | int >= 7

    - name: Reboot the host to apply the new kernel command line
      reboot:
        reboot_timeout: 300
        test_command: whoami      # simple sanity check after reboot
      when: "'algif_aead=disable' in lookup('file', '/etc/default/grub')"