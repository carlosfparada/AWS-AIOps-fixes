####### REASONING #######
# We must provide an Ansible playbook that mitigates the CVE.
# Likely by updating WebKitGTK package to a safe version,
# possibly applying patches, ensuring the package is at latest
# version, and maybe disabling certain features. Provide YAML.
# No extra text. Must only output playbook code. Probably
# include hosts: all, become: true, tasks: update apt/yum,
# ensure version >= fixed. Could use vars for version. Let's
# produce.
#######
---
- name: Mitigate WebKitGTK out-of-bounds write CVE
  hosts: all
  become: true
  vars:
    # Adjust these according to the target OS and the fixed package version
    webkitgtk_pkg: "{{ 'webkit2gtk' if ansible_facts['os_family'] == 'Debian' else 'webkit2gtk3' }}"
    fixed_version_debian: "2.40.5-0ubuntu0.22.04.1"
    fixed_version_rhel: "2.40.5-1.el9"
  tasks:
    - name: Gather package facts
      package_facts:
        manager: auto

    - name: Determine if WebKitGTK is installed
      set_fact:
        webkit_installed: "{{ webkitgtk_pkg in ansible_facts.packages }}"

    - name: Ensure WebKitGTK is at a safe version on Debian/Ubuntu
      when:
        - ansible_facts['os_family'] == 'Debian'
        - webkit_installed
        - ansible_facts.packages[webkitgtk_pkg][0].version is version(fixed_version_debian, '<')
      apt:
        name: "{{ webkitgtk_pkg }}={{ fixed_version_debian }}"
        state: present
        update_cache: yes
        allow_downgrade: yes

    - name: Ensure WebKitGTK is at a safe version on RHEL/CentOS/Fedora
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - webkit_installed
        - ansible_facts.packages[webkitgtk_pkg][0].version is version(fixed_version_rhel, '<')
      yum:
        name: "{{ webkitgtk_pkg }}-{{ fixed_version_rhel }}"
        state: present
        update_cache: yes

    - name: Install latest WebKitGTK if not present (Debian/Ubuntu)
      when:
        - ansible_facts['os_family'] == 'Debian'
        - not webkit_installed
      apt:
        name: "{{ webkitgtk_pkg }}"
        state: latest
        update_cache: yes

    - name: Install latest WebKitGTK if not present (RHEL/CentOS/Fedora)
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - not webkit_installed
      yum:
        name: "{{ webkitgtk_pkg }}"
        state: latest
        update_cache: yes

    - name: Verify WebKitGTK version meets or exceeds fixed version
      assert:
        that:
          - >
            (ansible_facts['os_family'] == 'Debian' and
            (ansible_facts.packages[webkitgtk_pkg][0].version is version(fixed_version_debian, '>='))) or
            (ansible_facts['os_family'] == 'RedHat' and
            (ansible_facts.packages[webkitgtk_pkg][0].version is version(fixed_version_rhel, '>=')))
        fail_msg: "WebKitGTK version is still vulnerable. Manual remediation required."