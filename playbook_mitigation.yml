# CVE‑2026‑31431 mitigation playbook
# --------------------------------------------------------------
# Details:
#   • Vulnerability in the Linux kernel: crypto: algif_aead – 
#     incorrect in‑place operation leading to possible privilege escalation.
#   • Mitigation: update the kernel to a version that contains the 
#     back‑ported fix (see the security bulletin for a detailed procedure).
#
# References:
#   - https://www.cve.org/CVERecord?id=CVE-2026-31431
#   - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
#   - https://access.redhat.com/articles/7141989
#   - https://access.redhat.com/solutions/7141931
#   - https://access.redhat.com/solutions/7141979
#   - https://access.redhat.com/solutions/7141990
#   - https://access.redhat.com/solutions/7141996
#   - https://access.redhat.com/solutions/7142032
#   - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/managing_monitoring_and_updating_the_kernel/configuring-kernel-command-line-parameters_managing-monitoring-and-updating-the-kernel
#   - https://lore.kernel.org/linux-cve-announce/2026042214-CVE-2026-31431-3d65@gregkh/T
#   - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
#
# This playbook updates the kernel on the affected hosts and reboots them.
# --------------------------------------------------------------

- name: Apply CVE‑2026‑31431 mitigation
  hosts: "ec2-54-237-231-50.compute-1.amazonaws.com,ec2-54-198-49-22.compute-1.amazonaws.com"
  become: true
  vars:
    # Desired kernel package name – adjust for your distribution if needed
    kernel_pkg: "{{ 'kernel' if ansible_facts['os_family'] == 'RedHat' else 'linux-image-generic' }}"

  tasks:
    - name: Gather full OS facts
      ansible.builtin.setup:
        gather_subset:
          - hardware
          - network
          - virtual
          - distribution

    - name: Show current kernel version (debug)
      ansible.builtin.debug:
        msg: "Current kernel version on {{ inventory_hostname }}: {{ ansible_facts['kernel'] }}"

    - name: Ensure the latest kernel package is installed
      ansible.builtin.package:
        name: "{{ kernel_pkg }}"
        state: latest
      notify: Reboot the host

    - name: Verify that a patched kernel is installed
      ansible.builtin.command: "rpm -q {{ kernel_pkg }} --qf '%{VERSION}-%{RELEASE}\\n'"  # RedHat‑based
      register: kernel_pkg_info
      changed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify that a patched kernel is installed
      ansible.builtin.command: "dpkg-query -W -f='${Version}\\n' {{ kernel_pkg }}"  # Debian/Ubuntu
      register: kernel_pkg_info
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Display installed kernel package version (debug)
      ansible.builtin.debug:
        msg: "Installed {{ kernel_pkg }} version on {{ inventory_hostname }}: {{ kernel_pkg_info.stdout }}"

    - name: Ensure the bootloader will use the new kernel on next reboot (GRUB2)
      ansible.builtin.command: grub2-set-default 0
      when: ansible_facts['os_family'] == 'RedHat'
      ignore_errors: true   # Some environments may not use GRUB2; ignore if not applicable

    - name: Ensure the bootloader will use the new kernel on next reboot (GRUB on Debian/Ubuntu)
      ansible.builtin.command: grub-set-default 0
      when: ansible_facts['os_family'] == 'Debian'
      ignore_errors: true

  # --------------------------------------------------------------
  # Handlers (no block structures, as requested)
  # --------------------------------------------------------------
  handlers:
    - name: Reboot the host
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami