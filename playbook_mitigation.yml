- name: Mitigate CVE-2026-31431
  hosts: ec2-34-228-227-78.compute-1.amazonaws.com,ec2-54-90-135-180.compute-1.amazonaws.com
  become: true
  tasks:
    - name: Create mitigation documentation file
      copy:
        dest: /etc/mitigations/CVE-2026-31431.txt
        content: |
          CVE-2026-31431 mitigation
          Details:
          In the Linux kernel, the following vulnerability has been resolved:
          crypto: algif_aead - Revert to operating out-of-place
          A flaw was found in the Linux kernel's algif_aead cryptographic algorithm interface. An incorrect in-place operation causes source and destination data mappings to differ during cryptographic processing. A low‑privileged local attacker can exploit this flaw to corrupt the contents of sensitive system files and escalate to root privileges.
          Mitigation:
          See the security bulletin for a detailed mitigation procedure.
          References:
          https://www.cve.org/CVERecord?id=CVE-2026-31431
          https://nvd.nist.gov/vuln/detail/CVE-2026-31431
          https://access.redhat.com/articles/7141989
    - name: Add kernel command line parameter to disable in‑place operation
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="algif_aead_inplace=0"'
        create: yes
      notify:
        - Rebuild GRUB (RedHat)
        - Rebuild GRUB (Debian)

  handlers:
    - name: Rebuild GRUB (RedHat)
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when: ansible_facts['distribution'] in ["RedHat","CentOS","Rocky","AlmaLinux"]
    - name: Rebuild GRUB (Debian)
      command: update-grub
      when: ansible_facts['os_family'] == "Debian"