# --------------------------------------------------------------
# Playbook : cve-2026-53359-mitigation.yml
# Purpose  : Disable KVM nested virtualization on the two
#            EC2 instances that were supplied as targets.
#            (CVE‑2026‑53359 – KVM x86 shadow‑paging use‑after‑free)
# --------------------------------------------------------------

- name: "Mitigate CVE‑2026‑53359 on the affected hosts"
  hosts: >
    ec2-54-196-127-140.compute-1.amazonaws.com,
    ec2-13-217-54-130.compute-1.amazonaws.com
  become: true               # need root to touch /etc/modprobe.d and modprobe
  gather_facts: true

  vars:
    # Name of the mitigation file – keep it descriptive
    mitigation_file: /etc/modprobe.d/cve-2026-53359-mitigation.conf
    mitigation_content: |
      # CVE‑2026‑53359 – KVM shadow‑paging use‑after‑free
      # Mitigation: disable nested virtualization for both Intel and AMD
      options kvm-intel nested=0
      options kvm-amd   nested=0

  tasks:

    - name: "Create the modprobe configuration that disables nested VM"
      copy:
        dest: "{{ mitigation_file }}"
        content: "{{ mitigation_content }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload kvm_intel module
        - Reload kvm_amd module

    # ----------------------------------------------------------
    # 1️⃣  Ensure the modules are **not** loaded (or are re‑loaded)
    # ----------------------------------------------------------
    - name: "Check if kvm_intel is loaded"
      command: lsmod
      register: lsmod_out
      changed_when: false

    - name: "Remove kvm_intel module if it is currently loaded"
      when: "'kvm_intel' in lsmod_out.stdout"
      shell: modprobe -r kvm_intel
      args:
        warn: false
      register: rm_intel
      changed_when: rm_intel.rc == 0

    - name: "Check if kvm_amd is loaded"
      command: lsmod
      register: lsmod_out_amd
      changed_when: false

    - name: "Remove kvm_amd module if it is currently loaded"
      when: "'kvm_amd' in lsmod_out_amd.stdout"
      shell: modprobe -r kvm_amd
      args:
        warn: false
      register: rm_amd
      changed_when: rm_amd.rc == 0

    # ----------------------------------------------------------
    # 2️⃣  (Re)load the modules so they pick up the new options
    # ----------------------------------------------------------
    - name: "Load kvm_intel with the new parameters"
      modprobe:
        name: kvm_intel
        state: present
        params: "nested=0"
      when: "'kvm_intel' not in ansible_facts.modules"

    - name: "Load kvm_amd with the new parameters"
      modprobe:
        name: kvm_amd
        state: present
        params: "nested=0"
      when: "'kvm_amd' not in ansible_facts.modules"

    # ----------------------------------------------------------
    # 3️⃣  Validate that nested virtualization is really disabled
    # ----------------------------------------------------------
    - name: "Read nested‑parameter for kvm_intel (if module present)"
      command: cat /sys/module/kvm_intel/parameters/nested
      register: intel_nested
      ignore_errors: true
      changed_when: false

    - name: "Read nested‑parameter for kvm_amd (if module present)"
      command: cat /sys/module/kvm_amd/parameters/nested
      register: amd_nested
      ignore_errors: true
      changed_when: false

    - name: "Fail if Intel nested virtualization is still enabled"
      fail:
        msg: "Nested virtualization for kvm_intel is still ENABLED (value='{{ intel_nested.stdout }}')"
      when:
        - intel_nested.stdout is defined
        - intel_nested.stdout | trim != "N"

    - name: "Fail if AMD nested virtualization is still enabled"
      fail:
        msg: "Nested virtualization for kvm_amd is still ENABLED (value='{{ amd_nested.stdout }}')"
      when:
        - amd_nested.stdout is defined
        - amd_nested.stdout | trim != "N"

    - name: "Report successful mitigation"
      debug:
        msg: "CVE‑2026‑53359 mitigation applied – nested virtualization disabled."

  # -----------------------------------------------------------------
  # Handlers – they are called only if the mitigation file changes.
  # -----------------------------------------------------------------
  handlers:

    - name: Reload kvm_intel module
      become: true
      shell: |
        modprobe -r kvm_intel 2>/dev/null || true
        modprobe kvm_intel nested=0
      args:
        warn: false

    - name: Reload kvm_amd module
      become: true
      shell: |
        modprobe -r kvm_amd 2>/dev/null || true
        modprobe kvm_amd nested=0
      args:
        warn: false