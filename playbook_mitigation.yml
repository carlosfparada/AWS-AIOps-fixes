---
- name: Mitigate WebKitGTK CVE
  hosts: all
  become: true
  vars:
    webkitgtk_pkg:
      Debian: libwebkit2gtk-4.0-37
      Ubuntu: libwebkit2gtk-4.0-37
      RedHat: WebKitGTK3
      CentOS: WebKitGTK3
      Fedora: WebKitGTK3
      Suse: libwebkit2gtk-4_0-37
  tasks:
    - name: Refresh package cache (APT)
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_pkg_mgr == "apt"

    - name: Refresh package cache (YUM/DNF)
      ansible.builtin.yum:
        update_cache: yes
      when: ansible_pkg_mgr in ["yum", "dnf"]

    - name: Ensure WebKitGTK is at the latest version
      ansible.builtin.package:
        name: "{{ webkitgtk_pkg[ansible_distribution] | default(webkitgtk_pkg[ansible_os_family]) }}"
        state: latest

    - name: Reboot the host if a kernel update occurred
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: ansible_facts.kernel is defined and ansible_facts.kernel != ansible_facts.kernel_version